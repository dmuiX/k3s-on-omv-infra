apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: radar-vso
  annotations:
    crossplane.io/external-name: auth/kubernetes/role/radar-vso
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: radar-vso
    boundServiceAccountNames:
      - radar-vso
    boundServiceAccountNamespaces:
      - radar
    audience: ""
    tokenPolicies:
      - radar-vso-read
    tokenTtl: 3600
    tokenNoDefaultPolicy: true
