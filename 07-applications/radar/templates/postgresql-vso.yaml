apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-vso
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao-radar
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  address: http://openbao-active.openbao.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openbao-radar
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: radar-vso
    serviceAccount: radar-vso
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao-radar
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: radar-postgresql
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: openbao-radar
  mount: database
  path: static-creds/radar
  allowStaticCreds: true
  refreshAfter: 1m
  destination:
    create: true
    name: radar-db-credentials
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        dsn:
          name: dsn
          text: {{ `{{- printf "postgresql://%s:%s@k3s-postgres-rw.cloudnative-pg.svc:5432/radar?sslmode=require" (get .Secrets "username") (get .Secrets "password") -}}` | quote }}
  rolloutRestartTargets:
    - kind: Deployment
      name: radar
