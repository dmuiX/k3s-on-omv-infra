apiVersion: v1
kind: Secret
metadata:
  name: radar-auth
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: radar
    app.kubernetes.io/component: authentication
type: Opaque
data:
  auth-secret: {{ randAlphaNum 64 | b64enc | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: radar
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups:
      - acme.cert-manager.io
      - argoproj.io
      - barmancloud.cnpg.io
      - cert-manager.io
      - cilium.io
      - apiextensions.crossplane.io
      - pkg.crossplane.io
      - postgresql.cnpg.io
      - gateway.networking.k8s.io
      - kyverno.io
      - monitoring.coreos.com
      - reports.kyverno.io
      - secrets.hashicorp.com
      - traefik.io
      - wgpolicyk8s.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews, subjectaccessreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: radar
subjects:
  - kind: ServiceAccount
    name: radar
    namespace: radar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: radar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar-view
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: radar
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: radar:view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: radar
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: radar
spec:
  # Radar intentionally has one replica. Permit voluntary disruption rather
  # than claiming availability that the application cannot provide.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar
      app.kubernetes.io/instance: radar
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: radar
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: radar
spec:
  namespaceSelector:
    matchNames: [radar]
  selector:
    matchLabels:
      app.kubernetes.io/name: radar
      app.kubernetes.io/instance: radar
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
