# yaml-language-server: $schema=../values-schemas/k8up/values.schema.json
# Two leader-elected controllers keep reconciliation available during one node outage.
replicaCount: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: k8up
        topologyKey: kubernetes.io/hostname
k8up:
  timezone: Europe/Berlin
  enableLeaderElection: true
  skipWithoutAnnotation: false
  globalResources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 256Mi
