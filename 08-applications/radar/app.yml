apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  destination:
    name: in-cluster
    namespace: radar
  project: default
  source:
    repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 08-applications/radar/workload
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
