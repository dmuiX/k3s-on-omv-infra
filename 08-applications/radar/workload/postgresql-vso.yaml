apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-vso
  namespace: radar
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao-radar
  namespace: radar
spec:
  address: http://openbao-active.openbao.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openbao-radar
  namespace: radar
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: radar-vso
    serviceAccount: radar-vso
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao-radar
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: radar-postgresql
  namespace: radar
spec:
  vaultAuthRef: openbao-radar
  mount: database
  path: static-creds/radar
  allowStaticCreds: true
  refreshAfter: 1m
  destination:
    create: true
    name: radar-db-credentials
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
