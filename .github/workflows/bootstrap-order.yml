name: Bootstrap dependency order
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source for cross-repository review
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/infra-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: infra-source
          path: ${{ runner.temp }}/infra-source.tar.gz
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -p 'test_bootstrap_order.py' -v
