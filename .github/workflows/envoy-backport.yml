name: Gateway Envoy backport candidate
on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * *'
  push:
    branches: [main]
    paths: ['ci/envoy/**', '.github/workflows/envoy-backport.yml', '01-bootstrap/istio/app.yml']
permissions: {}
concurrency:
  group: gateway-backport
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && github.repository == 'dmuiX/k3s-on-omv-infra' && vars.ENVOY_BACKPORT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, pull-requests: read}
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - if: github.event_name == 'schedule'
        id: refresh
        run: python3 ci/envoy/refresh.py
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.refresh.outputs.changed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=true
          if [[ $EVENT == schedule ]]; then
            version=$(jq -er .istio ci/envoy/lock.json)
            count=$(gh pr list --state open --head "ci/envoy-lock-$version" --json number --jq length)
            if [[ $CHANGED != true || $count != 0 ]]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: source-lock, path: ci/envoy/lock.json}
  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # Dedicated ephemeral hosted runners with >= 100 GiB free. No LAN access.
    runs-on: ${{ matrix.arch == 'amd64' && (vars.ENVOY_RUNNER_AMD64 || 'unset-envoy-amd64-runner') || (vars.ENVOY_RUNNER_ARM64 || 'unset-envoy-arm64-runner') }}
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: source-lock, path: ci/envoy}
      - name: Check native runner and disk budget
        env: {ARCH: '${{ matrix.arch }}'}
        run: |
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1;; esac
          test "$(df -Pk "$RUNNER_TEMP" | awk 'END{print $4}')" -ge 104857600
          test "$(df -Pk /var/lib/docker | awk 'END{print $4}')" -ge 104857600
      - name: Test stock; backport and build only on the expected regression
        id: build
        run: bash ci/envoy/build.sh
      - name: Record architecture result
        env:
          MODE: ${{ steps.build.outputs.mode }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=ghcr.io/dmuix/istio-proxyv2
          case "$MODE" in
            patched)
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              trap 'docker logout ghcr.io >/dev/null' EXIT
              ref="$repo:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
              docker tag envoy-candidate:local "$ref"; docker push "$ref"
              digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}');;
            stock) digest=$(jq -r '.stock|split("@")[1]' ci/envoy/lock.json);;
            *) exit 1;;
          esac
          [[ $digest =~ ^sha256:[[:xdigit:]]{64}$ ]]
          jq -n --arg mode "$MODE" --arg digest "$digest" '{mode:$mode,digest:$digest}' > "$ARCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.arch }}
          path: ${{ matrix.arch }}.json
  propose:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: 'candidate-*', path: receipts, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: source-lock, path: ci/envoy}
      - name: Propose candidate; never deploy from CI
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mode=$(jq -er .mode receipts/amd64.json); test "$mode" = "$(jq -er .mode receipts/arm64.json)"
          repo=ghcr.io/dmuix/istio-proxyv2
          refs=(); for arch in amd64 arm64; do
            d=$(jq -er .digest "receipts/$arch.json"); [[ $d =~ ^sha256:[0-9a-f]{64}$ ]]; refs+=("$repo@$d")
          done
          if [[ $mode == patched ]]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null' EXIT
            ref="$repo:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker buildx imagetools create -t "$ref" "${refs[@]}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          else digest=$(jq -er '.stock|split("@")[1]' ci/envoy/lock.json); fi
          version=$(jq -er .istio ci/envoy/lock.json)
          branch="ci/gateway-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! git diff --quiet -- ci/envoy/lock.json; then
            branch="ci/envoy-lock-$version" # do not cross-grade a running control plane
          else
            python3 ci/envoy/promote.py "$mode" "$digest"
          fi
          git diff --quiet && exit 0
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          git switch -c "$branch"; git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -- ci/envoy/lock.json 01-bootstrap/istio-gateway/resources/gateway-config.yaml
          git commit -m "chore(gateway): propose $mode proxy image"; git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "Gateway candidate: $mode" --body "Candidate $digest. Before merge: verify digest, artifact scan and canary playback, seek, and stream drain. Roll back by reverting this change."
