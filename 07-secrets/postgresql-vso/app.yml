apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-vso-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  destination:
    name: in-cluster
    namespace: postgresql
  project: default
  source:
    repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: 753985bad19f8b5ba5ad3be6178ae0b224b81b69
    path: 07-secrets/postgresql-vso/workload
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
