apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8up-backup-validation
spec:
  schedule: '15 5 * * *'
  timeZone: Europe/Berlin
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      # The TTL controller also covers supervised Jobs cloned from this template.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k8up-restore-test
            istio.io/dataplane-mode: none
            sidecar.istio.io/inject: 'false'
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: restore
              terminationMessagePolicy: FallbackToLogsOnError
              image: ghcr.io/k8up-io/k8up:v2.16.1@sha256:f59bfa37c51511d5ad67e53816fb55c62d0e6411890e59bb6b965923129f30b5
              command: [/bin/sh, /tools/restore.sh]
              args: [backup-validation, '172800']
              env:
                - {name: TMPDIR, value: /scratch}
                - name: RESTIC_REPOSITORY
                  value: /repository
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: k8up-repository, key: password}
              securityContext: &hardened
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              volumeMounts:
                - {name: repository, mountPath: /repository, readOnly: true}
                - {name: scratch, mountPath: /scratch}
                - {name: tools, mountPath: /tools, readOnly: true}
          containers:
            - name: verify
              terminationMessagePolicy: FallbackToLogsOnError
              image: python:3.15.2-slim-trixie@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
              command: [/usr/local/bin/python, -IB, /tools/verify.py]
              args: [backup-validation]
              securityContext: *hardened
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - {name: scratch, mountPath: /scratch, readOnly: true}
                - {name: tools, mountPath: /tools, readOnly: true}
          volumes:
            - name: repository
              persistentVolumeClaim: {claimName: k8up-omv-repository, readOnly: true}
            - name: tools
              configMap: {name: k8up-restore-tools, defaultMode: 0444}
            - name: scratch
              ephemeral:
                volumeClaimTemplate:
                  metadata:
                    annotations:
                      k8up.io/backup: 'false'
                  spec:
                    storageClassName: longhorn-single-node-delete
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests: {storage: 256Mi}
