apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-pki-reconciler
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-pki-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-pki-reconciler
          annotations:
            security.banzaicloud.io/mutate: skip
        spec:
          serviceAccountName: openbao-pki-reconciler
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
              command: [python3, -B, /config/reconcile.py]
              env:
                - name: OPENBAO_ADDR
                  value: http://openbao-active.openbao.svc.cluster.local:8200
              resources:
                requests:
                  cpu: 20m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: identity
                  mountPath: /run/identity
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: openbao-pki-reconciler
            - name: identity
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: openbao-pki-reconciler
                      expirationSeconds: 600
