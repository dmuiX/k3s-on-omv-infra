apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-vault
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-vault
  deploymentTemplate:
    spec:
      selector:
        matchLabels:
          pkg.crossplane.io/provider: provider-vault
      template:
        metadata:
          labels:
            pkg.crossplane.io/provider: provider-vault
        spec:
          serviceAccountName: provider-vault
          containers:
            - name: package-runtime
              resources:
                requests: {cpu: 25m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.upbound.io/upbound/provider-vault:v4.0.4
  runtimeConfigRef:
    name: provider-vault
