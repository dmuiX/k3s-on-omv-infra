apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: grafana-vso
  annotations:
    crossplane.io/external-name: auth/kubernetes/role/grafana-vso
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: grafana-vso
    boundServiceAccountNames:
      - grafana-vso
    boundServiceAccountNamespaces:
      - kube-prometheus-stack
    audience: ""
    tokenPolicies:
      - grafana-vso-read
    tokenTtl: 3600
    tokenNoDefaultPolicy: true
