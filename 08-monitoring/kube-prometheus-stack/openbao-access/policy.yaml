apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: grafana-vso-read
  annotations:
    crossplane.io/external-name: grafana-vso-read
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  providerConfigRef:
    name: openbao
  forProvider:
    name: grafana-vso-read
    policy: |
      path "auth/token/renew-self" {
        capabilities = ["update"]
      }

      path "database/static-creds/grafana" {
        capabilities = ["read"]
      }
