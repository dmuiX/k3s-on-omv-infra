apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-postgresql-reader
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  address: http://openbao-active.openbao.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-postgresql-reader
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: grafana-postgresql-reader
    serviceAccount: grafana-postgresql-reader
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: grafana-postgresql
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: grafana-postgresql-reader
  mount: database
  path: static-creds/grafana
  allowStaticCreds: true
  refreshAfter: 1m
  destination:
    create: true
    name: grafana-db-credentials
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: kube-prometheus-stack-grafana
