apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-k8up-vso
  namespace: kube-prometheus-stack
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: prometheus-k8up-vso
  namespace: kube-prometheus-stack
spec:
  vaultConnectionRef: openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: prometheus-k8up-vso
    serviceAccount: prometheus-k8up-vso
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: prometheus-k8up-repository
  namespace: kube-prometheus-stack
spec:
  vaultAuthRef: prometheus-k8up-vso
  mount: kv
  type: kv-v2
  path: k8up/repository-password
  refreshAfter: 1h
  destination:
    create: true
    name: prometheus-k8up-repository
    transformation:
      excludeRaw: true
      templates:
        password:
          text: |-
            {{- $value := get .Secrets "password" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: password" -}}
            {{- end -}}
            {{- $value -}}
