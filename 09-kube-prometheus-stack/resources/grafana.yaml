apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-vso
  namespace: kube-prometheus-stack
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao
  namespace: kube-prometheus-stack
spec:
  address: "http://openbao-active.openbao.svc.cluster.local:8200"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-vso
  namespace: kube-prometheus-stack
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: openbao
  kubernetes:
    role: grafana-vso
    serviceAccount: grafana-vso
