apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-vso
  namespace: kube-prometheus-stack
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-vso
  namespace: kube-prometheus-stack
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator/default
  kubernetes:
    role: grafana-vso
    serviceAccount: grafana-vso
