apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-ztunnel
  namespace: kube-prometheus-stack
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - istio-system
  selector:
    matchLabels:
      app.kubernetes.io/name: ztunnel
  podMetricsEndpoints:
    - port: ztunnel-stats
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-ingress-gateway
  namespace: kube-prometheus-stack
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - istio-gateway
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: istio-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
