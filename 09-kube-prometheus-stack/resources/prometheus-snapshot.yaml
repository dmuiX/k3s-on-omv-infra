apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-snapshot-contract-v1
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    platform.k3s-on-omv.io/tool-image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
immutable: true
data:
  source: prometheus-kube-prometheus-stack-prometheus-0 only
  mechanism: Native Prometheus admin API snapshot streamed by a K8up Backup from the pipeline; the live TSDB is never copied.
  endpoint: POST http://prometheus-kube-prometheus-stack-prometheus-0.prometheus-operated.kube-prometheus-stack.svc:9090/api/v1/admin/tsdb/snapshot?skip_head=false
  repository: A dynamic SMB PVC mounted as the K8up local repository; no R2 consumer or fallback.
  cleanup: The pipeline deletes only the exact native snapshot after its isolated restore passes.
  snapshot.py: |
    from contextlib import closing, contextmanager
    from http.client import HTTPConnection, HTTPException
    import json
    import os
    from pathlib import Path
    import re
    import stat
    import sys
    import tarfile
    from tempfile import NamedTemporaryFile
    from typing import BinaryIO, IO, Iterator

    HOST = "prometheus-kube-prometheus-stack-prometheus-0.prometheus-operated.kube-prometheus-stack.svc"
    SNAPSHOT_API = "/api/v1/admin/tsdb/snapshot?skip_head=false"
    PENDING = ".k8up-pending"  # Also blocks (and is blocked by) the legacy producer.
    UID = re.compile(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}")
    SNAPSHOT = re.compile(r"[0-9]{8}T[0-9]{6}Z-[0-9a-f]{16}")  # Prometheus v3.15


    DirectoryIdentity = tuple[int, int]
    Binding = tuple[str, DirectoryIdentity]


    def marker_bytes(backup_uid: str, binding: Binding | None = None) -> bytes:
        if not UID.fullmatch(backup_uid):
            raise ValueError("missing or invalid K8up Backup UID")
        marker: dict[str, int | str] = {"version": 1, "backup_uid": backup_uid}
        if binding is None:
            marker["stage"] = "intent"
        else:
            name, (dev, ino) = binding
            if not isinstance(name, str) or not SNAPSHOT.fullmatch(name):
                raise ValueError("invalid native snapshot name")
            if type(dev) is not int or type(ino) is not int or dev < 0 or ino <= 0:
                raise ValueError("invalid native snapshot directory identity")
            marker.update(
                stage="snapshot_ready", snapshot_name=name, st_dev=dev, st_ino=ino
            )
        return (json.dumps(marker, sort_keys=True) + "\n").encode("ascii")


    def read_binding(root_fd: int, backup_uid: str) -> Binding:
        fd = os.open(PENDING, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=root_fd)
        with os.fdopen(fd, "rb") as marker:
            info = os.fstat(marker.fileno())
            if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                raise ValueError("unsafe recovery marker")
            record = marker.read(512)
        payload = json.loads(record)
        try:
            binding = payload["snapshot_name"], (payload["st_dev"], payload["st_ino"])
        except (KeyError, TypeError):
            raise ValueError("incomplete ready binding") from None
        if marker_bytes(backup_uid, binding) != record:
            raise ValueError("recovery marker does not match the exact ready binding")
        return binding


    def directory_identity(info: os.stat_result) -> DirectoryIdentity:
        if not stat.S_ISDIR(info.st_mode):
            raise ValueError("snapshot path is not a directory")
        return info.st_dev, info.st_ino


    @contextmanager
    def directory_fd(path: Path | str, *, dir_fd: int | None = None) -> Iterator[int]:
        fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=dir_fd)
        try:
            yield fd
        finally:
            os.close(fd)


    def write_durable(file: IO[bytes], record: bytes) -> None:
        file.write(record)
        file.flush()
        os.fsync(file.fileno())


    def request_snapshot() -> str:
        # A single request: a timeout, redirect or invalid reply must not trigger a retry.
        with closing(HTTPConnection(HOST, 9090, timeout=60)) as connection:
            connection.request("POST", SNAPSHOT_API)
            with connection.getresponse() as response:
                if response.status != 200:
                    raise ValueError("Prometheus snapshot request failed")
                payload = json.load(response)
        if isinstance(payload, dict) and payload.get("status") == "success":
            data = payload.get("data")
            if isinstance(data, dict) and isinstance(name := data.get("name"), str):
                return name
        raise ValueError("invalid Prometheus snapshot response")


    def stream_snapshot(root: Path, backup_uid: str, output: BinaryIO) -> None:
        intent = marker_bytes(backup_uid)
        with directory_fd(root) as root_fd:
            # Any existing entry, including a legacy or incomplete marker, blocks the POST.
            fd = os.open(
                PENDING, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600, dir_fd=root_fd
            )
            with os.fdopen(fd, "wb") as marker:
                write_durable(marker, intent)
            os.fsync(root_fd)

            name = request_snapshot()
            if not SNAPSHOT.fullmatch(name):
                raise ValueError("invalid native snapshot name")
            with directory_fd(name, dir_fd=root_fd) as snapshot_fd:
                original = directory_identity(os.fstat(snapshot_fd))
                ready = marker_bytes(backup_uid, (name, original))
                # Keep the durable intent visible until a complete binding can replace it.
                with NamedTemporaryFile(
                    dir=root, prefix=".k8up-finalizing-", delete=False
                ) as final:
                    write_durable(final.file, ready)
                os.replace(
                    Path(final.name).name, PENDING, src_dir_fd=root_fd, dst_dir_fd=root_fd
                )
                os.fsync(root_fd)
                if directory_identity((root / name).lstat()) != original:
                    raise ValueError("native snapshot replaced before streaming")
                with tarfile.open(fileobj=output, mode="w|") as archive:
                    # The trailing /. makes lstat see the directory, not the procfs link.
                    archive.add(f"/proc/self/fd/{snapshot_fd}/.", arcname=name)
                if directory_identity((root / name).lstat()) != original:
                    raise ValueError("native snapshot replaced while streaming")


    if __name__ == "__main__":
        try:
            stream_snapshot(
                Path("/snapshots"),
                os.environ.get("K8UP_BACKUP_UID", ""),
                sys.stdout.buffer,
            )
        except (OSError, ValueError, HTTPException, tarfile.TarError) as exc:
            sys.exit(f"snapshot stream failed: {exc}")
---
# K8up creates this pod for the pipeline's uniquely named Backup. Its command asks
# Prometheus for a consistent snapshot, validates the returned name, and sends
# only that immutable snapshot to Restic on stdout.
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: prometheus-tsdb-snapshot
  namespace: kube-prometheus-stack
  labels:
    platform.k3s-on-omv.io/backup-set: prometheus-tsdb
spec:
  fileExtension: tar
  backupCommand: /usr/local/bin/python /tools/snapshot.py
  pod:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  statefulset.kubernetes.io/pod-name: prometheus-kube-prometheus-stack-prometheus-0
              topologyKey: kubernetes.io/hostname
      containers:
        - name: snapshot
          image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
          env:
            - name: K8UP_BACKUP_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['k8up.io/ownerBackupUID']
          command:
            - /usr/local/bin/python
            - -c
          args:
            - "import time; time.sleep(31536000)"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: prometheus-data
              mountPath: /snapshots
              subPath: prometheus-db/snapshots
            - name: snapshot-tool
              mountPath: /tools
              readOnly: true
      volumes:
        # The pipeline init prepares snapshots inside the Operator's prometheus-db subPath.
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
        - name: snapshot-tool
          configMap:
            name: prometheus-snapshot-contract-v1
            defaultMode: 0444
