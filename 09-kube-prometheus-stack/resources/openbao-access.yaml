apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: alertmanager-vso-read
spec:
  deletionPolicy: Orphan
  forProvider:
    name: alertmanager-vso-read
    policy: "path \"auth/token/renew-self\" { capabilities = [\"update\"] }\npath \"kv/data/monitoring/alertmanager-config\" { capabilities = [\"read\"] }\npath \"kv/metadata/monitoring/alertmanager-config\" { capabilities = [\"read\"] }\n"
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: alertmanager-vso
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: alertmanager-vso
    boundServiceAccountNames:
      - kube-prometheus-stack-alertmanager
    boundServiceAccountNamespaces:
      - kube-prometheus-stack
    tokenPolicies:
      - alertmanager-vso-read
    tokenTtl: 3600
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: prometheus-k8up-vso
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: prometheus-k8up-vso
    boundServiceAccountNames:
      - prometheus-k8up-vso
    boundServiceAccountNamespaces:
      - kube-prometheus-stack
    tokenPolicies:
      - k8up-validation-vso-read
    tokenTtl: 900
  providerConfigRef:
    name: openbao
