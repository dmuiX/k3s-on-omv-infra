apiVersion: v1
kind: Namespace
metadata:
  name: node-exporter
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
  labels:
    # Host namespaces and read-only hostPath mounts are essential to node metrics.
    # The exporter still runs non-root with no capabilities or privilege escalation.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
