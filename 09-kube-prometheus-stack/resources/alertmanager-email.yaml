apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: alertmanager-vso
  namespace: kube-prometheus-stack
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator/default
  kubernetes:
    role: alertmanager-vso
    serviceAccount: kube-prometheus-stack-alertmanager
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-smtp
  namespace: kube-prometheus-stack
spec:
  vaultAuthRef: alertmanager-vso
  mount: kv
  type: kv-v2
  path: monitoring/alertmanager-config
  refreshAfter: 1h
  destination:
    create: true
    name: alertmanager-platform-config
    type: Opaque
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        alertmanager.yaml:
          text: |-
            {{- $smarthost := get .Secrets "smarthost" -}}
            {{- $from := get .Secrets "from" -}}
            {{- $to := get .Secrets "to" -}}
            {{- $username := get .Secrets "username" -}}
            {{- $password := get .Secrets "password" -}}
            global:
              smtp_smarthost: {{ template "requiredValue" (dict "key" "smarthost" "value" (and $smarthost (printf "%q" $smarthost))) }}
              smtp_from: {{ template "requiredValue" (dict "key" "from" "value" (and $from (printf "%q" $from))) }}
              smtp_auth_username: {{ template "requiredValue" (dict "key" "username" "value" (and $username (printf "%q" $username))) }}
              smtp_auth_password: {{ template "requiredValue" (dict "key" "password" "value" (and $password (printf "%q" $password))) }}
              smtp_require_tls: true
            route:
              receiver: email
              group_by:
                - namespace
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: email
                email_configs:
                  - to: {{ template "requiredValue" (dict "key" "to" "value" (and $to (printf "%q" $to))) }}
                    send_resolved: true
