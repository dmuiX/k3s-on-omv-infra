apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: alertmanager-vso
  namespace: kube-prometheus-stack
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: openbao
  kubernetes:
    role: alertmanager-vso
    serviceAccount: kube-prometheus-stack-alertmanager
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-smtp
  namespace: kube-prometheus-stack
spec:
  vaultAuthRef: alertmanager-vso
  mount: kv
  type: kv-v2
  path: monitoring/alertmanager-config
  refreshAfter: 1h
  destination:
    create: true
    name: alertmanager-platform-config
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        alertmanager.yaml:
          text: |-
            {{- $smarthost := get .Secrets "smarthost" -}}
            {{- $from := get .Secrets "from" -}}
            {{- $to := get .Secrets "to" -}}
            {{- $username := get .Secrets "username" -}}
            {{- $password := get .Secrets "password" -}}
            {{- if or (empty $smarthost) (empty $from) (empty $to) (empty $username) (empty $password) -}}
            {{- fail "missing required OpenBao key: monitoring/alertmanager-config requires smarthost, from, to, username, and password" -}}
            {{- end -}}
            global:
              smtp_smarthost: {{ printf "%q" $smarthost }}
              smtp_from: {{ printf "%q" $from }}
              smtp_auth_username: {{ printf "%q" $username }}
              smtp_auth_password: {{ printf "%q" $password }}
              smtp_require_tls: true
            route:
              receiver: email
              group_by:
                - namespace
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: email
                email_configs:
                  - to: {{ printf "%q" $to }}
                    send_resolved: true
