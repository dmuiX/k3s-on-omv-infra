apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-admin-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  namespace: kube-prometheus-stack
automountServiceAccountToken: false
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: grafana-admin-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  deletionPolicy: Orphan
  forProvider:
    name: grafana-admin-provisioner
    policy: |
      path "kv/data/monitoring/grafana-admin" { capabilities = ["read", "create"] }
      path "kv/metadata/monitoring/grafana-admin" { capabilities = ["read"] }
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: grafana-admin-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: grafana-admin-provisioner
    boundServiceAccountNames:
    - grafana-admin-provisioner
    boundServiceAccountNamespaces:
    - kube-prometheus-stack
    audience: vault://grafana-admin-provisioner
    tokenPolicies:
    - grafana-admin-provisioner
    tokenTtl: 900
    tokenMaxTtl: 900
  providerConfigRef:
    name: openbao
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-admin-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  namespace: kube-prometheus-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-admin-provisioner
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
      podSelector:
        matchLabels:
          app.kubernetes.io/name: openbao
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 15008
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-admin-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  namespace: kube-prometheus-stack
data:
  provision.py: |
    import sys
    sys.path.insert(0, "/helper")
    from credential_helpers import Failure, ensure, fields, login, random_value, run

    def main():
        token = login("grafana-admin-provisioner")

        def admin_validate(data):
            fields(data, "admin-user", "admin-password")
            if data["admin-user"] != "admin":
                raise Failure("Unexpected Grafana administrator identity")

        ensure(token, "monitoring/grafana-admin", lambda: {
            "admin-user": "admin", "admin-password": random_value()}, admin_validate)

    if __name__ == "__main__":
        run(main)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-admin-provisioner
  namespace: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '-1'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-admin-provisioner
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: grafana-admin-provisioner
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
        command:
        - python3
        - -B
        - /config/provision.py
        env:
        - name: TMPDIR
          value: /work
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: work
          mountPath: /work
        - name: openbao-auth
          mountPath: /var/run/openbao
          readOnly: true
        - name: helper
          mountPath: /helper
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: grafana-admin-provisioner
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: openbao-auth
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: vault://grafana-admin-provisioner
              expirationSeconds: 900
      - name: helper
        configMap:
          name: credential-custody
