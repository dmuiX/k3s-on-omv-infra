apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-admin-bootstrap
  namespace: kube-prometheus-stack
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-admin-provisioner
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: grafana-admin-provisioner
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
        command:
        - python3
        - -B
        - /config/provision.py
        env:
        - name: TMPDIR
          value: /work
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: work
          mountPath: /work
        - name: openbao-auth
          mountPath: /var/run/openbao
          readOnly: true
        - name: helper
          mountPath: /helper
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: grafana-admin-provisioner
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: openbao-auth
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: vault://grafana-admin-provisioner
              expirationSeconds: 900
      - name: helper
        configMap:
          name: credential-custody
