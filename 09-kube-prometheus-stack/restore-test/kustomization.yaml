apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-prometheus-stack
resources:
  - ../../adapters/k8up-restore
  - ../../adapters/k8up-pipeline
  - pipeline.yaml
configMapGenerator:
  - name: prometheus-backup-pipeline
    files: [pipeline.py]
    options:
      immutable: true
patches:
  - path: prometheus.patch
    target: {kind: CronJob, name: k8up-restore-template}
    options: {allowNameChange: true}
