apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: kube-prometheus-stack
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1
    helm:
      valueFiles:
      - $live/infra/helm-values/kube-prometheus-stack.yml
      valuesObject:
        crds:
          enabled: false
        prometheus:
          prometheusSpec:
            replicas: 2
            enableAdminAPI: true
            retention: 15d
            retentionSize: 18GB
            nodeSelector:
              monitoring: 'true'
            podAntiAffinity: hard
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-monitoring
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: '1'
                memory: 2Gi
        alertmanager:
          alertmanagerSpec:
            replicas: 0
            nodeSelector:
              monitoring: 'true'
            podAntiAffinity: hard
            configSecret: alertmanager-platform-config
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-monitoring
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
        grafana:
          replicas: 2
          # Hard anti-affinity leaves no third monitoring node for a surge pod.
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          nodeSelector:
            monitoring: 'true'
          # Live configures external PostgreSQL for durable Grafana state.
          # Local caches and provisioned files are disposable across replicas.
          persistence:
            enabled: false
          podDisruptionBudget:
            minAvailable: 1
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
                topologyKey: kubernetes.io/hostname
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        prometheus-node-exporter:
          # Only host collectors require a Pod Security exception, not Grafana/Prometheus.
          namespaceOverride: node-exporter
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
        kubeApiServer:
          serviceMonitor:
            metricRelabelings:
            - sourceLabels:
              - __name__
              regex: (apiserver_watch_events_dispatch_duration_seconds|apiserver_storage_list_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_cache_initialization_duration_seconds|etcd_request_duration_seconds)_(bucket|sum|count)
              action: drop
        kube-state-metrics:
          customResourceState:
            enabled: true
            config:
              spec:
                resources:
                - groupVersionKind:
                    group: coordination.k8s.io
                    version: v1
                    kind: Lease
                  labelsFromPath:
                    result:
                    - metadata
                    - annotations
                    - platform.example.io/result
                  metricNamePrefix: restore
                  metrics:
                  - name: status
                    help: Restore status lease
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          lease:
                          - metadata
                          - name
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    path: infra/kube-prometheus-stack
    ref: live
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 09-kube-prometheus-stack/resources
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
