apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tls-certificates
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: istio-gateway
  sources:
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: main
      path: 00-bootstrap/tls-certificates/resources
    - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
      targetRevision: main
      path: infra/letsencrypt-dns01
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
