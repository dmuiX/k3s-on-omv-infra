apiVersion: batch/v1
kind: Job
metadata:
  name: k8up-canary-seed-v1
spec:
  # Retain the completed declarative Job: TTL + Argo self-heal would re-run it.
  # Start only in a supervised RWO maintenance window, before the fixture backup.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8up-restore-drill
        istio.io/dataplane-mode: none
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
          command: [/usr/local/bin/python, -IB, /tools/seed.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: fixture, mountPath: /canary}
            - {name: tool, mountPath: /tools, readOnly: true}
      volumes:
        - name: fixture
          persistentVolumeClaim: {claimName: k8up-validation-canary}
        - name: tool
          configMap: {name: k8up-canary-seed, defaultMode: 0444}
