apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: k8up-validation-vso
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: k8up-validation-vso
    boundServiceAccountNames:
      - k8up-validation-vso
    boundServiceAccountNamespaces:
      - backup-validation
    tokenPolicies:
      - k8up-validation-vso-read
      - platform-r2-read
    tokenTtl: 900
  providerConfigRef:
    name: openbao
