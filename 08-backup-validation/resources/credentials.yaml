apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-validation-vso
  namespace: backup-validation
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: k8up-validation-vso
  namespace: backup-validation
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: k8up-validation-vso
    serviceAccount: k8up-validation-vso
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: k8up-repository
  namespace: backup-validation
spec:
  vaultAuthRef: k8up-validation-vso
  mount: kv
  type: kv-v2
  path: k8up/repository-password
  refreshAfter: 1h
  destination:
    create: true
    name: k8up-repository
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        password:
          text: '{{ template "requiredValue" (dict "key" "password" "value" .Secrets.password) }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-validation-r2
  namespace: backup-validation
spec:
  vaultAuthRef: k8up-validation-vso
  mount: kv
  type: kv-v2
  path: platform/r2
  refreshAfter: 1h
  destination:
    create: true
    name: postgresql-validation-r2
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        access-key-id:
          text: '{{ template "requiredValue" (dict "key" "access-key-id" "value" (get .Secrets "access-key-id")) }}'
        secret-access-key:
          text: '{{ template "requiredValue" (dict "key" "secret-access-key" "value" (get .Secrets "secret-access-key")) }}'
        AWS_ACCESS_KEY_ID:
          text: '{{ template "requiredValue" (dict "key" "access-key-id" "value" (get .Secrets "access-key-id")) }}'
        AWS_SECRET_ACCESS_KEY:
          text: '{{ template "requiredValue" (dict "key" "secret-access-key" "value" (get .Secrets "secret-access-key")) }}'
        AWS_REGION:
          text: '{{ template "requiredValue" (dict "key" "region" "value" .Secrets.region) }}'
        S3_ENDPOINT:
          text: '{{ template "requiredValue" (dict "key" "endpoint" "value" .Secrets.endpoint) }}'
