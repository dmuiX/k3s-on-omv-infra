apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8up-canary-seed-template
spec:
  schedule: '15 9 * * *'
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 180
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k8up-restore-test
            platform.k3s-on-omv.io/fixture-child: 'true'
            istio.io/dataplane-mode: none
            sidecar.istio.io/inject: 'false'
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: seed
              image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
              command: [/usr/local/bin/python, -IB, /tools/seed.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
              volumeMounts:
                - {name: fixture, mountPath: /canary}
                - {name: tool, mountPath: /tools, readOnly: true}
          volumes:
            - name: fixture
              persistentVolumeClaim: {claimName: k8up-validation-canary}
            - name: tool
              configMap: {name: k8up-canary-seed-v1, defaultMode: 0444}
