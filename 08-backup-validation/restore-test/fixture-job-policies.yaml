  matchConditions:
    - name: pipeline-service-account
      expression: "request.userInfo.username == 'system:serviceaccount:backup-validation:k8up-fixture-pipeline'"
    - name: job-stage
      expression: "object.metadata.name.startsWith('fixture-verify-')"
  variables:
    - name: job
      expression: dyn(object.spec)
    - name: source
      expression: dyn(params.spec.jobTemplate.spec)
    - name: podUID
      expression: >-
        has(request.userInfo.extra) && 'authentication.kubernetes.io/pod-uid' in request.userInfo.extra &&
        size(request.userInfo.extra['authentication.kubernetes.io/pod-uid']) == 1 ?
        request.userInfo.extra['authentication.kubernetes.io/pod-uid'][0] : ''
    - name: generatedPodLabels
      expression: >-
