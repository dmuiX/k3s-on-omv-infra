apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backup-validation
resources:
  - ../../adapters/k8up-restore
configMapGenerator:
  # Stable, versioned reference for the separately created manual/seed-job.yaml.
  - name: k8up-canary-seed-v1
    options:
      disableNameSuffixHash: true
      immutable: true
    files: [seed.py]
