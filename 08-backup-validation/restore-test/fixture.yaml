apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-fixture-pipeline
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8up-fixture-pipeline-read-cutover
rules:
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [backup-validation]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8up-fixture-pipeline-read-cutover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8up-fixture-pipeline-read-cutover
subjects:
  - kind: ServiceAccount
    name: k8up-fixture-pipeline
    namespace: backup-validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8up-fixture-pipeline
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [k8up-canary-seed-template, k8up-backup-validation-verify]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
  - apiGroups: [k8up.io]
    resources: [backups, checks]
    verbs: [get, list, create]
  - apiGroups: [k8up.io]
    resources: [schedules, prunes, archives, restores, prebackuppods]
    verbs: [list]
  - apiGroups: [k8up.io]
    resources: [podconfigs]
    resourceNames: [fixture-k8up-omv-v1]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8up-fixture-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8up-fixture-pipeline
subjects:
  - kind: ServiceAccount
    name: k8up-fixture-pipeline
    namespace: backup-validation
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8up-fixture-runner-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: k8up-restore-test
      platform.k3s-on-omv.io/fixture-runner: 'true'
  policyTypes: [Egress]
  # As in Live's backup-validation API policy: pre- and post-DNAT tuples.
  # The shared app label excludes these Pods from all general egress grants.
  egress:
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - ipBlock: {cidr: 192.168.1.2/32}
        - ipBlock: {cidr: 192.168.1.5/32}
        - ipBlock: {cidr: 192.168.1.7/32}
      ports: [{protocol: TCP, port: 6443}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8up-backup-validation
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  schedule: '15 9 * * *'
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 180
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 23400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k8up-restore-test
            platform.k3s-on-omv.io/fixture-runner: 'true'
            istio.io/dataplane-mode: none
            sidecar.istio.io/inject: 'false'
        spec:
          serviceAccountName: k8up-fixture-pipeline
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: pipeline
              image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
              command: [/usr/local/bin/python, -IB, /pipeline/fixture_pipeline.py]
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef: {fieldPath: metadata.uid}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 250m, memory: 128Mi}
              volumeMounts:
                - {name: pipeline, mountPath: /pipeline, readOnly: true}
                - {name: runner, mountPath: /runner, readOnly: true}
                - name: api-access
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
          volumes:
            - name: pipeline
              configMap: {name: k8up-fixture-pipeline, defaultMode: 0444}
            - name: runner
              configMap: {name: k8up-pipeline-common, defaultMode: 0444}
            - name: api-access
              projected:
                defaultMode: 0444
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items: [{key: ca.crt, path: ca.crt}]
