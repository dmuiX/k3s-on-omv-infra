apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  cluster:
    name: platform-postgres
  name: grafana
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  inherit: true
  # Budget: two future Grafana replicas x 10 open connections plus five
  # migration/maintenance connections. The app-side pool must remain <=10/pod.
  connectionLimit: 25
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: grafana-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  cluster:
    name: platform-postgres
  name: grafana
  owner: grafana
  allowConnections: true
  connectionLimit: 25
  databaseReclaimPolicy: retain
