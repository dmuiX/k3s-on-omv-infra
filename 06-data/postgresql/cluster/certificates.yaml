apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-postgres-server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    cnpg.io/reload: ""
spec:
  secretName: platform-postgres-server-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - platform-postgres-rw.postgresql.svc
    - platform-postgres-rw.postgresql.svc.cluster.local
    - platform-postgres-r.postgresql.svc
    - platform-postgres-r.postgresql.svc.cluster.local
    - platform-postgres-ro.postgresql.svc
    - platform-postgres-ro.postgresql.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: openbao-pki-services
