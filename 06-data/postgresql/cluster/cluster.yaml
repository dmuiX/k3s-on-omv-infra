apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Central three-node PostgreSQL platform for cluster applications
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:b4bec141fa5ca2bab490b197c814fb1342147c8405be1fb0673951fa6db7f699
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: false
  enablePDB: true
  primaryUpdateStrategy: supervised
  primaryUpdateMethod: switchover
  failoverDelay: 0
  switchoverDelay: 60
  smartShutdownTimeout: 180
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: platform-postgres
      app.kubernetes.io/component: database
    annotations:
      k8up.io/backup: "false"
  storage:
    storageClass: longhorn-postgres
    size: 5Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - omv
                  - wyse5070
                  - raspi4
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: platform-postgres
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      password_encryption: scram-sha-256
      archive_timeout: 5min
      ssl_min_protocol_version: TLSv1.2
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
      maxStandbyNamesFromCluster: 2
      failoverQuorum: true
    syncReplicaElectionConstraint:
      enabled: true
      nodeLabelsAntiAffinity:
        - kubernetes.io/hostname
    # DatabaseRole/Database do not expose database CONNECT ACLs in CNPG 1.30.
    # These ordered rules fail closed for the two registered login roles and
    # prevent either role from authenticating to the other's database.
    pg_hba:
      - hostnossl all all all reject
      - hostssl grafana grafana all scram-sha-256
      - hostssl radar radar all scram-sha-256
      - hostssl all grafana all reject
      - hostssl all radar all reject
  certificates:
    serverTLSSecret: platform-postgres-server-tls
    serverCASecret: platform-postgres-server-tls
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: platform-postgres-backups
  backup:
    target: prefer-standby
