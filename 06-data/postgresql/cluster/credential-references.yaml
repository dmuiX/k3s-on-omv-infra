# Production Secret manifests containing references only.
# The base64 payloads decode to fixed usernames and vault: paths, never passwords.
# The Vault Secrets Webhook resolves password references during API admission.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-db-credentials
  labels:
    vault-injection: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    vault.security.banzaicloud.io/vault-role: vault-secrets-webhook
    vault.security.banzaicloud.io/vault-path: kubernetes
type: kubernetes.io/basic-auth
data:
  username: Z3JhZmFuYQ==
  password: dmF1bHQ6a3YvZGF0YS9wb3N0Z3Jlc3FsL2dyYWZhbmEjcGFzc3dvcmQ=
---
apiVersion: v1
kind: Secret
metadata:
  name: radar-db-credentials
  labels:
    vault-injection: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    vault.security.banzaicloud.io/vault-role: vault-secrets-webhook
    vault.security.banzaicloud.io/vault-path: kubernetes
type: kubernetes.io/basic-auth
data:
  username: cmFkYXI=
  password: dmF1bHQ6a3YvZGF0YS9wb3N0Z3Jlc3FsL3JhZGFyI3Bhc3N3b3Jk
