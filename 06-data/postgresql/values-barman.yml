# yaml-language-server: $schema=../../values-schemas/plugin-barman-cloud/values.schema.json
replicaCount: 2
tolerations:
  - key: workload-placement
    operator: Equal
    value: restricted
    effect: NoSchedule
image:
  registry: ghcr.io
  repository: cloudnative-pg/plugin-barman-cloud
  tag: v0.15.1@sha256:c75acad19a36e8176cfe2885761ff1b836c6ef977d7257e298c99a28b5c302ef
  pullPolicy: IfNotPresent
sidecarImage:
  registry: ghcr.io
  repository: cloudnative-pg/plugin-barman-cloud-sidecar
  tag: v0.15.1@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: plugin-barman-cloud
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
certificate:
  # The plugin chart currently supports only a namespaced Issuer reference.
  # Keep its private controller/sidecar transport self-signed; PostgreSQL client
  # traffic uses the OpenBao-backed server certificate below.
  createIssuer: true
  createServerCertificate: true
  createClientCertificate: true
