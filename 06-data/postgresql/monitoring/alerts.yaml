apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  groups:
    - name: platform-postgres.availability
      rules:
        - alert: PostgreSQLInstanceDown
          expr: pg_up{namespace="postgresql"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: A PostgreSQL instance is unavailable
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLExporterTargetsMissing
          expr: absent(pg_up{namespace="postgresql"})
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: All PostgreSQL exporter targets are missing
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLSynchronousStandbyUnavailable
          expr: sum(pg_up{namespace="postgresql"} == 1) < 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: PostgreSQL no longer has its complete three-instance quorum
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLReplicationLag
          expr: max(ccp_replication_lag_replay_time{namespace="postgresql"}) > 30
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: PostgreSQL replication replay is more than 30 seconds behind
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLConnectionsHigh
          expr: max(ccp_connection_stats_total{namespace="postgresql"} / ccp_connection_stats_max_connections{namespace="postgresql"}) > 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: PostgreSQL connection usage exceeds 80 percent
            runbook_url: docs/postgresql-maintenance.md
    - name: platform-postgres.backup
      rules:
        - alert: PostgreSQLBaseBackupTooOld
          expr: max(ccp_backrest_last_full_backup_time_since_completion_seconds{namespace="postgresql"}) > 93600
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: Latest pgBackRest full backup is older than 26 hours
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLBackupMetricMissing
          expr: absent(ccp_backrest_last_full_backup_time_since_completion_seconds{namespace="postgresql"})
          for: 2h
          labels: {severity: critical}
          annotations:
            summary: No successful pgBackRest full-backup metric is available
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLWALArchivingStalled
          expr: max(ccp_archive_command_status_seconds_since_last_archive{namespace="postgresql"}) > 600
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: PostgreSQL WAL archiving has stalled
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLBackupError
          expr: max(ccp_backrest_last_info_backup_error{namespace="postgresql"}) > 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: pgBackRest reports a backup error
            runbook_url: docs/postgresql-maintenance.md
    - name: platform-postgres.storage
      rules:
        - alert: PostgreSQLPVCUsageWarning
          expr: kubelet_volume_stats_used_bytes{namespace="postgresql",persistentvolumeclaim=~"platform-postgres-.*"} / kubelet_volume_stats_capacity_bytes{namespace="postgresql",persistentvolumeclaim=~"platform-postgres-.*"} > 0.70
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: PostgreSQL PVC usage exceeds 70 percent
            runbook_url: docs/postgresql-maintenance.md
        - alert: PostgreSQLPVCUsageCritical
          expr: kubelet_volume_stats_used_bytes{namespace="postgresql",persistentvolumeclaim=~"platform-postgres-.*"} / kubelet_volume_stats_capacity_bytes{namespace="postgresql",persistentvolumeclaim=~"platform-postgres-.*"} > 0.85
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: PostgreSQL PVC usage exceeds 85 percent
            runbook_url: docs/postgresql-maintenance.md
