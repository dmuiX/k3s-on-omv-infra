apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  destination:
    name: in-cluster
    namespace: postgresql
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      targetRevision: 0.29.1
      chart: cloudnative-pg
      helm:
        releaseName: cloudnative-pg
        valueFiles:
          - $infra/06-data/postgresql/values-cloudnativepg.yml
    - repoURL: https://cloudnative-pg.github.io/charts
      targetRevision: 0.8.1
      chart: plugin-barman-cloud
      helm:
        releaseName: plugin-barman-cloud
        valueFiles:
          - $infra/06-data/postgresql/values-barman.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: 5a0741301009c92b65080596d502d1cde74d7ce3
      path: charts/cluster-config
      helm:
        releaseName: postgresql
        parameters:
          - name: component
            value: postgresql
        valueFiles:
          - $private/clusters/omv/values.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: 5a0741301009c92b65080596d502d1cde74d7ce3
      path: 06-data/postgresql
      ref: infra
      kustomize: {}
    - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
      targetRevision: 3e2ae87315f679fbb6ffc0be2342a74a43d213a6
      ref: private
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
