apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  destination:
    name: in-cluster
    namespace: postgresql
  project: default
  sources:
    - repoURL: registry.developers.crunchydata.com/crunchydata
      targetRevision: 6.0.3
      chart: pgo
      helm:
        releaseName: pgo
        valueFiles:
          - $infra/06-data/postgresql/values-pgo.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: 5077f8d9e1257e7dcd54ed68c66f0ccc745b53d6
      path: charts/cluster-config
      helm:
        releaseName: postgresql
        parameters:
          - name: component
            value: postgresql
        valueFiles:
          - $private/clusters/omv/values.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: 5077f8d9e1257e7dcd54ed68c66f0ccc745b53d6
      path: 06-data/postgresql
      ref: infra
      kustomize: {}
    - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
      targetRevision: 3e2ae87315f679fbb6ffc0be2342a74a43d213a6
      ref: private
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    # Migration release: retain legacy CNPG/Barman resources until live PGO
    # backup, restore, PITR and failover acceptance authorizes a cleanup release.
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
