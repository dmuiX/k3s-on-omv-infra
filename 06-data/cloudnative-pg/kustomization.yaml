apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudnative-pg
resources:
  - controllers/namespace.yaml
  - controllers/networkpolicy.yaml
  - controllers/pdbs.yaml
  - credentials/bootstrap-secrets.yaml
  - cluster/storageclass.yaml
  - cluster/certificates.yaml
  - cluster/cluster.yaml
  - cluster/backup.yaml
  - cluster/networkpolicy.yaml
  - databases/grafana.yaml
  - database-access/connection.yaml
  - database-access/static-roles.yaml
  - databases/radar.yaml
  - monitoring/alerts.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: postgresql-platform
