# OpenBao owns the Radar password; CNPG must never reconcile this login's password.
apiVersion: database.vault.upbound.io/v1alpha1
kind: SecretBackendStaticRole
metadata:
  name: radar
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: database
    name: radar
    dbName: k3s-postgres
    username: radar
    rotationPeriod: 2592000
    rotationStatements:
      - >-
        DO $role$ BEGIN
        IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'radar') THEN
        ALTER ROLE radar WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
        INHERIT CONNECTION LIMIT 12 PASSWORD '{{password}}';
        ELSE
        CREATE ROLE radar WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
        INHERIT CONNECTION LIMIT 12 PASSWORD '{{password}}';
        END IF;
        END $role$;
  providerConfigRef:
    name: openbao
