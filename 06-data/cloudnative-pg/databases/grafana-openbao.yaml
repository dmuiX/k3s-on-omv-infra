# OpenBao owns the Grafana password; CNPG must never reconcile this login's password.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: openbao-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: k3s-postgres
  name: openbao_manager
  login: true
  superuser: false
  createdb: false
  createrole: true
  replication: false
  inherit: true
  connectionLimit: 5
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: openbao-manager-credentials
---
apiVersion: database.vault.upbound.io/v1alpha1
kind: SecretBackendConnection
metadata:
  name: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: database
    name: k3s-postgres
    allowedRoles:
      - grafana
      - radar
    postgresql:
      - connectionUrl: "postgresql://{{username}}:{{password}}@k3s-postgres-rw.cloudnative-pg.svc:5432/postgres?sslmode=verify-full&sslrootcert=/openbao/postgresql-tls/ca.crt"
        username: openbao_manager
        passwordSecretRef:
          name: openbao-manager-credentials
          namespace: cloudnative-pg
          key: password
  providerConfigRef:
    name: openbao
---
apiVersion: database.vault.upbound.io/v1alpha1
kind: SecretBackendStaticRole
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: database
    name: grafana
    dbName: k3s-postgres
    username: grafana
    rotationPeriod: 2592000
  providerConfigRef:
    name: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-read-openbao-manager-credential
  namespace: cloudnative-pg
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-manager-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-read-openbao-manager-credential
  namespace: cloudnative-pg
subjects:
  - kind: ServiceAccount
    name: provider-vault
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-read-openbao-manager-credential
