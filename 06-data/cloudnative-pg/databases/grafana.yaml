apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana
  annotations:
    # OpenBao creates and adopts the fixed login role before CNPG assigns ownership.
    argocd.argoproj.io/sync-wave: "4"
spec:
  cluster:
    name: k3s-postgres
  name: grafana
  owner: grafana
  allowConnections: true
  connectionLimit: 25
  databaseReclaimPolicy: retain
