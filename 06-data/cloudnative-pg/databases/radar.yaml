apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: radar
  annotations:
    # OpenBao creates and adopts the fixed login role before CNPG assigns ownership.
    argocd.argoproj.io/sync-wave: "4"
spec:
  cluster:
    name: k3s-postgres
  name: radar
  owner: radar
  allowConnections: true
  connectionLimit: 12
  databaseReclaimPolicy: retain
