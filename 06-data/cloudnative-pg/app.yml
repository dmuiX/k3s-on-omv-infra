apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  destination:
    name: in-cluster
    namespace: postgresql
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      targetRevision: 0.29.1
      chart: cloudnative-pg
      helm:
        releaseName: cloudnative-pg
        valueFiles:
          - $infra/06-data/cloudnative-pg/values-cloudnativepg.yml
    - repoURL: https://cloudnative-pg.github.io/charts
      targetRevision: 0.8.1
      chart: plugin-barman-cloud
      helm:
        releaseName: plugin-barman-cloud
        valueFiles:
          - $infra/06-data/cloudnative-pg/values-barman.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: main
      path: charts/cluster-config
      helm:
        releaseName: postgresql
        parameters:
          - name: component
            value: postgresql
        valueFiles:
          - $private/clusters/omv/values.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: main
      path: 06-data/cloudnative-pg
      ref: infra
      kustomize: {}
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: main
      path: 06-data/cloudnative-pg/controllers
      directory:
        include: "{namespace.yaml,networkpolicy.yaml,pdbs.yaml}"
    - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
      targetRevision: main
      ref: private
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    # Keep pruning disabled through CNPG backup, restore, PITR, failover and
    # application-connectivity acceptance. Cleanup is a separate release.
    automated:
      # Keep the legacy controller Application inert during the namespace/name cutover.
      enabled: false
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
