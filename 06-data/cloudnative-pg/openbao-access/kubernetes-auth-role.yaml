apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: postgresql-vso
  annotations:
    crossplane.io/external-name: auth/kubernetes/role/postgresql-vso
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: postgresql-vso
    boundServiceAccountNames:
      - postgresql-vso
    boundServiceAccountNamespaces:
      - cloudnative-pg
    audience: ""
    tokenPolicies:
      - postgresql-vso-read
    tokenTtl: 3600
    tokenNoDefaultPolicy: true
