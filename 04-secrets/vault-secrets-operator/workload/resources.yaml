apiVersion: v1
kind: Namespace
metadata:
  name: postgresql
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-vso
  namespace: postgresql
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao-postgresql
  namespace: postgresql
spec:
  address: http://openbao-active.openbao.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openbao-postgresql
  namespace: postgresql
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: postgresql-vso
    serviceAccount: postgresql-vso
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao-postgresql
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openbao-manager-credentials
  namespace: postgresql
spec:
  vaultAuthRef: openbao-postgresql
  mount: kv
  type: kv-v2
  path: postgresql/openbao-manager
  refreshAfter: 1m
  destination:
    create: true
    name: openbao-manager-credentials
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-r2-credentials
  namespace: postgresql
spec:
  vaultAuthRef: openbao-postgresql
  mount: kv
  type: kv-v2
  path: postgresql/r2-credentials
  refreshAfter: 1m
  destination:
    create: true
    name: postgresql-r2-credentials
    type: Opaque
    transformation:
      excludeRaw: true
