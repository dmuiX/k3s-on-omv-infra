apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbao
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - initial-job.yaml
  - cronjob.yaml
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: openbao-access-config
configMapGenerator:
  - name: openbao-access-config
    files:
      - reconcile.py
      - config.json
      - vault-secrets-webhook-read.hcl=policies/vault-secrets-webhook-read.hcl
      - human-admin.hcl=policies/human-admin.hcl
