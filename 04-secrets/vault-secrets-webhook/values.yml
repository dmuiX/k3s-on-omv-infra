# Admission remains available when one of the three nodes is unavailable.
replicaCount: 3
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: vault-secrets-webhook
        topologyKey: kubernetes.io/hostname
deployment:
  # Required anti-affinity needs an old pod removed before its replacement can
  # occupy that node during a three-node rolling update.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
podDisruptionBudget:
  enabled: true
  minAvailable: 2
certificate:
  useCertManager: true
  generate: false
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
# Workloads reach OpenBao over the cluster network, never through the public Gateway.
env:
  VAULT_ADDR: http://openbao-active.openbao.svc.cluster.local:8200
  VAULT_ADDR_ALLOWLIST: http://openbao-active.openbao.svc.cluster.local:8200
  VAULT_ALLOW_PRIVATE_ADDR: "false"
  # Matches OpenBao's native Kubernetes auth mount and its webhook role.
  VAULT_AUTH_METHOD: kubernetes
  VAULT_PATH: kubernetes
  VAULT_ROLE: vault-secrets-webhook
# Reject admission for selected Vault-backed Secrets if injection fails; never
# persist an unresolved vault: reference as an application credential.
secretsFailurePolicy: Fail
secrets:
  objectSelector:
    matchLabels:
      vault-injection: enabled
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
