apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: vault-secrets-webhook
  annotations:
    crossplane.io/external-name: auth/kubernetes/role/vault-secrets-webhook
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: vault-secrets-webhook
    boundServiceAccountNames:
      - vault-secrets-webhook
    boundServiceAccountNamespaces:
      - vault-secrets-webhook
    audience: ""
    tokenPolicies:
      - vault-secrets-webhook-read
    tokenTtl: 3600
    tokenNoDefaultPolicy: false
