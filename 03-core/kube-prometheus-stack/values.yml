# yaml-language-server: $schema=../../values-schemas/kube-prometheus-stack/values.schema.json
fullnameOverride: kube-prometheus-stack
namespaceOverride: kube-prometheus-stack
# Wave 1 owns the CRDs separately. Never let two Applications manage them.
crds:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: false # Avoid a cert-manager dependency for monitoring's admission webhook.
grafana:
  # Let the chart create the initial random administrator credential. The
  # Application ignores only those generated Secret data fields so Argo does not
  # rotate them on each Helm render; never commit or log their values.
  # Stop the old writer before reattaching the RWO volume during upgrades.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    size: 2Gi
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      searchNamespace: ALL
prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [raspi4]
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 15d
    retentionSize: 18GB # Below the 20Gi claim; leave room for WAL and compaction.
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Keep metrics replicas on OMV and Wyse; the Pi is not a monitoring
          # compute or storage target.
          storageClassName: longhorn-monitoring
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
    # Include monitors emitted by other infra charts, not just this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
additionalPrometheusRulesMap:
  persistent-volume-capacity:
    groups:
      - name: persistent-volume-capacity
        rules:
          - alert: PlatformPVCUsageWarning
            expr: kubelet_volume_stats_used_bytes{namespace=~"kube-prometheus-stack|openbao"} / kubelet_volume_stats_capacity_bytes{namespace=~"kube-prometheus-stack|openbao"} > 0.70
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: A platform PVC is more than 70 percent full
              runbook_url: 03-core/kube-prometheus-stack/README.md
          - alert: PlatformPVCUsageCritical
            expr: kubelet_volume_stats_used_bytes{namespace=~"kube-prometheus-stack|openbao"} / kubelet_volume_stats_capacity_bytes{namespace=~"kube-prometheus-stack|openbao"} > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: A platform PVC is more than 85 percent full
              runbook_url: 03-core/kube-prometheus-stack/README.md
