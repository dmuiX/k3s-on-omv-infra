apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Deploy persistent monitoring only after Longhorn is healthy.
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    name: in-cluster
    namespace: kube-prometheus-stack
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 91.4.1
      chart: kube-prometheus-stack
      helm:
        valueFiles:
          - $values/03-core/kube-prometheus-stack/values.yml
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: 093646c172259a826396df092fdda7839695f533
      ref: values
  syncPolicy:
    automated:
      prune: false # CRDs move to monitoring-crds; do not prune them during handoff.
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/preserveUnknownFields
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jqPathExpressions:
        - .metadata.annotations
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /data/admin-user
        - /data/admin-password
