apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-vault:v4.0.4
  runtimeConfigRef:
    name: provider-vault
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-vault
spec:
  deploymentTemplate:
    spec:
      selector:
        matchLabels:
          bootstrap.k3s-on-omv.dev/openbao-postgres-client: "true"
      template:
        metadata:
          labels:
            bootstrap.k3s-on-omv.dev/openbao-postgres-client: "true"
        spec:
          serviceAccountName: provider-vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-vault
  namespace: crossplane-system
