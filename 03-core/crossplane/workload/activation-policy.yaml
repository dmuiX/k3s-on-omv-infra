apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # The Helm init container only creates this object; it does not update an
  # existing wildcard policy. Own its steady-state specification through Git.
  # This does not deactivate or delete any already active MRD/CRD.
  activate:
    - secretbackendconnections.database.vault.upbound.io
    - secretbackendstaticroles.database.vault.upbound.io
