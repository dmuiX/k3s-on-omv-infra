# Shared OpenBao secret engines are configured independently of their consumers.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: kv
  annotations:
    crossplane.io/external-name: kv
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  forProvider:
    path: kv
    type: kv
    options:
      version: "2"
  providerConfigRef:
    name: openbao
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: database
  annotations:
    crossplane.io/external-name: database
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  forProvider:
    path: database
    type: database
  providerConfigRef:
    name: openbao
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: pki-root
  annotations:
    crossplane.io/external-name: pki-root
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  forProvider:
    path: pki-root
    type: pki
    maxLeaseTtlSeconds: 315360000
  providerConfigRef:
    name: openbao
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: pki-services
  annotations:
    crossplane.io/external-name: pki-services
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  forProvider:
    path: pki-services
    type: pki
    maxLeaseTtlSeconds: 157680000
  providerConfigRef:
    name: openbao
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: pki-clients
  annotations:
    crossplane.io/external-name: pki-clients
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
  forProvider:
    path: pki-clients
    type: pki
    maxLeaseTtlSeconds: 157680000
  providerConfigRef:
    name: openbao
