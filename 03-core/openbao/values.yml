# yaml-language-server: $schema=../../values-schemas/openbao/values.schema.json
global:
  serverTelemetry:
    prometheusOperator: true
# The Bank-Vaults webhook is used for injection; avoid two mutating webhooks.
injector:
  enabled: false
serverTelemetry:
  serviceMonitor:
    enabled: true
server:
  image:
    tag: "2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  auditStorage:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
  dataStorage:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
  volumes:
    - name: unseal-key-volume
      secret:
        secretName: openbao-unseal-key
        items:
          - key: unseal-key
            path: unseal-key
  volumeMounts:
    - name: unseal-key-volume
      mountPath: /openbao/secrets
      readOnly: true
  ha:
    enabled: true
    replicas: 3 # One Raft voter per cluster node; the chart's PDB protects quorum.
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          unauthenticated_metrics_access = "true"
        }

        service_registration "kubernetes" {}

        seal "static" {
          current_key_id = "20260323"
          current_key = "file:///openbao/secrets/unseal-key"
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

        storage "raft" {
          path = "/openbao/data"
          retry_join {
            auto_join = "provider=k8s namespace=openbao label_selector=\"app.kubernetes.io/name=openbao,component=server\""
            auto_join_scheme = "http"
          }
        }
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
snapshotAgent:
  enabled: true
  concurrencyPolicy: Forbid
  schedule: "17 2 * * *"
  restartPolicy: OnFailure
  serviceAccount:
    create: true
    name: openbao-snapshot
  job:
    annotations:
      bootstrap.k3s-on-omv.dev/snapshot-profile: native-r2-v1
  image:
    repository: ghcr.io/openbao/openbao-snapshot-agent
    tag: "0.4.5@sha256:ef2c80770e30bba3fcf4d7911cb829607efcea7e7c1a917210c9fa1ba55a8249"
  config:
    s3ExpireDays: "14"
    s3cmdExtraFlag: "--no-progress"
    baoAuthPath: kubernetes
    baoRole: openbao-snapshot
    baoSecretPath: kv/openbao-snapshots/r2-credentials
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: openbao-snapshot-egress
      namespace: openbao
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: openbao
          app.kubernetes.io/component: snapshot-agent
      policyTypes:
        - Egress
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: openbao
                  component: server
          ports:
            - protocol: TCP
              port: 8200
        - ports:
            - protocol: TCP
              port: 443
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: openbao-snapshot
      namespace: openbao
      labels:
        release: kube-prometheus-stack
    spec:
      groups:
        - name: openbao-snapshot
          rules:
            - alert: OpenBaoSnapshotStale
              expr: absent(kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="openbao-snapshot"}) or (time() - kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="openbao-snapshot"} > 93600)
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: OpenBao has no successful native Raft snapshot in the last 26 hours
            - alert: OpenBaoSnapshotJobFailed
              expr: kube_job_status_failed{namespace="openbao",job_name=~"openbao-snapshot-.*"} > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: An OpenBao native Raft snapshot job failed
ui:
  enabled: true
