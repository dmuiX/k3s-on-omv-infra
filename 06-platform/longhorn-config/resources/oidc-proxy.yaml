apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: longhorn-oidc-proxy
    serviceAccount: longhorn-oidc-proxy
    tokenExpirationSeconds: 600
  vaultConnectionRef: vault-secrets-operator/default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  vaultAuthRef: longhorn-oidc-proxy
  mount: kv
  type: kv-v2
  path: longhorn/oidc-proxy
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: longhorn-oidc-proxy
  destination:
    create: true
    name: longhorn-oidc-proxy
    type: Opaque
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        client-id:
          text: |-
            {{- template "requiredValue" (dict "key" "client-id" "value" (get .Secrets "client-id")) -}}
        client-secret:
          text: |-
            {{- template "requiredValue" (dict "key" "client-secret" "value" (get .Secrets "client-secret")) -}}
        cookie-secret:
          text: |-
            {{- $value := get .Secrets "cookie-secret" -}}
            {{- if empty $value -}}
            {{- template "requiredValue" (dict "key" "cookie-secret" "value" $value) -}}
            {{- end -}}
            {{- /* Preserve the stored key bytes; oauth2-proxy requires URL-safe Base64. */ -}}
            {{- $value | replace "+" "-" | replace "/" "_" -}}
