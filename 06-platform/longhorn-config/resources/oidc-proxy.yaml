apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao-longhorn
  namespace: longhorn
spec:
  address: "http://openbao-active.openbao.svc.cluster.local:8200"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: longhorn-oidc-proxy
    serviceAccount: longhorn-oidc-proxy
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao-longhorn
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  vaultAuthRef: longhorn-oidc-proxy
  mount: kv
  type: kv-v2
  path: longhorn/oidc-proxy
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: longhorn-oidc-proxy
  destination:
    create: true
    name: longhorn-oidc-proxy
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        client-id:
          text: |-
            {{- $value := get .Secrets "client-id" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: client-id" -}}
            {{- end -}}
            {{- $value -}}
        client-secret:
          text: |-
            {{- $value := get .Secrets "client-secret" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: client-secret" -}}
            {{- end -}}
            {{- $value -}}
        cookie-secret:
          text: |-
            {{- $value := get .Secrets "cookie-secret" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: cookie-secret" -}}
            {{- end -}}
            {{- /* Preserve the stored key bytes; oauth2-proxy requires URL-safe Base64. */ -}}
            {{- $value | replace "+" "-" | replace "/" "_" -}}
