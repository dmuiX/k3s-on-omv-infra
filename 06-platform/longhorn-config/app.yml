apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: longhorn
  sources:
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 06-platform/longhorn-config/resources
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: adapters/credential-custody
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: charts/openbao-oidc
    helm:
      releaseName: longhorn-oidc
      valueFiles:
      - $live/infra/longhorn/oidc-values.yml
      valuesObject:
        openbaoOIDC:
          providerConfigName: openbao
          deletionPolicy: Orphan
          assignments:
          - name: longhorn-admin
            groupRefs:
            - platform-admin
          key:
            name: longhorn
            syncWave: '-1'
            algorithm: RS256
            allowedClientIds:
            - '*'
            rotationPeriod: 86400
            verificationTtl: 172800
          scopes:
          - name: longhorn
            syncWave: '-1'
            template: '{"username":{{identity.entity.name}},"groups":{{identity.entity.groups.names}}}'
          client:
            name: longhorn
            key: longhorn
            assignments:
            - longhorn-admin
            idTokenTtl: 3600
            accessTokenTtl: 3600
          provider:
            name: longhorn
            clientRefs:
            - longhorn
            scopeRefs:
            - longhorn
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    ref: live
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: charts/service-route
    helm:
      releaseName: longhorn-route
      valueFiles:
      - $live/infra/longhorn/route-values.yml
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: charts/oidc-proxy
    helm:
      releaseName: longhorn-oidc-proxy
      valueFiles:
      - $live/infra/longhorn/proxy-values.yml
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    - PruneLast=true
