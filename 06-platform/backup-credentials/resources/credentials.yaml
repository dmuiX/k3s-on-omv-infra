apiVersion: v1
kind: ServiceAccount
metadata:
  name: smb-vso
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-r2-vso
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: smb-vso
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: smb-vso
    serviceAccount: smb-vso
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: smb-credentials
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  vaultAuthRef: smb-vso
  mount: kv
  type: kv-v2
  path: platform/smb
  refreshAfter: 1h
  destination:
    create: true
    name: smb-credentials
    type: Opaque
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        username:
          text: |-
            {{- template "requiredValue" (dict "key" "username" "value" (get .Secrets "username")) -}}
        password:
          text: |-
            {{- template "requiredValue" (dict "key" "password" "value" (get .Secrets "password")) -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: platform-r2-vso
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: platform-r2-vso
    serviceAccount: platform-r2-vso
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: etcd-s3-config-secret
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  vaultAuthRef: platform-r2-vso
  mount: kv
  type: kv-v2
  path: platform/r2
  refreshAfter: 1h
  destination:
    create: true
    name: etcd-s3-config-secret
    type: etcd.k3s.cattle.io/s3-config-secret
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        etcd-s3-access-key:
          text: |-
            {{- template "requiredValue" (dict "key" "access-key-id" "value" (get .Secrets "access-key-id")) -}}
        etcd-s3-secret-key:
          text: |-
            {{- template "requiredValue" (dict "key" "secret-access-key" "value" (get .Secrets "secret-access-key")) -}}
        etcd-s3-endpoint:
          text: |-
            {{- $value := get .Secrets "endpoint" -}}
            {{- if empty $value -}}
            {{- template "requiredValue" (dict "key" "endpoint" "value" $value) -}}
            {{- end -}}
            {{- trimPrefix "https://" $value -}}
        etcd-s3-region:
          text: "auto"
        etcd-s3-bucket:
          text: "etcd-backups"
        etcd-s3-folder:
          text: "k3s"
        etcd-s3-retention:
          text: "90"
        etcd-s3-insecure:
          text: "false"
        etcd-s3-skip-ssl-verify:
          text: "false"
