apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: radar-vso-read
spec:
  forProvider:
    name: radar-vso-read
    policy: "path \"auth/token/renew-self\" { capabilities = [\"update\"] }\npath \"database/static-creds/radar\" { capabilities = [\"read\"] }\npath \"kv/data/radar/auth\" { capabilities = [\"read\"] }\npath \"kv/metadata/radar/auth\" { capabilities = [\"read\"] }\npath \"kv/data/radar/argocd\" { capabilities = [\"read\"] }\npath \"kv/metadata/radar/argocd\" { capabilities = [\"read\"] }\n"
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: radar-vso
spec:
  forProvider:
    backend: kubernetes
    roleName: radar-vso
    boundServiceAccountNames:
      - radar-vso
    boundServiceAccountNamespaces:
      - radar
    tokenPolicies:
      - radar-vso-read
    tokenTtl: 3600
  providerConfigRef:
    name: openbao
