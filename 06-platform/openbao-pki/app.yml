# Ansible completes the OpenBao PKI ceremony and API configuration before Argo
# applies these steady-state Kubernetes resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-pki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  destination:
    name: in-cluster
    namespace: openbao
  project: default
  source:
    repoURL: "https://github.com/dmuiX/k3s-on-omv-infra.git"
    targetRevision: main
    path: 06-platform/openbao-pki
    directory:
      include: "{issuer-identities.yaml,issuers.yaml,openbao-server-tls.yaml,token-request-rbac.yaml}"
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
