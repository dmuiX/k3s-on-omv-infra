apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: kube-system
  sources:
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 06-platform/platform-credentials/resources
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
