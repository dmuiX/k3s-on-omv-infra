# Adapted from the Tekton Dashboard v0.74.0 read-only release.
# Upstream release.yaml SHA-256: a1ccea1fbdb0084b7fe7fa3f5adeca56dd1e17dcba64ff683a4b41ffc2970c5e
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-info
  namespace: tekton-pipelines
data:
  version: v0.74.0
---
apiVersion: v1
kind: Service
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tekton-dashboard
  ports:
    - name: http
      port: 9097
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tekton-dashboard
    spec:
      serviceAccountName: tekton-dashboard
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/tektoncd/dashboard/dashboard-9623576a202fe86c8b7d1bc489905f86:v0.74.0@sha256:8ee17097dd8d21ab083db6de6006252413444f60b35b4af50ff4e9f1115c911b
          args:
            - --port=9097
            # Kubernetes RBAC denies writes until the separately guarded Envoy run grant is installed.
            - --read-only=false
            - --namespaces=ci-builds
            - --default-namespace=ci-builds
            - --stream-logs=true
            - --log-format=json
            - --logout-url=/oauth2/sign_out
          env:
            - name: INSTALLED_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 9097
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
