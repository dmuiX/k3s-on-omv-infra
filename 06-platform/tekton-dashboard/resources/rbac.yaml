apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-dashboard-info
  namespace: tekton-pipelines
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [dashboard-info, pipelines-info, triggers-info]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-dashboard-info
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-dashboard-info
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-dashboard-reader
  namespace: ci-builds
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelines, pipelineruns, tasks, taskruns, customruns, stepactions]
    verbs: [get, list, watch]
  - apiGroups: [dashboard.tekton.dev]
    resources: [extensions]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [events, pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-dashboard-reader
  namespace: ci-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
