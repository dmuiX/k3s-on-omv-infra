apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-dashboard-oidc-proxy
  namespace: tekton-pipelines
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tekton-dashboard-oidc-proxy
  namespace: tekton-pipelines
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: tekton-dashboard-oidc-proxy
    serviceAccount: tekton-dashboard-oidc-proxy
    tokenExpirationSeconds: 600
  vaultConnectionRef: vault-secrets-operator/default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tekton-dashboard-oidc-proxy
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  vaultAuthRef: tekton-dashboard-oidc-proxy
  mount: kv
  type: kv-v2
  path: tekton-dashboard/oidc-proxy
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: tekton-dashboard-oidc-proxy
  destination:
    create: true
    name: tekton-dashboard-oidc-proxy
    type: Opaque
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        client-id:
          text: '{{- template "requiredValue" (dict "key" "client-id" "value" (get .Secrets "client-id")) -}}'
        client-secret:
          text: '{{- template "requiredValue" (dict "key" "client-secret" "value" (get .Secrets "client-secret")) -}}'
        cookie-secret:
          text: '{{- template "requiredValue" (dict "key" "cookie-secret" "value" (get .Secrets "cookie-secret")) -}}'
