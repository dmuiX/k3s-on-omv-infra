apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-dashboard-provisioner
  namespace: tekton-pipelines
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tekton-dashboard-provisioner
  namespace: tekton-pipelines
data:
  provision.py: |
    import base64
    import secrets
    import sys
    sys.path.insert(0, "/helper")
    from credential_helpers import BAO, Failure, ensure, fields, login, request, run

    def main():
        token = login("tekton-dashboard-provisioner")
        client = request(BAO, "identity/oidc/client/tekton-dashboard", token)["data"]
        fields(client, "client_id", "client_secret")

        def validate(data):
            fields(data, "client-id", "client-secret", "cookie-secret")
            if (data["client-id"] != client["client_id"] or
                    data["client-secret"] != client["client_secret"]):
                raise Failure("Tekton Dashboard credentials do not match the native OIDC client")
            try:
                key = base64.b64decode(data["cookie-secret"], altchars=b"-_", validate=True)
            except ValueError:
                raise Failure("Invalid Tekton Dashboard cookie secret encoding") from None
            if len(key) != 32 or base64.urlsafe_b64encode(key).decode() != data["cookie-secret"]:
                raise Failure("Tekton Dashboard cookie secret must encode 32 bytes as URL-safe Base64")

        ensure(token, "tekton-dashboard/oidc-proxy", lambda: {
            "client-id": client["client_id"], "client-secret": client["client_secret"],
            "cookie-secret": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
        }, validate)

    if __name__ == "__main__":
        run(main)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tekton-dashboard-provisioner
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '1'
spec:
  # Crossplane can still be creating the client and role after submission.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tekton-dashboard-provisioner
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: tekton-dashboard-provisioner
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: python:3.15.2-slim-trixie@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
          command: [python3, -B, /config/provision.py]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: helper, mountPath: /helper, readOnly: true}
            - {name: openbao-auth, mountPath: /var/run/openbao, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: tekton-dashboard-provisioner
        - name: helper
          configMap:
            name: credential-custody
        - name: openbao-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault://tekton-dashboard-provisioner
                  expirationSeconds: 900
