apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: radar
  sources:
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 06-platform/radar-config/resources
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: adapters/credential-custody
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    path: apps/radar
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
