apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: radar
automountServiceAccountToken: false
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: radar-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  deletionPolicy: Orphan
  forProvider:
    name: radar-credentials
    policy: |
      path "kv/data/radar/auth" { capabilities = ["read", "create"] }
      path "kv/metadata/radar/auth" { capabilities = ["read"] }
      path "kv/data/radar/argocd" { capabilities = ["read", "create"] }
      path "kv/metadata/radar/argocd" { capabilities = ["read"] }
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: radar-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: radar-credentials
    boundServiceAccountNames:
    - radar-credentials
    boundServiceAccountNamespaces:
    - radar
    audience: vault://radar-credentials
    tokenPolicies:
    - radar-credentials
    tokenTtl: 900
    tokenMaxTtl: 900
  providerConfigRef:
    name: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-credentials
  namespace: argocd
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - argocd-secret
  verbs:
  - update
  - patch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  - applicationsets
  - appprojects
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-credentials
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-credentials
subjects:
- kind: ServiceAccount
  name: radar-credentials
  namespace: radar
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radar-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: radar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar-credentials
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
      podSelector:
        matchLabels:
          app.kubernetes.io/name: openbao
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 15008
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 15008
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: radar
data:
  provision.py: |
    import base64
    import json
    import os
    import ssl
    import subprocess
    import sys
    sys.path.insert(0, "/helper")
    from credential_helpers import (
        APIError, BAO, Failure, SA, WORK, ensure, fields, kv_read,
        login, random_value, request, run)

    TOKEN_ID = "radar-gitops-v1"

    def cli(*args, token=None, core=True):
        env = dict(os.environ, KUBECONFIG=str(WORK / "kubeconfig"), HOME=str(WORK))
        flags = ["--core"] if core else [
            "--server", "argocd-server.argocd.svc:443",
            "--server-crt", str(WORK / "argocd-ca.crt")]
        if token:
            env["ARGOCD_AUTH_TOKEN"] = token
        try:
            result = subprocess.run(["/tools/argocd", *flags, "--loglevel", "error", *args],
                env=env, capture_output=True, text=True, timeout=90)
        except (OSError, subprocess.TimeoutExpired):
            raise Failure("Native Argo account command failed; details withheld") from None
        if result.returncode:
            raise Failure("Native Argo account command failed; output withheld")
        return result.stdout.strip()

    def argocd_token(bao_token):
        # tokenFile keeps the projected Kubernetes token refreshable and out of argv.
        (WORK / "kubeconfig").write_text(json.dumps({
            "apiVersion": "v1", "kind": "Config", "current-context": "argocd",
            "clusters": [{"name": "cluster", "cluster": {
                "server": "https://kubernetes.default.svc",
                "certificate-authority": str(SA / "ca.crt")}}],
            "users": [{"name": "job", "user": {"tokenFile": str(SA / "token")}}],
            "contexts": [{"name": "argocd", "context": {
                "cluster": "cluster", "user": "job", "namespace": "argocd"}}]}))
        account = json.loads(cli("account", "get", "--account", "radar", "-o", "json"))
        if (account.get("name") != "radar" or not account.get("enabled") or
                set(account.get("capabilities", [])) != {"apiKey"}):
            raise Failure("Radar Argo account must be enabled and apiKey-only")
        tokens = account.get("tokens", [])
        if not isinstance(tokens, list) or any(t.get("id") != TOKEN_ID for t in tokens):
            raise Failure("Refusing foreign Radar Argo account tokens")
        existing = kv_read(bao_token, "radar/argocd")
        if existing is None and tokens:
            # Resume a crash after native issuance but before CAS-0 custody.
            cli("account", "delete-token", "--account", "radar", TOKEN_ID)

        def validate(data):
            fields(data, "token")
            if data.get("token-id") != TOKEN_ID:
                raise Failure("Foreign Radar Argo credential identity")
            try:
                payload = data["token"].split(".")[1]
                claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
            except (ValueError, IndexError):
                raise Failure("Malformed Radar Argo token") from None
            if (claims.get("iss") != "argocd" or claims.get("sub") != "radar:apiKey" or
                    claims.get("jti") != TOKEN_ID or claims.get("exp")):
                raise Failure("Unexpected Radar Argo token claims")

        data = ensure(bao_token, "radar/argocd", lambda: {
            "token": cli("account", "generate-token", "--account", "radar", "--id", TOKEN_ID),
            "token-id": TOKEN_ID}, validate)
        # The real server, not --core, must accept the issued token with TLS verification.
        kube_token = (SA / "token").read_text().strip()
        context = ssl.create_default_context(cafile=str(SA / "ca.crt"))
        for name in ("argocd-server-tls", "argocd-secret"):
            try:
                secret = request("https://kubernetes.default.svc/",
                    "api/v1/namespaces/argocd/secrets/" + name, kube_token, context=context)
            except APIError as error:
                if error.status == 404:
                    continue
                raise
            cert = secret.get("data", {}).get("tls.crt")
            if cert:
                (WORK / "argocd-ca.crt").write_bytes(base64.b64decode(cert, validate=True))
                break
        else:
            raise Failure("Argo server TLS trust certificate is missing")
        actual = json.loads(cli("account", "get", "--account", "radar", "-o", "json",
            token=data["token"], core=False))
        if actual.get("name") != "radar" or not any(
                t.get("id") == TOKEN_ID for t in actual.get("tokens", [])):
            raise Failure("Argo server did not accept the registered Radar token")
        print("Radar Argo token accepted by the real TLS server", flush=True)

    def main():
        token = login("radar-credentials")
        ensure(token, "radar/auth", lambda: {"auth-secret": random_value()},
            lambda data: fields(data, "auth-secret"))
        argocd_token(token)

    if __name__ == "__main__":
        run(main)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-credentials
  namespace: radar
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-credentials
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: radar-credentials
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: native-argocd-cli
        image: quay.io/argoproj/argocd:v3.5.5@sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
        command:
        - /bin/cp
        - /usr/local/bin/argocd
        - /tools/argocd
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tools
          mountPath: /tools
      containers:
      - name: provision
        image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
        command:
        - python3
        - -B
        - /config/provision.py
        env:
        - name: TMPDIR
          value: /work
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tools
          mountPath: /tools
          readOnly: true
        - name: work
          mountPath: /work
        - name: kubernetes-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: openbao-auth
          mountPath: /var/run/openbao
          readOnly: true
        - name: helper
          mountPath: /helper
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: radar-credentials
      # The CLI binary is not a credential. Disk backing avoids charging its
      # 250 MB copy to the init container's 128Mi tmpfs memory budget.
      - name: tools
        emptyDir:
          sizeLimit: 256Mi
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: kubernetes-api
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 900
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: openbao-auth
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: vault://radar-credentials
              expirationSeconds: 900
      - name: helper
        configMap:
          name: credential-custody
