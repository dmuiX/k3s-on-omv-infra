apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: longhorn
automountServiceAccountToken: false
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: longhorn-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  forProvider:
    name: longhorn-credentials
    policy: |
      path "kv/data/longhorn/oidc-proxy" { capabilities = ["read", "create"] }
      path "kv/metadata/longhorn/oidc-proxy" { capabilities = ["read"] }
      path "identity/oidc/client/longhorn" { capabilities = ["read"] }
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: longhorn-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  forProvider:
    backend: kubernetes
    roleName: longhorn-credentials
    boundServiceAccountNames:
    - longhorn-credentials
    boundServiceAccountNamespaces:
    - longhorn
    audience: vault://longhorn-credentials
    tokenPolicies:
    - longhorn-credentials
    tokenTtl: 900
    tokenMaxTtl: 900
  providerConfigRef:
    name: openbao
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: longhorn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: longhorn-credentials
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
      podSelector:
        matchLabels:
          app.kubernetes.io/name: openbao
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 15008
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-credentials
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: longhorn
data:
  provision.py: |
    import base64
    import secrets
    import sys
    sys.path.insert(0, "/helper")
    from credential_helpers import BAO, Failure, ensure, fields, login, request, run

    def main():
        token = login("longhorn-credentials")
        client = request(BAO, "identity/oidc/client/longhorn", token)["data"]
        fields(client, "client_id", "client_secret")

        def proxy_validate(data):
            fields(data, "client-id", "client-secret", "cookie-secret")
            if (data["client-id"] != client["client_id"] or
                    data["client-secret"] != client["client_secret"]):
                raise Failure("Longhorn credentials do not match the native OIDC client")
            try:
                cookie = base64.b64decode(data["cookie-secret"], validate=True)
            except ValueError:
                raise Failure("Invalid Longhorn cookie secret encoding") from None
            if len(cookie) != 32:
                raise Failure("Longhorn cookie secret must contain 32 random bytes")

        ensure(token, "longhorn/oidc-proxy", lambda: {
            "client-id": client["client_id"], "client-secret": client["client_secret"],
            "cookie-secret": base64.b64encode(secrets.token_bytes(32)).decode()}, proxy_validate)


    if __name__ == "__main__":
        run(main)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-credentials
  namespace: longhorn
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-credentials
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: longhorn-credentials
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
        command:
        - python3
        - -B
        - /config/provision.py
        env:
        - name: TMPDIR
          value: /work
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: work
          mountPath: /work
        - name: openbao-auth
          mountPath: /var/run/openbao
          readOnly: true
        - name: helper
          mountPath: /helper
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: longhorn-credentials
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: openbao-auth
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: vault://longhorn-credentials
              expirationSeconds: 900
      - name: helper
        configMap:
          name: credential-custody
