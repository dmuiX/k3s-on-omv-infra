apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsencrypt-dns01-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: cert-manager
  # Only the OpenBao/VSO credential link belongs here. Issuers and certificates
  # are owned by the earlier tls-certificates Application.
  sources:
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: main
      path: 06-platform/letsencrypt-dns01-credentials/resources
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
