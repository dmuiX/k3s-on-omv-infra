apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-dns01
  namespace: cert-manager
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cert-manager-dns01
  namespace: cert-manager
spec:
  vaultConnectionRef: vault-secrets-operator/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cert-manager-dns01
    serviceAccount: cert-manager-dns01
    audiences:
      - "vault://cert-manager-dns01"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare
  namespace: cert-manager
spec:
  vaultAuthRef: cert-manager-dns01
  mount: kv
  type: kv-v2
  path: cert-manager/cloudflare
  destination:
    name: cloudflare-dns01
    # Bootstrap creates this before cert-manager; VSO updates it after OpenBao.
    create: false
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        api-token:
          text: '{{ template "requiredValue" (dict "key" "api-token" "value" (get .Secrets "api-token")) }}'
  refreshAfter: 1h
