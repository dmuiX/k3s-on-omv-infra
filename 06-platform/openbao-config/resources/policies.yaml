apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata: {name: openbao-snapshot}
spec:
  forProvider:
    name: openbao-snapshot
    policy: |
      path "auth/token/renew-self" { capabilities = ["update"] }
      path "sys/storage/raft/snapshot" { capabilities = ["read", "sudo"] }
  providerConfigRef: {name: openbao}
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata: {name: longhorn-oidc-proxy-read}
spec:
  forProvider: {name: longhorn-oidc-proxy-read, policy: "path \"auth/token/renew-self\" { capabilities = [\"update\"] }\npath \"kv/data/longhorn/oidc-proxy\" { capabilities = [\"read\"] }\npath \"kv/metadata/longhorn/oidc-proxy\" { capabilities = [\"read\"] }\n"}
  providerConfigRef: {name: openbao}
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata: {name: postgresql-vso-read}
spec:
  forProvider:
    name: postgresql-vso-read
    policy: |
      path "auth/token/renew-self" { capabilities = ["update"] }
      path "kv/data/postgresql/openbao-manager" { capabilities = ["read"] }
      path "kv/metadata/postgresql/*" { capabilities = ["read"] }
  providerConfigRef: {name: openbao}
---
