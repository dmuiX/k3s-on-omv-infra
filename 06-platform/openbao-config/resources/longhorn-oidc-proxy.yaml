apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao-longhorn
  namespace: longhorn
spec:
  address: "http://openbao-active.openbao.svc.cluster.local:8200"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: longhorn-oidc-proxy
    serviceAccount: longhorn-oidc-proxy
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao-longhorn
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
spec:
  vaultAuthRef: longhorn-oidc-proxy
  mount: kv
  type: kv-v2
  path: longhorn/oidc-proxy
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: longhorn-oidc-proxy
  destination:
    create: true
    name: longhorn-oidc-proxy
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        client-id:
          text: |-
            {{- $value := get .Secrets "client-id" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: client-id" -}}
            {{- end -}}
            {{- $value -}}
        client-secret:
          text: |-
            {{- $value := get .Secrets "client-secret" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: client-secret" -}}
            {{- end -}}
            {{- $value -}}
        cookie-secret:
          text: |-
            {{- $value := get .Secrets "cookie-secret" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: cookie-secret" -}}
            {{- end -}}
            {{- $value -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-oidc-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-oidc-proxy
    spec:
      serviceAccountName: longhorn-oidc-proxy
      containers:
        - name: proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          args:
            - --provider=oidc
            - --upstream=http://longhorn-frontend.longhorn.svc:80
            - --http-address=0.0.0.0:4180
            - --email-domain=*
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: longhorn-oidc-proxy-inputs
                  key: issuer-url
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: longhorn-oidc-proxy-inputs
                  key: redirect-url
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: longhorn-oidc-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: longhorn-oidc-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: longhorn-oidc-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: longhorn-oidc-proxy
  namespace: longhorn
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: longhorn-oidc-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
