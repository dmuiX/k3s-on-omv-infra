# Native controllers own identities, database roles and Secret delivery. This
# bounded Job fills only the missing random-value and Argo token issuance gaps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-credentials
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: service-credentials
spec:
  forProvider:
    name: service-credentials
    policy: |
      path "identity/oidc/client/longhorn" { capabilities = ["read"] }
      path "kv/data/longhorn/oidc-proxy" { capabilities = ["read", "create"] }
      path "kv/metadata/longhorn/oidc-proxy" { capabilities = ["read"] }
      path "kv/data/postgresql/openbao-manager" { capabilities = ["read", "create"] }
      path "kv/metadata/postgresql/openbao-manager" { capabilities = ["read"] }
      path "kv/data/radar/auth" { capabilities = ["read", "create"] }
      path "kv/metadata/radar/auth" { capabilities = ["read"] }
      path "kv/data/radar/argocd" { capabilities = ["read", "create"] }
      path "kv/metadata/radar/argocd" { capabilities = ["read"] }
  providerConfigRef: {name: openbao}
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: service-credentials
spec:
  forProvider:
    backend: kubernetes
    roleName: service-credentials
    boundServiceAccountNames: [service-credentials]
    boundServiceAccountNamespaces: [openbao]
    audience: vault://service-credentials
    tokenPolicies: [service-credentials]
    tokenTtl: 900
    tokenMaxTtl: 900
  providerConfigRef: {name: openbao}
---
# --core uses Argo's own account/session implementation. It needs the Argo
# namespace informers, but may update only argocd-secret (token registration).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-credentials
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [argocd-secret]
    verbs: [update, patch]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: service-credentials
  namespace: argocd
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: service-credentials}
subjects:
  - {kind: ServiceAccount, name: service-credentials, namespace: openbao}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-credentials
  namespace: openbao
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: service-credentials}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
      ports: [{protocol: TCP, port: 8200}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: argocd}}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 8080}, {protocol: TCP, port: 15008}]
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-credentials
  namespace: openbao
data:
  provision.py: |
    """Create-once GitOps credentials. Never print response bodies or secrets."""
    import base64
    import json
    import os
    from pathlib import Path
    import secrets
    import ssl
    import subprocess
    import sys
    import urllib.error
    import urllib.request

    OWNER = "service-credentials-v1"
    TOKEN_ID = "radar-gitops-v1"
    BAO = "http://openbao-active.openbao.svc.cluster.local:8200/v1/"
    SA = Path("/var/run/secrets/kubernetes.io/serviceaccount")
    WORK = Path("/work")

    class Failure(Exception):
        pass

    class APIError(Failure):
        def __init__(self, status):
            self.status = status
            super().__init__(f"API request failed (HTTP {status}); response withheld")

    def request(base, path, token, data=None, context=None):
        headers = {"Content-Type": "application/json"}
        headers["X-Vault-Token" if base == BAO else "Authorization"] = (
            token if base == BAO else "Bearer " + token)
        req = urllib.request.Request(base + path, headers=headers,
            data=None if data is None else json.dumps(data).encode())
        try:
            with urllib.request.urlopen(req, context=context, timeout=30) as response:
                raw = response.read()
                return json.loads(raw) if raw else {}
        except urllib.error.HTTPError as error:
            status = error.code
            error.close()
            raise APIError(status) from None
        except (urllib.error.URLError, TimeoutError, ValueError):
            raise Failure("API transport or response error; details withheld") from None

    def kv_read(token, path):
        try:
            result = request(BAO, "kv/data/" + path, token)
        except APIError as error:
            if error.status != 404:
                raise
            # A tombstone/history is not an absent secret: never regenerate it.
            try:
                request(BAO, "kv/metadata/" + path, token)
            except APIError as metadata_error:
                if metadata_error.status == 404:
                    return None
                raise
            raise Failure("Refusing to replace deleted credential history: " + path)
        data = result.get("data", {}).get("data")
        if not isinstance(data, dict) or data.get("managed-by") != OWNER:
            raise Failure("Credential has foreign or malformed ownership: " + path)
        return data

    def ensure(token, path, make, validate):
        data = kv_read(token, path)
        if data is None:
            expected = {**make(), "managed-by": OWNER}
            validate(expected)
            try:
                request(BAO, "kv/data/" + path, token,
                    {"options": {"cas": 0}, "data": expected})
            except APIError as error:
                if error.status not in (400, 403):
                    raise
                # A concurrent creator may have won; no unconditional update.
                data = kv_read(token, path)
                if data is None:
                    raise
            else:
                data = kv_read(token, path)
                if data != expected:
                    raise Failure("Credential read-back mismatch: " + path)
        validate(data)
        print("Credential verified: " + path, flush=True)
        return data

    def fields(data, *names):
        if not isinstance(data, dict) or any(
            not isinstance(data.get(name), str) or not data[name] for name in names):
            raise Failure("Required credential fields are missing or malformed")

    def random_value():
        return secrets.token_urlsafe(32)

    def cli(*args, token=None, core=True):
        env = dict(os.environ, KUBECONFIG=str(WORK / "kubeconfig"), HOME=str(WORK))
        flags = ["--core"] if core else [
            "--server", "argocd-server.argocd.svc:443",
            "--server-crt", str(WORK / "argocd-ca.crt")]
        if token:
            env["ARGOCD_AUTH_TOKEN"] = token
        try:
            result = subprocess.run(["/tools/argocd", *flags, "--loglevel", "error", *args],
                env=env, capture_output=True, text=True, timeout=90)
        except (OSError, subprocess.TimeoutExpired):
            raise Failure("Native Argo account command failed; details withheld") from None
        if result.returncode:
            raise Failure("Native Argo account command failed; output withheld")
        return result.stdout.strip()

    def argocd_token(bao_token):
        # tokenFile keeps the projected Kubernetes token refreshable and out of argv.
        (WORK / "kubeconfig").write_text(json.dumps({
            "apiVersion": "v1", "kind": "Config", "current-context": "argocd",
            "clusters": [{"name": "cluster", "cluster": {
                "server": "https://kubernetes.default.svc",
                "certificate-authority": str(SA / "ca.crt")}}],
            "users": [{"name": "job", "user": {"tokenFile": str(SA / "token")}}],
            "contexts": [{"name": "argocd", "context": {
                "cluster": "cluster", "user": "job", "namespace": "argocd"}}]}))
        account = json.loads(cli("account", "get", "--account", "radar", "-o", "json"))
        if (account.get("name") != "radar" or not account.get("enabled") or
                set(account.get("capabilities", [])) != {"apiKey"}):
            raise Failure("Radar Argo account must be enabled and apiKey-only")
        tokens = account.get("tokens", [])
        if not isinstance(tokens, list) or any(t.get("id") != TOKEN_ID for t in tokens):
            raise Failure("Refusing foreign Radar Argo account tokens")
        existing = kv_read(bao_token, "radar/argocd")
        if existing is None and tokens:
            # Resume a crash after native issuance but before CAS-0 custody.
            cli("account", "delete-token", "--account", "radar", TOKEN_ID)

        def validate(data):
            fields(data, "token")
            if data.get("token-id") != TOKEN_ID:
                raise Failure("Foreign Radar Argo credential identity")
            try:
                payload = data["token"].split(".")[1]
                claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
            except (ValueError, IndexError):
                raise Failure("Malformed Radar Argo token") from None
            if (claims.get("iss") != "argocd" or claims.get("sub") != "radar:apiKey" or
                    claims.get("jti") != TOKEN_ID or claims.get("exp")):
                raise Failure("Unexpected Radar Argo token claims")

        data = ensure(bao_token, "radar/argocd", lambda: {
            "token": cli("account", "generate-token", "--account", "radar", "--id", TOKEN_ID),
            "token-id": TOKEN_ID}, validate)
        # The real server, not --core, must accept the issued token with TLS verification.
        kube_token = (SA / "token").read_text().strip()
        context = ssl.create_default_context(cafile=str(SA / "ca.crt"))
        for name in ("argocd-server-tls", "argocd-secret"):
            try:
                secret = request("https://kubernetes.default.svc/", 
                    "api/v1/namespaces/argocd/secrets/" + name, kube_token, context=context)
            except APIError as error:
                if error.status == 404:
                    continue
                raise
            cert = secret.get("data", {}).get("tls.crt")
            if cert:
                (WORK / "argocd-ca.crt").write_bytes(base64.b64decode(cert, validate=True))
                break
        else:
            raise Failure("Argo server TLS trust certificate is missing")
        actual = json.loads(cli("account", "get", "--account", "radar", "-o", "json",
            token=data["token"], core=False))
        if actual.get("name") != "radar" or not any(
                t.get("id") == TOKEN_ID for t in actual.get("tokens", [])):
            raise Failure("Argo server did not accept the registered Radar token")
        print("Radar Argo token accepted by the real TLS server", flush=True)

    def main():
        os.umask(0o077)
        login = request(BAO, "auth/kubernetes/login", "", {
            "role": "service-credentials",
            "jwt": Path("/var/run/openbao/token").read_text().strip()})
        token = login["auth"]["client_token"]
        client = request(BAO, "identity/oidc/client/longhorn", token)["data"]
        fields(client, "client_id", "client_secret")

        def proxy_validate(data):
            fields(data, "client-id", "client-secret", "cookie-secret")
            if (data["client-id"] != client["client_id"] or
                    data["client-secret"] != client["client_secret"]):
                raise Failure("Longhorn credentials do not match the native OIDC client")
            try:
                cookie = base64.b64decode(data["cookie-secret"], validate=True)
            except ValueError:
                raise Failure("Invalid Longhorn cookie secret encoding") from None
            if len(cookie) != 32:
                raise Failure("Longhorn cookie secret must contain 32 random bytes")

        ensure(token, "longhorn/oidc-proxy", lambda: {
            "client-id": client["client_id"], "client-secret": client["client_secret"],
            "cookie-secret": base64.b64encode(secrets.token_bytes(32)).decode()}, proxy_validate)

        def manager_validate(data):
            fields(data, "username", "password")
            if data["username"] != "openbao_manager":
                raise Failure("Unexpected PostgreSQL manager identity")

        ensure(token, "postgresql/openbao-manager", lambda: {
            "username": "openbao_manager", "password": random_value()}, manager_validate)
        ensure(token, "radar/auth", lambda: {"auth-secret": random_value()},
            lambda data: fields(data, "auth-secret"))
        argocd_token(token)

    if __name__ == "__main__":
        try:
            main()
        except Exception as error:
            # External response/CLI exceptions can contain credentials. Only our
            # deliberately secret-free diagnostics may cross this boundary.
            print(str(error) if isinstance(error, Failure) else
                "Credential provisioning failed; sensitive details withheld", file=sys.stderr)
            sys.exit(1)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: service-credentials
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: service-credentials}
    spec:
      serviceAccountName: service-credentials
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: native-argocd-cli
          image: quay.io/argoproj/argocd:v3.5.5@sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
          command: [/bin/cp, /usr/local/bin/argocd, /tools/argocd]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tools, mountPath: /tools}
      containers:
        - name: provision
          image: python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
          command: [python3, -B, /config/provision.py]
          env: [{name: TMPDIR, value: /work}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tools, mountPath: /tools, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: kubernetes-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: openbao-auth, mountPath: /var/run/openbao, readOnly: true}
      volumes:
        - name: config
          configMap: {name: service-credentials}
        - name: tools
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
        - name: kubernetes-api
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 900}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        - name: openbao-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault://service-credentials
                  expirationSeconds: 900
