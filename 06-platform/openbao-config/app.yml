apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: openbao-config, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "6"}}
spec:
  project: default
  destination: {name: in-cluster, namespace: crossplane-system}
  sources:
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git', targetRevision: main, path: 06-platform/openbao-config/resources}
    # OIDC consumers must not block Wave 2 before OpenBao/VSO exist.
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git', targetRevision: main, path: infra/longhorn}
  syncPolicy: {automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}, syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]}
