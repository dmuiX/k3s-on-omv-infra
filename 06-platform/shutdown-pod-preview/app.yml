apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shutdown-pod-preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: shutdown-pod-preview
  sources:
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: 06-platform/shutdown-pod-preview
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git'
      targetRevision: main
      path: infra/shutdown-pod-preview
      directory:
        include: network-peers.yaml
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
