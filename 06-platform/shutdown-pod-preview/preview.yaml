apiVersion: v1
kind: Namespace
metadata:
  name: shutdown-pod-preview
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shutdown-pod-preview
  namespace: shutdown-pod-preview
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shutdown-pod-preview
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shutdown-pod-preview-dns
  namespace: shutdown-pod-preview
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shutdown-pod-preview
  policyTypes: [Egress]
  egress:
    # Exact Kubernetes API service/control-plane egress peers come from Live.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shutdown-pod-preview
  namespace: shutdown-pod-preview
spec:
  schedule: '*/30 * * * *'
  timeZone: Europe/Berlin
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shutdown-pod-preview
        spec:
          serviceAccountName: shutdown-pod-preview
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: preview
              image: python:3.13.18-slim-bookworm@sha256:f0fa218d5b06f9b9235024fa061cde2cb141f726de52134471053d2d9b5324a3
              command: [python3, -B, /preview/preview.py, --delete]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: code
                  mountPath: /preview
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: shutdown-pod-preview-code
                defaultMode: 0444
