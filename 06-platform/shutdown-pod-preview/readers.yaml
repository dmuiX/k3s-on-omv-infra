# Only namespace RoleBindings use this shared permission. Never bind it
# cluster-wide; delete is strictly scoped to pods in the allowlisted namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shutdown-pod-preview
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shutdown-pod-preview
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shutdown-pod-preview
subjects:
  - kind: ServiceAccount
    name: shutdown-pod-preview
    namespace: shutdown-pod-preview
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shutdown-pod-preview
  namespace: audiobookshelf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shutdown-pod-preview
subjects:
  - kind: ServiceAccount
    name: shutdown-pod-preview
    namespace: shutdown-pod-preview
---
apiVersion: rbac.authorization.k8s.io/v1
