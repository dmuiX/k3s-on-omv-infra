apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: policy-reporter-ui
  namespace: kyverno
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter-ui
      app.kubernetes.io/instance: policy-reporter
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/kyverno/sa/policy-reporter-oidc-proxy
      to:
        - operation:
            ports:
              - '8080'
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: policy-reporter-api
  namespace: kyverno
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter
      app.kubernetes.io/instance: policy-reporter
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/kyverno/sa/policy-reporter-ui
              - cluster.local/ns/kube-prometheus-stack/sa/kube-prometheus-stack-prometheus
      to:
        - operation:
            ports:
              - '8080'
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: policy-reporter-plugins
  namespace: kyverno
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - policy-reporter-kyverno-plugin
          - policy-reporter-trivy-plugin
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/kyverno/sa/policy-reporter-ui
      to:
        - operation:
            ports:
              - '8080'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-reporter-ui
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter-ui
      app.kubernetes.io/instance: policy-reporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: policy-reporter-oidc-proxy
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-reporter-backends
  namespace: kyverno
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - policy-reporter
          - policy-reporter-kyverno-plugin
          - policy-reporter-trivy-plugin
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: policy-reporter-ui
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-reporter-oidc-proxy
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter-oidc-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: istio-gateway
      ports:
        - protocol: TCP
          port: 4180
        - protocol: TCP
          port: 15008
    # Istio Ambient SNATs the kubelet's HTTP probes to this link-local address.
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: 4180
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: policy-reporter-ui
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-reporter-openbao-clients
  namespace: kyverno
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [policy-reporter-oidc-proxy, policy-reporter-provisioner]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: openbao
              component: server
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-policy-reporter-openbao-clients
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
      component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kyverno
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [policy-reporter-oidc-proxy, policy-reporter-provisioner]
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 15008
