apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: policy-reporter-oidc-proxy-read
spec:
  deletionPolicy: Orphan
  forProvider:
    name: policy-reporter-oidc-proxy-read
    policy: |
      path "auth/token/renew-self" { capabilities = ["update"] }
      path "kv/data/policy-reporter/oidc-proxy" { capabilities = ["read"] }
      path "kv/metadata/policy-reporter/oidc-proxy" { capabilities = ["read"] }
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: policy-reporter-oidc-proxy
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: policy-reporter-oidc-proxy
    boundServiceAccountNames: [policy-reporter-oidc-proxy]
    boundServiceAccountNamespaces: [kyverno]
    tokenPolicies: [policy-reporter-oidc-proxy-read]
    tokenTtl: 3600
  providerConfigRef:
    name: openbao
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: policy-reporter-provisioner
spec:
  deletionPolicy: Orphan
  forProvider:
    name: policy-reporter-provisioner
    policy: |
      path "kv/data/policy-reporter/oidc-proxy" { capabilities = ["read", "create"] }
      path "kv/metadata/policy-reporter/oidc-proxy" { capabilities = ["read"] }
      path "identity/oidc/client/policy-reporter" { capabilities = ["read"] }
  providerConfigRef:
    name: openbao
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: policy-reporter-provisioner
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: kubernetes
    roleName: policy-reporter-provisioner
    boundServiceAccountNames: [policy-reporter-provisioner]
    boundServiceAccountNamespaces: [kyverno]
    audience: vault://policy-reporter-provisioner
    tokenPolicies: [policy-reporter-provisioner]
    tokenTtl: 900
    tokenMaxTtl: 900
  providerConfigRef:
    name: openbao
