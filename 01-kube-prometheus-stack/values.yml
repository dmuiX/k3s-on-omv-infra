# yaml-language-server: $schema=../values-schemas/kube-prometheus-stack/values.schema.json
fullnameOverride: kube-prometheus-stack
namespaceOverride: kube-prometheus-stack
# Bootstrap monitoring CRDs before Longhorn and other charts emit ServiceMonitors.
# Stay ephemeral until storage is validated.
crds:
  enabled: true
prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: false # Avoid a cert-manager dependency for monitoring's admission webhook.
grafana:
  persistence:
    enabled: false
  service:
    type: ClusterIP
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    storageSpec: {} # Ephemeral during bootstrap; history is not durable.
    # Include monitors emitted by other infra charts, not just this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
alertmanager:
  alertmanagerSpec:
    storage: {} # No Longhorn dependency before the storage controller exists.
