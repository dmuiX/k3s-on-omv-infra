{{- $v := .Values.openbaoOIDC -}}
{{- $clientName := $v.client.name -}}
{{- $key := merge (deepCopy ($v.key | default dict)) (dict "name" $clientName) -}}
{{- $clientKey := default $key.name $v.client.key -}}
{{- $provider := merge (deepCopy ($v.provider | default dict)) (dict "name" $clientName "clientRefs" (list $clientName) "scopeRefs" (list $clientName)) -}}
{{- $defaultScopeTemplate := "{\"username\":{{identity.entity.name}},\"groups\":{{identity.entity.groups.names}}}" -}}
{{- $scopes := $v.scopes | default (list (dict "name" $clientName "template" $defaultScopeTemplate)) -}}
{{- $issuer := urlParse $provider.issuerURL -}}
{{- if or (ne $issuer.scheme "https") (empty $issuer.host) (not (empty $issuer.userinfo)) (not (empty $issuer.query)) (not (empty $issuer.fragment)) (ne $issuer.path (printf "/v1/identity/oidc/provider/%s" $provider.name)) -}}
{{- fail "openbaoOIDC.provider.issuerURL must be the dedicated provider HTTPS URL" -}}
{{- end -}}
{{- range $v.client.redirectUris -}}
{{- $uri := urlParse . -}}
{{- if or (ne $uri.scheme "https") (empty $uri.host) (not (empty $uri.userinfo)) (not (empty $uri.fragment)) (contains "REQUIRED_" .) -}}
{{- fail "openbaoOIDC.client.redirectUris must be confirmed HTTPS URLs" -}}
{{- end -}}
{{- end -}}
{{- if or (ne $clientKey $key.name) (not (has $clientName $provider.clientRefs)) -}}
{{- fail "client must reference this key and be explicitly allowed by this provider" -}}
{{- end -}}
{{- range $v.groups }}
{{- $extMembers := true }}
{{- if hasKey . "externalMemberEntityIds" }}
{{- $extMembers = .externalMemberEntityIds }}
{{- end }}
---
apiVersion: identity.vault.upbound.io/v1alpha1
kind: Group
metadata:
  {{- include "openbao-oidc.metadata" . | nindent 2 }}
spec:
  {{- include "openbao-oidc.common" $v | nindent 2 }}
  forProvider:
    name: {{ .externalName | quote }}
    type: {{ default "internal" .type | quote }}
    externalMemberEntityIds: {{ $extMembers }}
{{- end }}
{{- range $v.assignments }}
---
apiVersion: identity.vault.upbound.io/v1alpha1
kind: OidcAssignment
metadata:
  {{- include "openbao-oidc.metadata" . | nindent 2 }}
spec:
  {{- include "openbao-oidc.common" $v | nindent 2 }}
  forProvider:
    name: {{ .name | quote }}
    groupIdsRefs:
      {{- range (default (list "platform-admin") .groupRefs) }}
      - name: {{ . | quote }}
      {{- end }}
{{- end }}
---
apiVersion: identity.vault.upbound.io/v1alpha1
kind: OidcKey
metadata:
  {{- include "openbao-oidc.metadata" $key | nindent 2 }}
spec:
  {{- include "openbao-oidc.common" $v | nindent 2 }}
  forProvider:
    name: {{ $key.name | quote }}
    algorithm: {{ $key.algorithm | quote }}
    allowedClientIds:
      {{- toYaml $key.allowedClientIds | nindent 6 }}
    rotationPeriod: {{ $key.rotationPeriod }}
    verificationTtl: {{ $key.verificationTtl }}
{{- range $scopes }}
---
apiVersion: identity.vault.upbound.io/v1alpha1
kind: OidcScope
metadata:
  {{- include "openbao-oidc.metadata" . | nindent 2 }}
spec:
  {{- include "openbao-oidc.common" $v | nindent 2 }}
  forProvider:
    name: {{ .name | quote }}
    template: {{ default $defaultScopeTemplate .template | quote }}
{{- end }}
---
apiVersion: identity.vault.upbound.io/v1alpha1
kind: OidcClient
metadata:
  {{- include "openbao-oidc.metadata" $v.client | nindent 2 }}
spec:
  {{- include "openbao-oidc.common" $v | nindent 2 }}
  forProvider:
    name: {{ $clientName | quote }}
    clientType: confidential
    key: {{ $clientKey | quote }}
    assignments:
      {{- toYaml $v.client.assignments | nindent 6 }}
    redirectUris:
      {{- toYaml $v.client.redirectUris | nindent 6 }}
    idTokenTtl: {{ $v.client.idTokenTtl }}
    accessTokenTtl: {{ $v.client.accessTokenTtl }}
  {{- with $v.client.connectionSecret }}
  writeConnectionSecretToRef:
    name: {{ .name | quote }}
    namespace: {{ .namespace | quote }}
  {{- end }}
---
apiVersion: identity.vault.upbound.io/v1alpha1
kind: OidcProvider
metadata:
  {{- include "openbao-oidc.metadata" $provider | nindent 2 }}
spec:
  {{- include "openbao-oidc.common" $v | nindent 2 }}
  forProvider:
    name: {{ $provider.name | quote }}
    issuerHost: {{ $issuer.host | quote }}
    httpsEnabled: true
    allowedClientIdsRefs:
      {{- range $provider.clientRefs }}
      - name: {{ . | quote }}
      {{- end }}
    scopesSupportedRefs:
      {{- range $provider.scopeRefs }}
      - name: {{ . | quote }}
      {{- end }}
