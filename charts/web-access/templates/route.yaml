{{- if .Values.route.enabled }}
  {{- /* --- 1. Resolve route identity and validate required fields --- */ -}}
  {{- $route     := .Values.route -}}
  {{- $name      := default (include "web-access.name" .) $route.name -}}
  {{- $namespace := include "web-access.namespace" . -}}

  {{- if empty $route.hostnames -}}
    {{- fail "route.hostnames must be non-empty when route.enabled is true" -}}
  {{- end -}}
  {{- if empty $route.parentRefs -}}
    {{- fail "route.parentRefs must be non-empty when route.enabled is true" -}}
  {{- end -}}

  {{- /* --- 2. Build rules (explicit route.rules override or single-backend shorthand) --- */ -}}
  {{- $rules := $route.rules -}}
  {{- if empty $rules -}}
    {{- $backendName := $route.backend.name -}}
    {{- if empty $backendName -}}
      {{- if .Values.proxy.enabled -}}
        {{- $backendName = include "web-access.proxyName" . -}}
      {{- else -}}
        {{- fail "route.backend.name is required when route.enabled is true and proxy.enabled is false" -}}
      {{- end -}}
    {{- end -}}

    {{- $defaultRule := dict
      "backend" (dict
        "name" $backendName
        "port" $route.backend.port
        "weight" $route.backend.weight
      )
      "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/")))
      "filters" $route.filters
      "timeouts" $route.timeouts
    -}}
    {{- $rules = list $defaultRule -}}
  {{- end -}}

  {{- /* --- 3. Render Gateway API HTTPRoute with explicit backendRefs defaults --- */ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  {{- with $route.syncWave }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ . | quote }}
  {{- end }}
spec:
  parentRefs:
  {{- range $route.parentRefs }}
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .name | quote }}
    namespace: {{ .namespace | quote }}
    {{- with .sectionName }}
    sectionName: {{ . | quote }}
    {{- end }}
  {{- end }}
  hostnames:
    {{- toYaml $route.hostnames | nindent 4 }}
  rules:
  {{- range $rules }}
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ .backend.name | quote }}
      port: {{ .backend.port }}
      weight: {{ .backend.weight }}
    {{- with .matches }}
    matches:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .filters }}
    filters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .timeouts }}
    timeouts:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
