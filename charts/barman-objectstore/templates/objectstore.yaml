{{- $r2 := .Values.r2 | default dict -}}
{{- $endpoint := required "r2.endpoint is required from Live infra/r2/values.yml" $r2.endpoint -}}
{{- if not (and (kindIs "string" $endpoint) (regexMatch `\Ahttps://[0-9a-f]{32}(\.(eu|fedramp))?\.r2\.cloudflarestorage\.com\z` $endpoint)) -}}
{{- fail "r2.endpoint must be an HTTPS R2 account URL with a 32-character lowercase hex account ID and optional .eu or .fedramp jurisdiction" -}}
{{- end }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: k3s-postgres-backups
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    k3s-on-omv.io/create-once-owner: protected-ceremonies/platform-r2
spec:
  configuration:
    destinationPath: s3://cloudnativepg-backups/
    endpointURL: {{ $endpoint | quote }}
    s3Credentials:
      accessKeyId:
        name: postgresql-r2-credentials
        key: access-key-id
      secretAccessKey:
        name: postgresql-r2-credentials
        key: secret-access-key
      region:
        name: postgresql-r2-credentials
        key: region
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
    wal:
      compression: gzip
      encryption: AES256
      maxParallel: 2
  instanceSidecarConfiguration:
    logLevel: info
    retentionPolicyIntervalSeconds: 1800
    # Preserve the deployed sizing during adoption; do not roll out the legacy request target.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
