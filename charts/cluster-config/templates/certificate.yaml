{{- if eq .Values.component "certificates" }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-token
  namespace: cert-manager
  labels:
    vault-injection: enabled
  annotations:
    vault.security.banzaicloud.io/vault-role: vault-secrets-webhook
    vault.security.banzaicloud.io/vault-path: kubernetes
type: Opaque
data:
  token: {{ required "Cloudflare Vault reference is required" .Values.certificate.cloudflareTokenRef | b64enc | quote }}
{{- range $stage, $url := dict "prod" "https://acme-v02.api.letsencrypt.org/directory" "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-issuer-{{ $stage }}
spec:
  acme:
    server: {{ $url }}
    email: {{ required "ACME email is required" $.Values.certificate.acmeEmail | quote }}
    privateKeySecretRef:
      name: cluster-issuer-{{ $stage }}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-token
              key: token
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: kube-system
  annotations:
    # Within the child Application, apply the issuer and token first.
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: {{ .Values.certificate.secretName }}
  dnsNames:
    - {{ required "Wildcard DNS name is required" .Values.certificate.dnsName | quote }}
  issuerRef:
    name: cluster-issuer-prod
    kind: ClusterIssuer
{{- end }}
