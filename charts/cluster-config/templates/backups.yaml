{{- if eq .Values.component "backups" }}
apiVersion: v1
kind: Secret
metadata:
  name: k8up-repo-password
  namespace: openbao
  labels:
    vault-injection: enabled
  annotations:
    vault.security.banzaicloud.io/vault-role: vault-secrets-webhook
    vault.security.banzaicloud.io/vault-path: kubernetes
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  password: {{ required "Backup password Vault reference is required" .Values.backup.repoPasswordRef | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: r2-credentials
  namespace: openbao
  labels:
    vault-injection: enabled
  annotations:
    vault.security.banzaicloud.io/vault-role: vault-secrets-webhook
    vault.security.banzaicloud.io/vault-path: kubernetes
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  access-key-id: {{ required "Access key Vault reference is required" .Values.backup.accessKeyIdRef | b64enc | quote }}
  secret-access-key: {{ required "Secret key Vault reference is required" .Values.backup.secretAccessKeyRef | b64enc | quote }}
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: openbao-k8up-pod-config
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    spec:
      # K8up merges scheduling fields into its generated container named k8up.
      containers:
        - name: k8up
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: openbao-k8up-schedule
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podConfigRef:
    name: openbao-k8up-pod-config
  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 2
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: {{ required "Backup endpoint is required" .Values.backup.endpoint | quote }}
      bucket: {{ required "Backup bucket is required" .Values.backup.bucket | quote }}
      accessKeyIDSecretRef:
        name: r2-credentials
        key: access-key-id
      secretAccessKeySecretRef:
        name: r2-credentials
        key: secret-access-key
  backup:
    schedule: "0 2 * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  check:
    schedule: "0 1 * * 1"
  prune:
    schedule: "0 1 * * 0"
    retention:
      keepLast: 5
      keepDaily: 14
{{- end }}
