{{- if has .Values.component (list "argocd" "grafana" "longhorn" "openbao") }}
{{- $route := index .Values.routes .Values.component }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.component }}
  namespace: {{ $route.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listener }}
  hostnames:
    - {{ required "route hostname is required" $route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $route.service }}
          port: {{ $route.port }}
          weight: 1
{{- end }}
