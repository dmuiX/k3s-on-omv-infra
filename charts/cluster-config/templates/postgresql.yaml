{{- if eq .Values.component "postgresql" }}
# VSO owns postgresql-r2-credentials. Keep this chart limited to the
# non-secret repository configuration and its fixed Secret key contract.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: platform-postgres-backups
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  configuration:
    destinationPath: {{ printf "s3://%s/" (required "PostgreSQL backup bucket is required" .Values.postgresqlBackup.bucket) | quote }}
    endpointURL: {{ required "PostgreSQL backup endpoint is required" .Values.postgresqlBackup.endpoint | trimSuffix "/" | quote }}
    s3Credentials:
      accessKeyId:
        name: postgresql-r2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgresql-r2-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: postgresql-r2-credentials
        key: AWS_REGION
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
      immediateCheckpoint: false
    wal:
      compression: gzip
      encryption: AES256
      maxParallel: 2
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    logLevel: info
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k3s-api-to-cloudnative-pg-webhook
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Ingress]
  ingress:
    - from:
{{- range required "K3s API server source CIDRs are required" .Values.postgresqlNetwork.apiServerSourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 9443
{{- end }}
