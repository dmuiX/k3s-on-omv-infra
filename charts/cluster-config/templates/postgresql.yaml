{{- if eq .Values.component "postgresql" }}
# OpenBao's database plugin verifies the CNPG service identity with the same
# internal CA that signs the server certificate. The Secret contains only
# public certificate material and is mounted read-only into OpenBao.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgresql-ca
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: postgresql-ca
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - openbao-postgresql-ca-carrier.svc
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: openbao-pki-services
---
# VSO owns postgresql-r2-credentials. Keep this chart limited to the
# non-secret repository configuration and its fixed Secret key contract.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: k3s-postgres-backups
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  configuration:
    destinationPath: {{ printf "s3://%s/" (required "PostgreSQL backup bucket is required" .Values.postgresqlBackup.bucket) | quote }}
    endpointURL: {{ required "PostgreSQL backup endpoint is required" .Values.postgresqlBackup.endpoint | trimSuffix "/" | quote }}
    s3Credentials:
      accessKeyId:
        name: postgresql-r2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgresql-r2-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: postgresql-r2-credentials
        key: AWS_REGION
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
      immediateCheckpoint: false
    wal:
      compression: gzip
      encryption: AES256
      maxParallel: 2
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    logLevel: info
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k3s-api-to-cloudnative-pg-webhook
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Ingress]
  ingress:
    # Flannel masquerades host-to-remote-pod traffic to the source node's
    # per-node Pod gateway, so both native and translated API sources are exact.
    - from:
{{- range required "K3s API server source CIDRs are required" .Values.postgresqlNetwork.apiServerSourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- range required "K3s API server masquerade source CIDRs are required" .Values.postgresqlNetwork.apiServerMasqueradeSourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 9443
---
# Kube-proxy translates the kubernetes.default Service port 443 to each K3s
# API endpoint on 6443 before some NetworkPolicy engines evaluate egress.
# Permit only the reviewed control-plane addresses on that backend port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k3s-api-egress
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
{{- range required "K3s API server source CIDRs are required" .Values.postgresqlNetwork.apiServerSourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 6443
---
# kube-router on this cluster does not populate a selector set for the
# late-created Radar namespace. Restrict the compatibility grant to the Pod
# CIDRs of Radar's allowed nodes; PostgreSQL authentication remains mandatory.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-radar-postgres-pod-cidrs
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: k3s-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
{{- range required "Radar source Pod CIDRs are required" .Values.postgresqlNetwork.radarSourcePodCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
