{{- if eq .Values.component "restore" }}
{{- $n := int .Values.backup.restoreOrdinal }}
apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: openbao-{{ $n }}-k8up-restore
  namespace: openbao
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: {{ required "Backup endpoint is required" .Values.backup.endpoint | quote }}
      bucket: {{ required "Backup bucket is required" .Values.backup.bucket | quote }}
      accessKeyIDSecretRef:
        name: r2-credentials
        key: access-key-id
      secretAccessKeySecretRef:
        name: r2-credentials
        key: secret-access-key
  restoreMethod:
    folder:
      claimName: data-openbao-{{ $n }}
  paths: ["/data/openbao-{{ $n }}"]
{{- end }}
