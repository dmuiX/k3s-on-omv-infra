# Safe sample values. The live cluster loads a private values.yml instead.
component: none # argocd, grafana, longhorn, openbao, certificates, backups, postgresql, or restore

gateway:
  name: traefik-gateway
  namespace: kube-system
  listener: websecure

routes:
  argocd:
    hostname: argocd.example.invalid
    namespace: argocd
    service: argocd-server
    port: 80
  grafana:
    hostname: grafana.example.invalid
    namespace: kube-prometheus-stack
    service: kube-prometheus-stack-grafana
    port: 80
  longhorn:
    hostname: longhorn.example.invalid
    namespace: longhorn
    service: longhorn-frontend
    port: 80
  openbao:
    hostname: openbao.example.invalid
    namespace: openbao
    service: openbao-ui
    port: 8200

certificate:
  dnsName: "*.example.invalid"
  acmeEmail: replace-me@example.invalid
  secretName: wildcard-tls
  cloudflareTokenRef: vault:kv/data/cert-manager#cloudflare-token

backup:
  endpoint: https://example.invalid
  bucket: replace-me
  repoPasswordRef: vault:kv/data/k8up/repository-password#password
  accessKeyIdRef: vault:kv/data/k8up/r2-credentials#access-key-id
  secretAccessKeyRef: vault:kv/data/k8up/r2-credentials#secret-access-key
  restoreOrdinal: 0 # Schema-validated nonnegative integer; selects data-openbao-<ordinal>.

postgresqlBackup:
  endpoint: https://example.invalid
  bucket: replace-me-postgresql
  region: auto

postgresqlNetwork:
  # Safe documentation-only addresses. Live values list each K3s server and
  # each Flannel host-to-pod masquerade source as exact /32 entries.
  apiServerSourceCIDRs:
    - 192.0.2.1/32
  apiServerMasqueradeSourceCIDRs:
    - 198.51.100.1/32
  # Pod CIDRs of nodes on which Radar is permitted to run.
  radarSourcePodCIDRs:
    - 192.0.2.0/24
