{{- $issuerURL := required "issuerURL is required" .Values.issuerURL -}}
{{- $backchannelURL := .Values.openbaoBackchannelURL -}}
{{- if $backchannelURL -}}
{{- $public := urlParse $issuerURL -}}
{{- $internal := urlParse $backchannelURL -}}
{{- if or (ne $public.scheme "https") (not (regexMatch "^/v1/identity/oidc/provider/[a-z0-9-]+$" $public.path)) (ne $internal.path $public.path) (not (has $internal.scheme (list "http" "https"))) -}}
{{- fail "openbaoBackchannelURL must point to the same OpenBao OIDC provider as the public HTTPS issuer" -}}
{{- end -}}
{{- if and (eq $internal.scheme "http") (not .Values.ambient) -}}
{{- fail "an HTTP OpenBao backchannel requires Istio Ambient enrollment" -}}
{{- end -}}
{{- range list $public $internal -}}
{{- if or (empty .host) .query .fragment .userinfo -}}
{{- fail "OpenBao issuer and backchannel URLs must contain a host and no query, fragment, or credentials" -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      {{- if $backchannelURL }}
      annotations:
        checksum/oidc-inputs: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        {{- with .Values.ambient }}
        istio.io/dataplane-mode: ambient
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --provider=oidc
            - {{ printf "--upstream=%s" (required "upstream is required" .Values.upstream) | quote }}
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - {{ printf "--scope=%s" (required "scope is required" .Values.scope) | quote }}
            - --oidc-email-claim=username
            # OpenBao supplies the authenticated entity name, not a verified mailbox.
            - --insecure-oidc-allow-unverified-email=true
            - {{ printf "--allowed-group=%s" (required "allowedGroup is required" .Values.allowedGroup) | quote }}
            - --skip-provider-button=true
            {{- if not .Values.passBasicAuth }}
            - --pass-basic-auth=false
            - --pass-authorization-header=false
            {{- end }}
            {{- if $backchannelURL }}
            - --skip-oidc-discovery=true
            - {{ printf "--login-url=%s/authorize" (replace "/v1/identity/oidc/provider/" "/ui/vault/identity/oidc/provider/" $issuerURL) | quote }}
            - {{ printf "--redeem-url=%s/token" $backchannelURL | quote }}
            - {{ printf "--oidc-jwks-url=%s/.well-known/keys" $backchannelURL | quote }}
            - --skip-claims-from-profile-url=true
            {{- end }}
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.name }}-inputs
                  key: issuer-url
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.name }}-inputs
                  key: redirect-url
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
