{{- if .Values.provisioner.enabled }}
{{- $p := .Values.provisioner }}
{{- $name := required "provisioner.name is required when provisioner.enabled is true" $p.name }}
{{- $role := default $name $p.role }}
{{- $client := required "provisioner.client is required when provisioner.enabled is true" $p.client }}
{{- $kvPath := default (printf "%s/oidc-proxy" $client) $p.kvPath }}
{{- $syncWave := default "1" $p.syncWave }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
data:
  provision.py: |
    import base64
    import os
    import secrets
    import sys
    sys.path.insert(0, "/helper")
    from credential_helpers import BAO, Failure, ensure, fields, login, request, run

    def main():
        role = os.environ["OIDC_ROLE"]
        client_name = os.environ["OIDC_CLIENT"]
        kv_path = os.environ["KV_PATH"]
        token = login(role)
        client = request(BAO, f"identity/oidc/client/{client_name}", token)["data"]
        fields(client, "client_id", "client_secret")

        def validate(data):
            fields(data, "client-id", "client-secret", "cookie-secret")
            if (data["client-id"] != client["client_id"] or
                    data["client-secret"] != client["client_secret"]):
                raise Failure(f"Stored {client_name} credentials do not match the native OIDC client")
            try:
                key = base64.b64decode(data["cookie-secret"], altchars=b"-_", validate=True)
            except ValueError:
                raise Failure(f"Invalid {client_name} cookie secret encoding") from None
            if len(key) != 32 or base64.urlsafe_b64encode(key).decode() != data["cookie-secret"]:
                raise Failure(f"{client_name} cookie secret must encode 32 bytes as URL-safe Base64")

        ensure(token, kv_path, lambda: {
            "client-id": client["client_id"],
            "client-secret": client["client_secret"],
            "cookie-secret": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
        }, validate)

    if __name__ == "__main__":
        run(main)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: {{ $syncWave | quote }}
spec:
  # Allow time for Crossplane to reconcile the client and the login role.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- if .Values.ambient }}
        istio.io/dataplane-mode: ambient
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ $p.image }}
          command: [python3, -B, /config/provision.py]
          env:
            - name: OIDC_ROLE
              value: {{ $role | quote }}
            - name: OIDC_CLIENT
              value: {{ $client | quote }}
            - name: KV_PATH
              value: {{ $kvPath | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: helper, mountPath: /helper, readOnly: true}
            - {name: openbao-auth, mountPath: /var/run/openbao, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: helper
          configMap:
            name: credential-custody
        - name: openbao-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ printf "vault://%s" $role | quote }}
                  expirationSeconds: 900
{{- end }}
