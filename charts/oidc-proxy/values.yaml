name: longhorn-oidc-proxy
namespace: longhorn
upstream: http://longhorn-frontend.longhorn.svc:80
scope: openid longhorn
allowedGroup: platform:admin
# Preserve the legacy header behavior unless the upstream uses its own API identity.
passBasicAuth: true
ambient: false
podSecurityContext: {}
# Optional OpenBao provider base URL on the mesh for token exchange and JWKS.
# The browser still uses the public issuer. Leave empty for standard discovery.
openbaoBackchannelURL: ""
# Required deployment-specific URLs, supplied by the Live repository.
issuerURL: ""
redirectURL: ""
# Optional Sync-hook Job that provisions client-id, client-secret, and cookie-secret
# into OpenBao KV using the shared adapters/credential-custody helper ConfigMap.
provisioner:
  enabled: false
  name: ""
  role: ""
  client: ""
  kvPath: ""
  syncWave: "1"
  image: python:3.15.2-slim-trixie@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
