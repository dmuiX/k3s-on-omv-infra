# Canonical SPEC v6.1 Infra root. Bootstrap must refuse to apply this root while
# deployment-blockers.json contains any open deployment-blocking record.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    name: in-cluster
    namespace: argocd
  # This deliberately nonexistent AppProject makes the root unsyncable while
  # deployment-blockers.json reports open blockers. Resolve the registry and
  # change this to default in the same reviewed change.
  project: infra-deployment-blocked
  source:
    repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: "0[1-8]-*/*/app.yml"
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
