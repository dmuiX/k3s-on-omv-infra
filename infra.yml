apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination: 
    name: in-cluster
    namespace: argocd
  source:
    repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    path: infra/applications
    kustomize: {}
  syncPolicy: 
    automated: 
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions: 
      - ServerSideApply=true
      - PruneLast=true
