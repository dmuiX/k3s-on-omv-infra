# SYNTHETIC CI ONLY: no private configuration or real credentials.
name: longhorn
namespace: longhorn
parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: istio-gateway
    namespace: istio-gateway
    sectionName: https
hostnames: [longhorn.example.invalid]
rules:
  - backend: {name: longhorn-oidc-proxy, port: 80, weight: 1}
    matches:
      - path: {type: PathPrefix, value: /}
