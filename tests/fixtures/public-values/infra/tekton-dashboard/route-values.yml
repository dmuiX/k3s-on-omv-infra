name: tekton-dashboard
namespace: tekton-pipelines
parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: istio-gateway
    namespace: istio-gateway
    sectionName: https
hostnames:
  - tekton.example.invalid
rules:
  - backend:
      name: tekton-dashboard-oidc-proxy
      port: 80
      weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          # Dashboard proxies the Kubernetes API, including WebSocket upgrades.
          # Always use its scoped service account, not a browser-supplied identity.
          remove:
            - Authorization
            - Impersonate-User
            - Impersonate-Group
            - Impersonate-Uid
            - Sec-WebSocket-Protocol
    timeouts:
      request: 0s
