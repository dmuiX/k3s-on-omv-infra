name: policy-reporter
namespace: kyverno
parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: istio-gateway
    namespace: istio-gateway
    sectionName: https
hostnames:
  - kyverno.example.invalid
rules:
  - backend:
      name: policy-reporter-oidc-proxy
      port: 80
      weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          remove:
            - Authorization
            - Impersonate-User
            - Impersonate-Group
            - Impersonate-Uid
            - Sec-WebSocket-Protocol
