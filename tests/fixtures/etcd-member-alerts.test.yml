rule_files:
  - etcd-member.rules.yml
evaluation_interval: 30s

tests:
  # Two scrapes of the leader count as one member and one leader. Losing
  # discovery for c must then warn, even though three scrapes are still up.
  - name: healthy cluster then lost target
    interval: 30s
    input_series:
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="a",endpoint="one"}'
        values: '1x16'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="a",endpoint="one"}'
        values: '0+30x16'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="a",endpoint="one"}'
        values: '1x16'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="a",endpoint="one"}'
        values: '1x16'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="a",endpoint="two"}'
        values: '1x16'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="a",endpoint="two"}'
        values: '0+30x16'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="a",endpoint="two"}'
        values: '1x16'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="a",endpoint="two"}'
        values: '1x16'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '1x16'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '0+30x16'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '1x16'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '0x16'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '1x12 stale'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '0+30x12 stale'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '1x12 stale'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '0x12 stale'
      - series: 'etcd_server_proposals_failed_total{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '7x16'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="node-exporter",namespace="node-exporter",instance="b",le="0.005"}'
        values: '0+10x16'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="node-exporter",namespace="node-exporter",instance="b",le="+Inf"}'
        values: '0+10x16'
    promql_expr_test:
      - expr: platform_etcd_member:reporting_members
        eval_time: 6m
        exp_samples:
          - {labels: 'platform_etcd_member:reporting_members{}', value: 3}
    alert_rule_test:
      - {alertname: EtcdMemberCoverageUnexpected, eval_time: 6m, exp_alerts: []}
      - {alertname: EtcdMemberTelemetryAbsent, eval_time: 6m, exp_alerts: []}
      - {alertname: EtcdMemberHasNoLeader, eval_time: 6m, exp_alerts: []}
      - {alertname: EtcdMemberLeaderCountUnexpected, eval_time: 6m, exp_alerts: []}
      - {alertname: EtcdMemberWalFsyncSlow, eval_time: 6m, exp_alerts: []}
      - {alertname: EtcdMemberFailedProposals, eval_time: 6m, exp_alerts: []}
      - alertname: EtcdMemberCoverageUnexpected
        eval_time: 8m
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Expected three distinct etcd members with fresh telemetry. Check scrape discovery, collector timestamps and host clocks.

  # Only the frozen scrape of a is up. Neither the fresh but failed duplicate
  # nor b's future timestamp can supply evidence of current member state.
  - name: freshness boundary and scrape identity
    interval: 30s
    input_series:
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="a",service="frozen"}'
        values: '1x10'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="a",service="frozen"}'
        values: '0x10'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="a",service="frozen"}'
        values: '0x10'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="a",service="frozen"}'
        values: '0x10'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="a",service="down"}'
        values: '0x10'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="a",service="down"}'
        values: '0+30x10'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="a",service="down"}'
        values: '0x10'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="a",service="down"}'
        values: '0x10'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '1x10'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '1+30x10'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '0x10'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '0x10'
    promql_expr_test:
      - expr: platform_etcd_member:reporting_members
        eval_time: 2m
        exp_samples:
          - {labels: 'platform_etcd_member:reporting_members{}', value: 1}
      - expr: platform_etcd_member:reporting_members
        eval_time: 2m30s
        exp_samples:
          - {labels: 'platform_etcd_member:reporting_members{}', value: 0}
    alert_rule_test:
      - {alertname: EtcdMemberHasNoLeader, eval_time: 4m, exp_alerts: []}
      - {alertname: EtcdMemberLeaderCountUnexpected, eval_time: 4m, exp_alerts: []}
      - alertname: EtcdMemberTelemetryAbsent
        eval_time: 4m
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: No fresh etcd member telemetry. Check node-exporter targets and the member metrics collector on each server.

  - name: entire scrape job absent
    interval: 30s
    input_series: []
    alert_rule_test:
      - alertname: EtcdMemberTelemetryAbsent
        eval_time: 2m
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: No fresh etcd member telemetry. Check node-exporter targets and the member metrics collector on each server.

  - name: leader loss then two reported leaders
    interval: 30s
    input_series:
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '1x10'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '0+30x10'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '0x4 1x5'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '0x4 1x5'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '1x10'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '0+30x10'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '1x10'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="b"}'
        values: '0x4 1x5'
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '1x10'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '0+30x10'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '1x10'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="c"}'
        values: '0x10'
    alert_rule_test:
      - alertname: EtcdMemberHasNoLeader
        eval_time: 2m
        exp_alerts:
          - exp_labels: {severity: critical, instance: a}
            exp_annotations:
              summary: Etcd member a sees no leader. Check peer connectivity and election logs.
      - alertname: EtcdMemberLeaderCountUnexpected
        eval_time: 2m
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Etcd members do not report a single leader. Check member status and election logs.
      - alertname: EtcdMemberLeaderCountUnexpected
        eval_time: 5m
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Etcd members do not report a single leader. Check member status and election logs.

  - name: slow WAL and increasing proposal failures only on accepted input
    interval: 30s
    input_series:
      - series: 'up{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '1x24'
      - series: 'platform_etcd_member_last_success_timestamp_seconds{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '0+30x24'
      - series: 'etcd_server_has_leader{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '1x24'
      - series: 'etcd_server_is_leader{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '1x24'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="node-exporter",namespace="node-exporter",instance="a",le="0.01"}'
        values: '0x24'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="node-exporter",namespace="node-exporter",instance="a",le="0.05"}'
        values: '0+10x24'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="node-exporter",namespace="node-exporter",instance="a",le="+Inf"}'
        values: '0+10x24'
      - series: 'etcd_server_proposals_failed_total{job="node-exporter",namespace="node-exporter",instance="a"}'
        values: '0+1x12 0x11'
      - series: 'etcd_server_proposals_failed_total{job="different",namespace="node-exporter",instance="a"}'
        values: '0+10x24'
      - series: 'etcd_server_proposals_failed_total{job="node-exporter",namespace="different",instance="a"}'
        values: '0+10x24'
    alert_rule_test:
      - {alertname: EtcdMemberWalFsyncSlow, eval_time: 4m, exp_alerts: []}
      - alertname: EtcdMemberWalFsyncSlow
        eval_time: 6m
        exp_alerts:
          - exp_labels: {severity: warning, instance: a}
            exp_annotations:
              summary: Etcd WAL fsync p99 exceeds 10 ms on a. Check disk latency and competing I/O.
      - alertname: EtcdMemberFailedProposals
        eval_time: 6m
        exp_alerts:
          - exp_labels: {severity: warning, instance: a}
            exp_annotations:
              summary: Etcd proposals failed on a in the last 5 minutes. Check leader stability and peer latency.
      - {alertname: EtcdMemberFailedProposals, eval_time: 12m, exp_alerts: []}
