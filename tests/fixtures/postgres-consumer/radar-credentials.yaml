apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-vso
  namespace: radar
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao
  namespace: radar
spec:
  address: "http://openbao-active.openbao.svc.cluster.local:8200"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: radar-vso
  namespace: radar
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: openbao
  kubernetes:
    role: radar-vso
    serviceAccount: radar-vso
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: radar-db
  namespace: radar
spec:
  vaultAuthRef: radar-vso
  mount: database
  path: static-creds/radar
  allowStaticCreds: true
  rolloutRestartTargets:
    - kind: Deployment
      name: radar
  destination:
    create: true
    name: radar-db
    transformation:
      excludeRaw: true
      templates:
        dsn:
          text: |-
            {{- $username := get .Secrets "username" -}}
            {{- $password := get .Secrets "password" -}}
            {{- if or (empty $username) (empty $password) -}}
            {{- fail "missing required OpenBao database username or password" -}}
            {{- end -}}
            postgresql://{{ $username | urlquery }}:{{ $password | urlquery }}@k3s-postgres-rw.cloudnative-pg.svc:5432/radar?sslmode=disable
---
# Read the existing OIDC client directly, without issuing credentials or KV copies.
# No rolloutRestartTargets: non-leased VDS reads report a sync on each refresh.
# Explicit client rotation requires a normal Radar rollout to reload its env.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: radar-oidc
  namespace: radar
spec:
  vaultAuthRef: radar-vso
  mount: identity
  path: oidc/client/radar
  requestHTTPMethod: GET
  refreshAfter: 1h
  destination:
    create: true
    name: radar-oidc
    transformation:
      excludeRaw: true
      templates:
        client-id:
          text: |-
            {{- $value := get .Secrets "client_id" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: client_id" -}}
            {{- end -}}
            {{- $value -}}
        client-secret:
          text: |-
            {{- $value := get .Secrets "client_secret" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: client_secret" -}}
            {{- end -}}
            {{- $value -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: radar-auth
  namespace: radar
spec:
  vaultAuthRef: radar-vso
  mount: kv
  type: kv-v2
  path: radar/auth
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: radar
  destination:
    create: true
    name: radar-auth
    transformation:
      excludeRaw: true
      templates:
        auth-secret:
          text: |-
            {{- $value := get .Secrets "auth-secret" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: auth-secret" -}}
            {{- end -}}
            {{- $value -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: radar-argocd
  namespace: radar
spec:
  vaultAuthRef: radar-vso
  mount: kv
  type: kv-v2
  path: radar/argocd
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: radar
  destination:
    create: true
    name: radar-argocd
    transformation:
      excludeRaw: true
      templates:
        token:
          text: |-
            {{- $value := get .Secrets "token" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: token" -}}
            {{- end -}}
            {{- $value -}}
