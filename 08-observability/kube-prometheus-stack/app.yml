apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: kube-prometheus-stack
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.1
      helm:
        valueFiles:
          - $infra/08-observability/kube-prometheus-stack/values.yml
          - $live/infra/kube-prometheus-stack-values.yml
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      ref: infra
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git'
      targetRevision: main
      ref: live
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: 08-observability/kube-prometheus-stack/resources
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git'
      targetRevision: main
      path: infra/kube-prometheus-stack
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
