apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    infra.k3s-on-omv.dev/deployment-blocker: FLUENT_BIT_RSYSLOG_INPUT_UNRESOLVED
spec:
  project: default
  destination: {name: in-cluster, namespace: fluent-bit}
  sources:
    - {repoURL: "https://fluent.github.io/helm-charts", chart: fluent-bit, targetRevision: UNRESOLVED_FLUENT_BIT_VERSION, helm: {releaseName: fluent-bit, valueFiles: [$values/08-observability/fluent-bit/values.yml]}}
    - {repoURL: "https://github.com/dmuiX/k3s-on-omv-infra.git", targetRevision: main, ref: values}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
