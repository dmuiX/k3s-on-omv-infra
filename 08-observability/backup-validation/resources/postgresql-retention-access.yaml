# The restore-proof Lease belongs to this namespace. Install its readers here,
# not in the earlier database Application before this namespace exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-size-retention
  namespace: backup-validation
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - postgresql-restore-status
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-size-retention
  namespace: backup-validation
subjects:
  - kind: ServiceAccount
    name: postgresql-size-retention
    namespace: cloudnative-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-size-retention
