apiVersion: v1
kind: ServiceAccount
metadata: {name: k8up-validation-vso, namespace: backup-validation}
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata: {name: openbao, namespace: backup-validation}
spec: {address: "http://openbao-active.openbao.svc.cluster.local:8200"}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata: {name: k8up-validation-vso, namespace: backup-validation}
spec: {vaultConnectionRef: openbao, method: kubernetes, mount: kubernetes, kubernetes: {role: k8up-validation-vso, serviceAccount: k8up-validation-vso}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata: {name: k8up-repository, namespace: backup-validation}
spec:
  vaultAuthRef: k8up-validation-vso
  mount: kv
  type: kv-v2
  path: k8up/repository-password
  refreshAfter: 1h
  destination:
    create: true
    name: k8up-repository
    transformation:
      excludeRaw: true
      templates:
        password:
          text: |-
            {{- $value := get .Secrets "password" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: password" -}}
            {{- end -}}
            {{- $value -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata: {name: postgresql-validation-r2, namespace: backup-validation}
spec:
  vaultAuthRef: k8up-validation-vso
  mount: kv
  type: kv-v2
  path: platform/r2
  refreshAfter: 1h
  destination:
    create: true
    name: postgresql-validation-r2
    transformation:
      excludeRaw: true
      templates:
        access-key-id: {text: '{{ get .Secrets "access-key-id" }}'}
        secret-access-key: {text: '{{ get .Secrets "secret-access-key" }}'}
        AWS_ACCESS_KEY_ID: {text: '{{ get .Secrets "access-key-id" }}'}
        AWS_SECRET_ACCESS_KEY: {text: '{{ get .Secrets "secret-access-key" }}'}
        AWS_REGION: {text: '{{ get .Secrets "region" }}'}
        S3_ENDPOINT: {text: '{{ get .Secrets "endpoint" }}'}
