apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - credentials.yaml
  - network-policy.yaml
  - validation.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: postgresql-pitr-validator
    namespace: backup-validation
    files:
      - postgresql_pitr.py
