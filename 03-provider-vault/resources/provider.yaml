apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-vault
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              resources:
