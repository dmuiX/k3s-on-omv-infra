apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: istio-system
  sources:
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: base
    targetRevision: 1.32.0
    helm:
      releaseName: istio-base
      valuesObject:
        base:
          validationFailurePolicy: Fail
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: istiod
    targetRevision: 1.32.0
    helm:
      releaseName: istio-istiod
      valuesObject:
        image: docker.io/istio/pilot@sha256:219ab7efcf1fd1f883086ad4a4a649c0e70bee3200423d6eef9f435103a79423 # 1.32.0-distroless
        profile: ambient
        base:
          validationFailurePolicy: Fail
        resources:
          requests:
            cpu: 25m
            memory: 224Mi
          limits:
            cpu: '1'
            memory: 512Mi
        global:
          platform: k3s
          proxy:
            image: docker.io/istio/proxyv2@sha256:9cd1f1cc261f3fe250ab483543e7256c39d5871eae5f1817c0809eff09e365d4 # 1.32.0-distroless
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 300m
                memory: 256Mi
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: cni
    targetRevision: 1.32.0
    helm:
      releaseName: istio-cni
      valuesObject:
        profile: ambient
        global:
          platform: k3s
        resources:
          requests:
            cpu: 25m
            memory: 100Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: ztunnel
    targetRevision: 1.32.0
    helm:
      releaseName: ztunnel
      valuesObject:
        resources:
          requests:
            cpu: 150m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
