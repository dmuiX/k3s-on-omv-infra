apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: istio-system
  sources:
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: base
    targetRevision: 1.31.2
    helm:
      releaseName: istio-base
      valuesObject:
        base:
          validationFailurePolicy: Fail
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: istiod
    targetRevision: 1.31.2
    helm:
      releaseName: istio-istiod
      valuesObject:
        profile: ambient
        base:
          validationFailurePolicy: Fail
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        global:
          platform: k3s
          proxy:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 300m
                memory: 256Mi
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: cni
    targetRevision: 1.31.2
    helm:
      releaseName: istio-cni
      valuesObject:
        profile: ambient
        global:
          platform: k3s
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: ztunnel
    targetRevision: 1.31.2
    helm:
      releaseName: ztunnel
      valuesObject:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
