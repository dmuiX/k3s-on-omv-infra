# Istio 1.31 Gateway API automated deployment: native strategic-merge overlays.
# The namespace is owned by the earlier tls-certificates Application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-gateway-options
  namespace: istio-gateway
data:
  deployment: |
    spec:
      replicas: 3
      strategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      template:
        spec:
          # Required for admission to the restricted istio-gateway namespace.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoSchedule
          # Prefer one replica per node without blocking every gateway pod
          # if fewer than three eligible nodes are currently schedulable.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        gateway.networking.k8s.io/gateway-name: istio-gateway
                    topologyKey: kubernetes.io/hostname
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: istio-gateway
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
  podDisruptionBudget: |
    spec:
      minAvailable: 2
      selector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: istio-gateway
