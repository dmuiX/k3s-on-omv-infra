apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tekton-dashboard-envoy-run
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pipelineruns]
        scope: Namespaced
  matchConditions:
    - name: dashboard-in-build-namespace
      expression: >-
        request.namespace == 'ci-builds' &&
        request.userInfo.username == 'system:serviceaccount:tekton-pipelines:tekton-dashboard'
  validations:
    - expression: request.requestResource.version == 'v1'
      message: Envoy Dashboard runs must use Tekton API v1.
    - expression: >-
        object.metadata.name == 'envoy-backport-dashboard' &&
        (!has(object.metadata.generateName) || object.metadata.generateName == '') &&
        (!has(object.metadata.labels) || size(object.metadata.labels) == 0) &&
        (!has(object.metadata.annotations) || size(object.metadata.annotations) == 0) &&
        (!has(object.metadata.ownerReferences) || size(object.metadata.ownerReferences) == 0) &&
        (!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0)
      message: Use the fixed Envoy Dashboard run name and no extra metadata.
    # Compare the complete spec to reject inline code and execution overrides by default.
    - expression: >-
        dyn(object.spec) == {
          'pipelineRef': dyn({'name': 'envoy-backport-pilot'}),
          'timeouts': dyn({'pipeline': '5h50m0s'}),
          'taskRunTemplate': dyn({
            'serviceAccountName': dyn('envoy-builder'),
            'podTemplate': dyn({
              'automountServiceAccountToken': dyn(false),
              'nodeSelector': dyn({
                'kubernetes.io/os': 'linux',
                'kubernetes.io/arch': 'amd64',
                'ci.dmuix.com/envoy-builder': 'true'
              }),
              'securityContext': dyn({
                'runAsNonRoot': dyn(true), 'runAsUser': dyn(1000), 'runAsGroup': dyn(1000),
                'fsGroup': dyn(1000), 'seccompProfile': dyn({'type': 'RuntimeDefault'})
              })
            })
          })
        }
      message: Use the reviewed Envoy PipelineRun spec without overrides.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tekton-dashboard-envoy-run
spec:
  policyName: tekton-dashboard-envoy-run
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ci-builds
