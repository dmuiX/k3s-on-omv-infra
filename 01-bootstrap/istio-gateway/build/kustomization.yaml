apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Workloads and inputs declare ci-builds explicitly; admission objects are cluster-scoped.
resources:
  - pipeline.yaml
  - dashboard/admission.yaml
configMapGenerator:
  - name: envoy-build-inputs
    namespace: ci-builds
    files:
      - lock.json
      - 48409.patch
      - regression.patch
      - inside.sh
    options:
      # The Tekton Task references this name; Kustomize has no name reference for it.
      disableNameSuffixHash: true
