apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: envoy-backport-pilot-
  namespace: ci-builds
spec:
  pipelineRef:
    name: envoy-backport-pilot
  timeouts:
    pipeline: 5h50m
  taskRunTemplate:
    serviceAccountName: envoy-builder
    podTemplate:
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        ci.dmuix.com/envoy-builder: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
