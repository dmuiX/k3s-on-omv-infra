apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # Radar uses a dedicated API-key-only account for read-only GitOps diffs.
  accounts.radar: apiKey
  accounts.radar.enabled: "true"
  # Preserve Argo's existing default exclusions, then avoid caching unused
  # provider APIs. Database/Vault ProviderConfig APIs authored in Git remain visible.
  resource.exclusions: |
    - apiGroups: ['', discovery.k8s.io]
      kinds: [Endpoints, EndpointSlice]
    - apiGroups: [coordination.k8s.io]
      kinds: [Lease]
    - apiGroups: [authentication.k8s.io, authorization.k8s.io]
      kinds: [SelfSubjectReview, TokenReview, LocalSubjectAccessReview, SelfSubjectAccessReview, SelfSubjectRulesReview, SubjectAccessReview]
    - apiGroups: [certificates.k8s.io, cert-manager.io]
      kinds: [CertificateSigningRequest, CertificateRequest]
    - apiGroups: [cilium.io]
      kinds: [CiliumIdentity, CiliumEndpoint, CiliumEndpointSlice]
    - apiGroups: [kyverno.io, reports.kyverno.io, wgpolicyk8s.io]
      kinds: [PolicyReport, ClusterPolicyReport, EphemeralReport, ClusterEphemeralReport, AdmissionReport, ClusterAdmissionReport, BackgroundScanReport, ClusterBackgroundScanReport, UpdateRequest]
    - apiGroups:
        - '*.vault.m.upbound.io'
        - vault.m.upbound.io
        - ad.vault.upbound.io
        - alicloud.vault.upbound.io
        - approle.vault.upbound.io
        - audit.vault.upbound.io
        - auth.vault.upbound.io
        - aws.vault.upbound.io
        - azure.vault.upbound.io
        - cert.vault.upbound.io
        - consul.vault.upbound.io
        - egp.vault.upbound.io
        - gcp.vault.upbound.io
        - generic.vault.upbound.io
        - github.vault.upbound.io
        - jwt.vault.upbound.io
        - kmip.vault.upbound.io
        - kubernetes.vault.upbound.io
        - kv.vault.upbound.io
        - ldap.vault.upbound.io
        - managed.vault.upbound.io
        - mfa.vault.upbound.io
        - mongodbatlas.vault.upbound.io
        - nomad.vault.upbound.io
        - okta.vault.upbound.io
        - password.vault.upbound.io
        - pki.vault.upbound.io
        - quota.vault.upbound.io
        - rabbitmq.vault.upbound.io
        - raft.vault.upbound.io
        - rgp.vault.upbound.io
        - ssh.vault.upbound.io
        - terraform.vault.upbound.io
        - token.vault.upbound.io
        - transform.vault.upbound.io
        - transit.vault.upbound.io
        - vault.vault.upbound.io
      kinds: ['*']
    - apiGroups: [apiextensions.crossplane.io]
      kinds: [ManagedResourceDefinition]
  # Expose only the generic child Application contract required by app-of-apps waves.
  resource.customizations.health.argoproj.io_Application: |
    local hs = {status = "Progressing", message = "Waiting for child Application status"}
    if obj.status == nil then return hs end

    local status = obj.status
    local operation = status.operationState
    if obj.operation ~= nil or (operation ~= nil and
       (operation.phase == "Running" or operation.phase == "Terminating")) then
      hs.message = "Waiting for child Application operation to finish"
      return hs
    end
    if operation ~= nil and (operation.phase == "Failed" or operation.phase == "Error") then
      hs.status = "Degraded"
      hs.message = "Child Application sync " .. operation.phase
      return hs
    end
    if status.sync == nil or status.sync.status ~= "Synced" then
      hs.message = "Waiting for child Application sync: " ..
        (status.sync and status.sync.status or "Unknown")
      return hs
    end
    if status.health ~= nil and status.health.status ~= nil then
      hs.status = status.health.status
      hs.message = status.health.message or ""
    else
      hs.message = "Waiting for child Application health"
    end
    return hs
  resource.customizations.health.identity.vault.upbound.io_OidcKey: |
    local hs = {status = "Progressing", message = "Waiting for OpenBao OIDC key reconciliation"}
    if obj.status == nil or obj.status.conditions == nil then return hs end
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        hs.message = condition.message or condition.reason or hs.message
        if condition.status == "True" then
          hs.status = "Healthy"
        elseif condition.reason == "ReconcileError" or condition.reason == "Unavailable" then
          hs.status = "Degraded"
        end
        return hs
      end
    end
    return hs
  resource.customizations.health.identity.vault.upbound.io_OidcScope: |
    local hs = {status = "Progressing", message = "Waiting for OpenBao OIDC scope reconciliation"}
    if obj.status == nil or obj.status.conditions == nil then return hs end
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        hs.message = condition.message or condition.reason or hs.message
        if condition.status == "True" then
          hs.status = "Healthy"
        elseif condition.reason == "ReconcileError" or condition.reason == "Unavailable" then
          hs.status = "Degraded"
        end
        return hs
      end
    end
    return hs
  resource.customizations.health.identity.vault.upbound.io_OidcClient: |
    local hs = {status = "Progressing", message = "Waiting for OpenBao OIDC client reconciliation"}
    if obj.status == nil or obj.status.conditions == nil then return hs end
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        hs.message = condition.message or condition.reason or hs.message
        if condition.status == "True" then
          hs.status = "Healthy"
        elseif condition.reason == "ReconcileError" or condition.reason == "Unavailable" then
          hs.status = "Degraded"
        end
        return hs
      end
    end
    return hs
  resource.customizations.health.identity.vault.upbound.io_OidcProvider: |
    local hs = {status = "Progressing", message = "Waiting for OpenBao OIDC provider reconciliation"}
    if obj.status == nil or obj.status.conditions == nil then return hs end
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        hs.message = condition.message or condition.reason or hs.message
        if condition.status == "True" then
          hs.status = "Healthy"
        elseif condition.reason == "ReconcileError" or condition.reason == "Unavailable" then
          hs.status = "Degraded"
        end
        return hs
      end
    end
    return hs
  resource.customizations.health.secrets.hashicorp.com_VaultDynamicSecret: |
    local hs = {status = "Progressing", message = "Waiting for synchronized dynamic destination Secret"}
    if obj.status == nil or obj.status.conditions == nil then return hs end
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        if condition.observedGeneration == nil or obj.metadata == nil or
           condition.observedGeneration ~= obj.metadata.generation then
          hs.message = "Waiting for current VaultDynamicSecret generation"
          return hs
        end
        if condition.status == "True" then
          hs.status = "Healthy"
          hs.message = condition.message or "Dynamic destination Secret synchronized"
        elseif condition.status == "False" then
          hs.status = "Degraded"
          hs.message = condition.message or "Dynamic destination Secret synchronization failed"
        else
          hs.message = condition.message or "Waiting for dynamic destination Secret synchronization"
        end
        return hs
      end
    end
    return hs
  resource.customizations.health.secrets.hashicorp.com_VaultStaticSecret: |
    local hs = {status = "Progressing", message = "Waiting for synchronized destination Secret"}
    if obj.status == nil or obj.status.conditions == nil then return hs end
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        if condition.observedGeneration == nil or obj.metadata == nil or
           condition.observedGeneration ~= obj.metadata.generation then
          hs.message = "Waiting for current VaultStaticSecret generation"
          return hs
        end
        if condition.status == "True" then
          hs.status = "Healthy"
          hs.message = condition.message or "Destination Secret synchronized"
        elseif condition.status == "False" then
          hs.status = "Degraded"
          hs.message = condition.message or "Destination Secret synchronization failed"
        else
          hs.message = condition.message or "Waiting for destination Secret synchronization"
        end
        return hs
      end
    end
    return hs
