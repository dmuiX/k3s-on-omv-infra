apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # Gate app-of-apps waves on both child health and successful sync.
  resource.customizations.health.argoproj.io_Application: |
    local hs = {status = "Progressing", message = "Waiting for child Application status"}
    if obj.status == nil then
      return hs
    end

    local status = obj.status
    if obj.operation ~= nil or (status.operationState ~= nil and
       (status.operationState.phase == "Running" or status.operationState.phase == "Terminating")) then
      hs.message = "Waiting for child Application operation to finish"
      return hs
    end

    if status.operationState ~= nil and
       (status.operationState.phase == "Failed" or status.operationState.phase == "Error") then
      hs.status = "Degraded"
      hs.message = "Child Application sync " .. status.operationState.phase
      return hs
    end

    if status.health ~= nil and
       (status.health.status == "Degraded" or status.health.status == "Missing") then
      hs.status = status.health.status
      hs.message = status.health.message or "Child Application health " .. hs.status
      return hs
    end

    if status.sync == nil or status.sync.status ~= "Synced" then
      hs.message = "Waiting for child Application sync: " ..
        (status.sync and status.sync.status or "Unknown")
      return hs
    end

    if status.health ~= nil and status.health.status ~= nil then
      hs.status = status.health.status
      hs.message = status.health.message or ""
    else
      hs.message = "Waiting for child Application health"
    end
    return hs
  resource.customizations.health.postgresql.cnpg.io_Cluster: |
    local hs = {status = "Progressing", message = "Waiting for CloudNativePG cluster status"}
    if obj.status == nil or obj.status.phase == nil then return hs end
    local phase = obj.status.phase
    if phase == "Cluster in healthy state" then
      hs.status = "Healthy"
    elseif phase == "Setting up primary" or phase == "Creating a new replica" or
           phase == "Upgrading cluster" or phase == "Waiting for the instances to become active" or
           phase == "Promoting to primary cluster" then
      hs.status = "Progressing"
    else
      hs.status = "Degraded"
    end
    hs.message = obj.status.phaseReason or phase
    return hs
  resource.customizations.health.postgresql.cnpg.io_DatabaseRole: |
    local hs = {status = "Progressing", message = "Waiting for CloudNativePG to reconcile DatabaseRole"}
    if obj.status == nil then return hs end
    local observed = obj.metadata == nil or obj.metadata.generation == nil or
      obj.status.observedGeneration == obj.metadata.generation
    if obj.status.applied == true and observed then
      hs.status = "Healthy"
      hs.message = obj.status.message or ""
    elseif obj.status.applied == false and observed then
      hs.status = "Degraded"
      hs.message = obj.status.message or "CloudNativePG failed to apply DatabaseRole"
    elseif obj.status.message ~= nil then
      hs.message = obj.status.message
    end
    return hs
  resource.customizations.health.postgresql.cnpg.io_Database: |
    local hs = {status = "Progressing", message = "Waiting for CloudNativePG to reconcile Database"}
    if obj.status == nil then return hs end
    local observed = obj.metadata == nil or obj.metadata.generation == nil or
      obj.status.observedGeneration == obj.metadata.generation
    if obj.status.applied == true and observed then
      hs.status = "Healthy"
      hs.message = obj.status.message or ""
    elseif obj.status.applied == false and observed then
      hs.status = "Degraded"
      hs.message = obj.status.message or "CloudNativePG failed to apply Database"
    elseif obj.status.message ~= nil then
      hs.message = obj.status.message
    end
    return hs
  resource.customizations.health.postgresql.cnpg.io_ScheduledBackup: |
    local hs = {status = "Progressing", message = "Waiting for the first scheduled backup"}
    if obj.status ~= nil and obj.status.lastScheduleTime ~= nil then
      hs.status = "Healthy"
      hs.message = "Backup has been scheduled"
    elseif obj.status ~= nil and obj.status.error ~= nil and obj.status.error ~= "" then
      hs.status = "Degraded"
      hs.message = obj.status.error
    end
    return hs
  resource.customizations.health.postgresql.cnpg.io_Backup: |
    local hs = {status = "Progressing", message = "Waiting for backup to complete"}
    if obj.status == nil or obj.status.phase == nil then return hs end
    local phase = obj.status.phase
    if phase == "completed" then
      hs.status = "Healthy"
    elseif phase == "failed" or phase == "walArchivingFailing" or phase == "invalid backup definition" then
      hs.status = "Degraded"
    end
    hs.message = obj.status.error or phase
    return hs
  resource.customizations.health.barmancloud.cnpg.io_ObjectStore: |
    local hs = {status = "Progressing", message = "Waiting for a successful Barman backup"}
    if obj.status == nil or obj.status.serverRecoveryWindow == nil then return hs end
    for _, window in pairs(obj.status.serverRecoveryWindow) do
      if window.lastSuccessfulBackupTime ~= nil then
        hs.status = "Healthy"
        hs.message = "Barman recovery window is available"
        return hs
      end
    end
    return hs
