apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: argocd
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.3
    helm:
      valueFiles:
      - $live/infra/helm-values/argocd-config.yml
      releaseName: argocd
      valuesObject:
        configs:
          cm:
            accounts.radar: apiKey
            accounts.radar.enabled: 'true'
            # Preserve Argo's default high-churn exclusions and avoid caching
            # provider APIs that the reviewed Crossplane allowlist cannot use.
            resource.exclusions: |
              - apiGroups: ['', discovery.k8s.io]
                kinds: [Endpoints, EndpointSlice]
              - apiGroups: [coordination.k8s.io]
                kinds: [Lease]
              - apiGroups: [authentication.k8s.io, authorization.k8s.io]
                kinds: [SelfSubjectReview, TokenReview, LocalSubjectAccessReview, SelfSubjectAccessReview, SelfSubjectRulesReview, SubjectAccessReview]
              - apiGroups: [certificates.k8s.io, cert-manager.io]
                kinds: [CertificateSigningRequest, CertificateRequest]
              - apiGroups: [cilium.io]
                kinds: [CiliumIdentity, CiliumEndpoint, CiliumEndpointSlice]
              - apiGroups: [kyverno.io, reports.kyverno.io, wgpolicyk8s.io]
                kinds: [PolicyReport, ClusterPolicyReport, EphemeralReport, ClusterEphemeralReport, AdmissionReport, ClusterAdmissionReport, BackgroundScanReport, ClusterBackgroundScanReport, UpdateRequest]
              - apiGroups:
                - '*.vault.m.upbound.io'
                - vault.m.upbound.io
                - ad.vault.upbound.io
                - alicloud.vault.upbound.io
                - approle.vault.upbound.io
                - audit.vault.upbound.io
                - aws.vault.upbound.io
                - azure.vault.upbound.io
                - cert.vault.upbound.io
                - consul.vault.upbound.io
                - egp.vault.upbound.io
                - gcp.vault.upbound.io
                - generic.vault.upbound.io
                - github.vault.upbound.io
                - jwt.vault.upbound.io
                - kmip.vault.upbound.io
                - ldap.vault.upbound.io
                - managed.vault.upbound.io
                - mfa.vault.upbound.io
                - mongodbatlas.vault.upbound.io
                - nomad.vault.upbound.io
                - okta.vault.upbound.io
                - pki.vault.upbound.io
                - quota.vault.upbound.io
                - rabbitmq.vault.upbound.io
                - raft.vault.upbound.io
                - rgp.vault.upbound.io
                - ssh.vault.upbound.io
                - terraform.vault.upbound.io
                - token.vault.upbound.io
                - transform.vault.upbound.io
                - transit.vault.upbound.io
                kinds: ['*']
              - apiGroups: [apiextensions.crossplane.io]
                kinds: [ManagedResourceDefinition]
            resource.customizations.health.argoproj.io_Application: |
              -- Keep health-gated waves, but permit drift after a full sync of the current inputs.
              -- Argo Application status fields: https://argo-cd.readthedocs.io/en/stable/operator-manual/health/
              local hs = {status = "Progressing", message = "Waiting for current child rollout and health"}
              local function equal(a, b)
                if type(a) ~= type(b) then return false end
                if type(a) ~= "table" then return a == b end
                for k, v in pairs(a) do
                  if not equal(v, b[k]) then return false end
                end
                for k, _ in pairs(b) do
                  if a[k] == nil then return false end
                end
                return true
              end
              local status = obj.status
              if status == nil then return hs end
              local op = status.operationState
              if op ~= nil and (op.phase == "Failed" or op.phase == "Error") then
                return {status = "Degraded", message = op.message or "Child sync failed"}
              end
              for _, condition in ipairs(status.conditions or {}) do
                if condition.type == "ComparisonError" or condition.type == "InvalidSpecError" or condition.type == "SyncError" then
                  return {status = "Degraded", message = condition.message or condition.type}
                end
              end
              if obj.operation ~= nil or op == nil or op.phase ~= "Succeeded" then return hs end
              local sync = status.sync
              local spec = obj.spec or {}
              if sync == nil or (sync.status ~= "Synced" and sync.status ~= "OutOfSync") then return hs end
              local compared = sync.comparedTo or {}
              local multi = spec.sources ~= nil and #spec.sources > 0
              if not equal(spec.destination, compared.destination) then return hs end
              if multi then
                if not equal(spec.sources, compared.sources) then return hs end
              elseif not equal(spec.source, compared.source) then return hs end
              if sync.status == "OutOfSync" then
                local result = op.syncResult or {}
                local request = (op.operation or {}).sync
                -- Selective syncs and dry runs cannot prove a full deployment of these inputs.
                if request == nil or request.dryRun == true or (request.resources ~= nil and #request.resources > 0) then return hs end
                if multi then
                  if sync.revisions == nil or #sync.revisions ~= #spec.sources then return hs end
                  for _, revision in ipairs(sync.revisions) do
                    if revision == "" then return hs end
                  end
                  if not equal(sync.revisions, result.revisions) or not equal(spec.sources, result.sources) then return hs end
                else
                  if sync.revision == nil or sync.revision == "" or sync.revision ~= result.revision then return hs end
                  if not equal(spec.source, result.source) then return hs end
                end
              end
              if status.health ~= nil then
                hs.status = status.health.status or "Progressing"
                hs.message = status.health.message or "Child rollout evaluated; resource drift remains visible on the child"
              end
              return hs
          rbac:
            policy.csv: |
              p, role:radar, applications, get, */*, allow
              p, role:radar, projects, get, *, allow
              g, radar, role:radar
          params:
            server.insecure: 'false'
        controller:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
        repoServer:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        server:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
        applicationSet:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
        notifications:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
        dex:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
        redis:
          containerSecurityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    path: infra/argocd-config
    ref: live
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
