apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels: 
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for child Application sync and health"
    if obj.status ~= nil and obj.status.operationState ~= nil and obj.status.operationState.phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.operationState.message or "Child sync failed"
      return hs
    end
    if obj.status == nil or obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
      return hs
    end
    if obj.status.health ~= nil then
      hs.status = obj.status.health.status
      hs.message = obj.status.health.message or hs.message
    end
    return hs
