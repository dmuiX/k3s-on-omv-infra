apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # HTTPS terminates at kube-system/traefik-gateway. The backend stays ClusterIP-only.
  # Existing argocd-server pods need a controlled restart to read this value.
  server.insecure: "true"
