apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  # Retain the existing aggregated-API TLS policy; kubelet TLS verification stays on.
  insecureSkipTLSVerify: true
  service:
    name: metrics-server-native
    namespace: kube-system
    port: 443
  version: v1beta1
  versionPriority: 100
