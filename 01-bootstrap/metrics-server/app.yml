apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    # Resource metrics must precede Istiod's health-gated CPU autoscaler.
    argocd.argoproj.io/sync-wave: '-6'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: kube-system
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        replicas: 2
        # Hard host separation leaves no third eligible node for a surge Pod.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        priorityClassName: system-node-critical
        nodeSelector:
          kubernetes.io/os: linux
          compute-class: standard
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: metrics-server
                  app.kubernetes.io/instance: metrics-server
        resources:
          requests:
            cpu: 100m
            memory: 70Mi
        apiService:
          create: true
          # Preserve K3s's existing runtime self-signed serving-TLS behavior.
          insecureSkipTLSVerify: true
        tls:
          type: metrics-server
        args:
        - --tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
