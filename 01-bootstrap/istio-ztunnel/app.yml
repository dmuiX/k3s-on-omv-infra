apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: istio-ztunnel
  namespace: argocd
  annotations: 
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination: 
    name: in-cluster
    namespace: istio-system
  sources:
    - repoURL: https://blob.istio.io/istio-release/charts
      chart: ztunnel
      targetRevision: 1.31.2
      helm: 
        releaseName: ztunnel
        valueFiles: 
          - $infra/01-bootstrap/istio-ambient/ztunnel-values.yml
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      ref: infra
  syncPolicy: 
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
      syncOptions: 
        - CreateNamespace=true
          ServerSideApply=true
