apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resource-defaults
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: kube-system
  sources:
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 01-bootstrap/resource-defaults/resources
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
