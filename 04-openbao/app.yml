apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    name: in-cluster
    namespace: openbao
  sources:
  - repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.4
    helm:
      valuesObject:
        server:
          # Replaces allow-openbao-raft-and-clients with the chart policy openbao.
          # Pruning is disabled: retain the old resource until reviewed retirement.
          # The accepted native selector adds instance=openbao (not component=server).
          networkPolicy:
            enabled: true
            ingress:
            - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openbao
              ports:
              - protocol: TCP
                port: 8201
            - from:
              - podSelector: {}
              ports:
              - protocol: TCP
                port: 8200
            # Ambient preserves workload source IPs while tunneling over HBONE.
            # https://istio.io/latest/docs/ambient/usage/networkpolicy/
            - from:
              - podSelector: {}
              - namespaceSelector:
                  matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                    - cert-manager
                    - crossplane-system
                    - vault-secrets-operator
                    - cloudnative-pg
                    - kube-prometheus-stack
                    - radar
                    - audiobookshelf
                    - longhorn
                    - backup-validation
                    - kube-system
                    - istio-gateway
              ports:
              - protocol: TCP
                port: 15008
            - from:
              - namespaceSelector:
                  matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                    - cert-manager
                    - crossplane-system
                    - vault-secrets-operator
                    - cloudnative-pg
                    - kube-prometheus-stack
                    - radar
                    - audiobookshelf
                    - longhorn
                    - backup-validation
                    - kube-system
                    - istio-gateway
              ports:
              - protocol: TCP
                port: 8200
            # Direct traffic is constrained too; HBONE authorization is in metrics.yaml.
            - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-prometheus-stack
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
              ports:
              - protocol: TCP
                port: 9101
            egress:
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: cloudnative-pg
                podSelector:
                  matchLabels:
                    cnpg.io/cluster: k3s-postgres
              ports:
              - protocol: TCP
                port: 5432
              - protocol: TCP
                port: 15008
            - to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openbao
              ports:
              - protocol: TCP
                port: 8200
              - protocol: TCP
                port: 8201
              - protocol: TCP
                port: 15008
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
              ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
              - protocol: TCP
                port: 443
            - ports:
              - protocol: TCP
                port: 6443
          extraPorts:
          - name: metrics
            containerPort: 9101
            protocol: TCP
          service:
            extraPorts:
            - name: metrics
              port: 9101
              targetPort: metrics
              protocol: TCP
            # Deployment-specific API destinations are supplied by Live.
          podManagementPolicy: Parallel
          statefulSet:
            securityContext:
              container:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
          gateway:
            httpRoute:
              # Chart 0.30.4 (still unfixed in 0.30.6) omits backendRefs group/weight
              # and has no rules override. Kubernetes defaults cause Argo CD drift.
              # charts/service-route below preserves this route with explicit defaults;
              # restore native routing once upstream supports these fields.
              enabled: false
              apiVersion: gateway.networking.k8s.io/v1
              activeService: true
              parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: istio-gateway
                namespace: istio-gateway
                sectionName: https
          standalone:
            enabled: false
          ha:
            enabled: true
            replicas: 3
            disruptionBudget:
              enabled: true
              maxUnavailable: 1
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true
                telemetry {
                  prometheus_retention_time = "30s"
                  disable_hostname = true
                }
                listener "tcp" {
                  address = "[::]:8200"
                  tls_disable = 1
                  telemetry {
                    disallow_metrics = true
                  }
                }
                listener "tcp" {
                  address = "[::]:9101"
                  tls_disable = 1
                  telemetry {
                    metrics_only = true
                    unauthenticated_metrics_access = true
                  }
                }
                storage "raft" {
                  path = "/openbao/data"
                  retry_join {
                    auto_join = "provider=k8s namespace=openbao label_selector=\"app.kubernetes.io/name=openbao,component=server\""
                    auto_join_scheme = "http"
                  }
                }
                service_registration "kubernetes" {}
                seal "static" {
                  current_key_id = "1"
                  current_key = "file:///openbao/seal/key"
                }
          dataStorage:
            enabled: true
            size: 1Gi
            storageClass: longhorn
            accessMode: ReadWriteOnce
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: openbao
                  topologyKey: kubernetes.io/hostname
          tolerations:
          - key: CriticalAddonsOnly
            operator: Equal
            value: 'true'
            effect: NoSchedule
          extraSecretEnvironmentVars: []
          volumes:
          - name: seal
            secret:
              secretName: openbao-unseal-key
          volumeMounts:
          - name: seal
            mountPath: /openbao/seal
            readOnly: true
        serverTelemetry:
          serviceMonitor:
            enabled: true
            port: metrics
        ui:
          enabled: true
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 04-openbao/resources
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: charts/service-route
    helm:
      releaseName: openbao-route
      valueFiles:
      - $live/infra/openbao/route-values.yml
      valuesObject:
        name: openbao
        namespace: openbao
        rules:
        - backend:
            name: openbao-active
            port: 8200
            weight: 1
          matches:
          - path:
              type: PathPrefix
              value: /
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    ref: live
    path: infra/openbao
    directory:
      exclude: '*values.y*ml'
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
        pod-security.kubernetes.io/enforce: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
