apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: vault-secrets-operator
  sources:
  - repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: 2.0.0
    helm:
      valuesObject:
        controller:
          replicas: 1
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          manager:
            resources:
              requests:
                cpu: 20m
                memory: 96Mi
              limits:
                cpu: 300m
                memory: 256Mi
        # The native monitor authenticates with the Prometheus ServiceAccount token.
        # The chart skips HTTPS certificate verification; Ambient mTLS
        # protects transport between the enrolled monitoring and VSO namespaces.
        telemetry:
          serviceMonitor:
            enabled: true
        defaultVaultConnection:
          enabled: true
          address: http://openbao-active.openbao.svc.cluster.local:8200
        defaultAuthMethod:
          enabled: false
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 02-controllers/vault-secrets-operator/resources
  # Stage 1: publish the complete Live policy before merging this source.
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    path: infra/network-policies
    directory:
      include: vso-controller.yaml
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
        pod-security.kubernetes.io/enforce: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
