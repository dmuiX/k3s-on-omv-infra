apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8up
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: k8up
  sources:
  - repoURL: https://k8up-io.github.io/k8up
    chart: k8up
    targetRevision: 4.10.1
    helm:
      valuesObject:
        replicaCount: 2
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: k8up
                    app.kubernetes.io/instance: k8up
        k8up:
          enableLeaderElection: true
        metrics:
          serviceMonitor:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            cpu: 300m
            memory: 256Mi
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 02-controllers/k8up/resources
  syncPolicy:
    managedNamespaceMetadata:
      annotations:
        radarhq.io/ignore-checks: readinessProbeMissing,automountServiceAccountToken
      labels:
        istio.io/dataplane-mode: ambient
        pod-security.kubernetes.io/enforce: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
