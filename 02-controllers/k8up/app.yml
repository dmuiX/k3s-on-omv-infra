apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8up
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  destination:
    name: in-cluster
    namespace: k8up
  project: default
  sources:
    - repoURL: https://k8up-io.github.io/k8up
      targetRevision: 4.10.0
      chart: k8up
      helm:
        valueFiles:
          - $values/02-controllers/k8up/values.yml
    - repoURL: "https://github.com/dmuiX/k3s-on-omv-infra.git"
      targetRevision: 5a0741301009c92b65080596d502d1cde74d7ce3
      ref: values
    - repoURL: "https://github.com/dmuiX/k3s-on-omv-infra.git"
      targetRevision: 5a0741301009c92b65080596d502d1cde74d7ce3
      path: 02-controllers/k8up
      directory:
        include: pdb.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
