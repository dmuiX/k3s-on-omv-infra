apiVersion: v1
kind: Namespace
metadata: {name: k8up, labels: {istio.io/dataplane-mode: ambient, pod-security.kubernetes.io/enforce: restricted}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: k8up, namespace: k8up}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: k8up}}}
