# yaml-language-server: $schema=../../values-schemas/cert-manager/values.schema.json
crds:
  enabled: true
# ClusterIssuer token/Secret references intentionally resolve in this namespace.
clusterResourceNamespace: cert-manager
# Leader-elected controllers stay available while one node is unavailable.
replicaCount: 2
tolerations:
  - key: workload-placement
    operator: Equal
    value: restricted
    effect: NoSchedule
podDisruptionBudget:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cert-manager
        topologyKey: kubernetes.io/hostname
webhook:
  replicaCount: 2
  tolerations:
    - key: workload-placement
      operator: Equal
      value: restricted
      effect: NoSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook
          topologyKey: kubernetes.io/hostname
cainjector:
  replicaCount: 2
  tolerations:
    - key: workload-placement
      operator: Equal
      value: restricted
      effect: NoSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: cainjector
          topologyKey: kubernetes.io/hostname
startupapicheck:
  tolerations:
    - key: workload-placement
      operator: Equal
      value: restricted
      effect: NoSchedule
prometheus:
  enabled: true
  podmonitor:
    enabled: true
extraArgs:
  - --enable-gateway-api
