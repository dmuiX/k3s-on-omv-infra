crds:
  enabled: true
config:
  gatewayAPI:
    enabled: true
# Pin DNS-01 self-checks independently of the LAN resolver's negative cache.
dns01RecursiveNameservers: "1.1.1.1:53,1.0.0.1:53"
dns01RecursiveNameserversOnly: true
podAnnotations:
  # Preserve explicit resolver destinations while retaining Ambient transport.
  ambient.istio.io/dns-capture: "false"
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
cainjector:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
