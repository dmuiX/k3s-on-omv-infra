apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: cert-manager
  sources:
  - repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds:
          enabled: true
        prometheus:
          servicemonitor:
            enabled: true
        config:
          gatewayAPI:
            enabled: true
        dns01RecursiveNameservers: 1.1.1.1:53,1.0.0.1:53
        dns01RecursiveNameserversOnly: true
        podAnnotations:
          ambient.istio.io/dns-capture: 'false'
        replicaCount: 2
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cert-manager
                    app.kubernetes.io/instance: cert-manager
                    app.kubernetes.io/component: controller
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 256Mi
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: webhook
                      app.kubernetes.io/instance: cert-manager
                      app.kubernetes.io/component: webhook
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 144Mi
            limits:
              memory: 256Mi
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: cainjector
                      app.kubernetes.io/instance: cert-manager
                      app.kubernetes.io/component: cainjector
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
  syncPolicy:
    managedNamespaceMetadata:
      annotations:
        radarhq.io/ignore-checks: livenessProbeMissing,readinessProbeMissing,automountServiceAccountToken
      labels:
        istio.io/dataplane-mode: ambient
        pod-security.kubernetes.io/enforce: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
