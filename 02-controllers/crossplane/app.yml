apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: crossplane-system
  sources:
  - repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.4.2
    helm:
      valuesObject:
        replicas: 1
        # Crossplane creates the default policy only once. Keep this list equal
        # to resources/activation-policy.yaml so a fresh install never expands
        # the Vault provider to every API shipped in its package.
        provider:
          defaultActivations:
          - secretbackendconnections.database.vault.upbound.io
          - secretbackendstaticroles.database.vault.upbound.io
          - oidcclients.identity.vault.upbound.io
          - oidckeys.identity.vault.upbound.io
          - oidcproviders.identity.vault.upbound.io
          - oidcscopes.identity.vault.upbound.io
          - mounts.vault.vault.upbound.io
          - policies.vault.vault.upbound.io
          - secretbackendv2s.kv.vault.upbound.io
          - backends.auth.vault.upbound.io
          - policies.password.vault.upbound.io
          - authbackendroles.kubernetes.vault.upbound.io
          - secretbackendroles.database.vault.upbound.io
          - groups.identity.vault.upbound.io
          - oidcroles.identity.vault.upbound.io
          - oidcassignments.identity.vault.upbound.io
        resourcesCrossplane:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        podSecurityContextCrossplane:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        podSecurityContextRBACManager:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContextCrossplane:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        securityContextRBACManager:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 02-controllers/crossplane/resources
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
