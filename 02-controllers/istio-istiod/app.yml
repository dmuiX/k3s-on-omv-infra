apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: istio-istiod, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "-1"}}
spec:
  project: default
  destination: {name: in-cluster, namespace: istio-system}
  sources:
    - repoURL: https://blob.istio.io/istio-release/charts
      chart: istiod
      targetRevision: 1.31.2
      helm: {releaseName: istiod, valueFiles: [$infra/02-controllers/istio-ambient/values.yml, $live/infra/istio-ambient-values.yml]}
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git', targetRevision: main, ref: infra}
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git', targetRevision: main, ref: live}
  syncPolicy: {automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}, syncOptions: [CreateNamespace=true, ServerSideApply=true]}
