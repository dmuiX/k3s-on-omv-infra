apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: kyverno
  sources:
  - repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.10.0
    helm:
      valuesObject:
        global:
          nodeSelector:
            compute-class: standard
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                - kube-system
                - istio-system
                - istio-gateway
        webhooksCleanup:
          enabled: false
        admissionController:
          replicas: 2
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - admission-controller
                topologyKey: kubernetes.io/hostname
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          container:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 384Mi
          initContainer:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          serviceMonitor:
            enabled: true
        backgroundController:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          serviceMonitor:
            enabled: true
        reportsController:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          serviceMonitor:
            enabled: true
        cleanupController:
          enabled: false
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 02-controllers/kyverno/resources
  syncPolicy:
    managedNamespaceMetadata:
      annotations:
        radarhq.io/ignore-checks: automountServiceAccountToken
      labels:
        istio.io/dataplane-mode: ambient
        pod-security.kubernetes.io/enforce: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
