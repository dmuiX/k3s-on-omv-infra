# Restrict Kyverno Prometheus metrics (8000) to Prometheus over Istio Ambient mTLS,
# while leaving the admission webhook and kubelet health probes on port 9443 unaffected.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kyverno-metrics
  namespace: kyverno
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/part-of: kyverno
  action: DENY
  rules:
  - from:
    - source:
        notPrincipals:
        - cluster.local/ns/kube-prometheus-stack/sa/kube-prometheus-stack-prometheus
    to:
    - operation:
        ports:
        - '8000'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-metrics-ingress
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/part-of: kyverno
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-prometheus-stack
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 15008
---
# Allow kube-apiserver on control-plane nodes to reach the admission webhook on port 9443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-admission-webhook-ingress
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/component: admission-controller
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 9443
