apiVersion: v1
kind: Namespace
metadata: {name: cloudnative-pg, labels: {istio.io/dataplane-mode: ambient, pod-security.kubernetes.io/enforce: restricted}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cloudnative-pg-controller, namespace: cloudnative-pg}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: cloudnative-pg}}}
