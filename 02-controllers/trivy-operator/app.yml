apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: trivy-operator
  sources:
  - repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.38.1
    helm:
      valuesObject:
        operator:
          replicas: 2
          scanJobsConcurrentLimit: 2
          scanJobTimeout: 10m
          builtInTrivyServer: true
          sbomGenerationEnabled: true
          infraAssessmentScannerEnabled: false
          clusterComplianceEnabled: false
        serviceMonitor:
          enabled: true
        trivyOperator:
          scanJobNodeSelector:
            compute-class: standard
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
        trivy:
          slow: true
          timeout: 10m0s
          additionalVulnerabilityReportFields: Description,Links,CVSS,Target,Class,PackagePath,PackageType
          storageClassEnabled: true
          storageClassName: longhorn-single-node-delete
          storageSize: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          server:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 1Gi
            podSecurityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              fsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
        nodeSelector:
          compute-class: standard
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: trivy-operator
                    app.kubernetes.io/instance: trivy-operator
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 02-controllers/trivy-operator/resources
  syncPolicy:
    managedNamespaceMetadata:
      annotations:
        radarhq.io/ignore-checks: automountServiceAccountToken
      labels:
        istio.io/dataplane-mode: ambient
        pod-security.kubernetes.io/enforce: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
