apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: longhorn
  sources:
  - repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.13.0
    helm:
      valueFiles:
      - $live/infra/longhorn/values.yml
      valuesObject:
        metrics:
          serviceMonitor:
            enabled: true
        networkPolicies:
          metricsScrapeSources:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-prometheus-stack
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                prometheus: kube-prometheus-stack-prometheus
        defaultSettings:
          defaultReplicaCount: '{"v1":"3","v2":"3"}'
          defaultDataLocality: disabled
          storageOverProvisioningPercentage: 100
          replicaAutoBalance: best-effort
          taintToleration: CriticalAddonsOnly=true:NoSchedule
          # Requests only: preserve the current unbounded CSI burst limits.
          # Activate only after the paired Pi reservation change is effective.
          systemManagedCSIComponentsResourceLimits: >-
            {"csi-attacher":{"requests":{"cpu":"10m","memory":"80Mi"}},
            "csi-provisioner":{"requests":{"cpu":"10m","memory":"80Mi"}},
            "csi-resizer":{"requests":{"cpu":"10m","memory":"80Mi"}},
            "csi-snapshotter":{"requests":{"cpu":"10m","memory":"80Mi"}},
            "longhorn-csi-plugin":{"requests":{"cpu":"125m","memory":"48Mi"}},
            "node-driver-registrar":{"requests":{"cpu":"5m","memory":"48Mi"}},
            "longhorn-liveness-probe":{"requests":{"cpu":"5m","memory":"48Mi"}}}
        persistence:
          createStorageClass: false
          defaultClass: false
          reclaimPolicy: Retain
          defaultFsType: ext4
        longhornUI:
          replicas: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
        longhornManager:
          tolerations:
          - key: CriticalAddonsOnly
            operator: Equal
            value: 'true'
            effect: NoSchedule
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        longhornGlobalManager:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
        preUpgradeChecker:
          jobEnabled: false
        csi:
          podAntiAffinityPreset: hard
          attacherReplicaCount: 3
          provisionerReplicaCount: 3
          resizerReplicaCount: 3
          snapshotterReplicaCount: 3
  # Keep after Helm: this directory overrides only Deployment/longhorn-ui.
  - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 02-controllers/longhorn/resources
  - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
    targetRevision: main
    ref: live
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
