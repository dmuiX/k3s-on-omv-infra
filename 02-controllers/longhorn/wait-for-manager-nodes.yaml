apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-manager-node-wait
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-manager-node-wait-kubeconfig
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc.cluster.local
          certificate-authority: /run/kube-api/ca.crt
    users:
      - name: longhorn-manager-node-wait
        user:
          tokenFile: /run/kube-api/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          namespace: longhorn
          user: longhorn-manager-node-wait
    current-context: in-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-manager-node-wait
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-manager-node-wait
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-manager-node-wait
subjects:
  - kind: ServiceAccount
    name: longhorn-manager-node-wait
    namespace: longhorn
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-manager-node-wait
  namespace: longhorn
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  activeDeadlineSeconds: 660
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-manager-node-wait
        app.kubernetes.io/part-of: longhorn
    spec:
      serviceAccountName: longhorn-manager-node-wait
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: wait
          image: rancher/k3s:v1.37.1-k3s1@sha256:ca7f37d993d82ef0dcdcfecb2e0e2618ea541dbaffc620c8cedebe01a82acd0d
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              attempts=0
              while [ "$attempts" -lt 120 ]; do
                complete=true
                for node in omv wyse5070; do
                  if ! disk_count="$(
                    k3s kubectl --kubeconfig=/run/kube-api/kubeconfig \
                      --request-timeout=10s --cache-dir=/tmp --namespace longhorn \
                      get nodes.longhorn.io "$node" \
                      --output=go-template='{{len .spec.disks}}'
                  )"; then
                    echo "Longhorn node $node is not readable yet." >&2
                    complete=false
                    break
                  fi
                  case "$disk_count" in
                    ''|*[!0-9]*)
                      echo "Longhorn node $node returned an invalid disk count." >&2
                      exit 1
                      ;;
                    0)
                      complete=false
                      break
                      ;;
                  esac
                done
                if [ "$complete" = true ]; then
                  exit 0
                fi
                attempts=$((attempts + 1))
                sleep 5
              done
              echo 'Longhorn Manager did not create complete OMV/Wyse node disks in time.' >&2
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: kube-api-access
              mountPath: /run/kube-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - configMap:
                  name: longhorn-manager-node-wait-kubeconfig
                  items:
                    - key: kubeconfig
                      path: kubeconfig
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
