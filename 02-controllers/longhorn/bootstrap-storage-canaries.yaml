apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-bootstrap-standard
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-bootstrap-monitoring
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-monitoring
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-bootstrap-storage-canaries
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-bootstrap-storage-canaries
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-bootstrap-storage-canaries
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - /bin/sh
            - -ec
            - touch /standard/ready /monitoring/ready && exec sleep 2147483647
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: standard
              mountPath: /standard
            - name: monitoring
              mountPath: /monitoring
      volumes:
        - name: standard
          persistentVolumeClaim:
            claimName: longhorn-bootstrap-standard
        - name: monitoring
          persistentVolumeClaim:
            claimName: longhorn-bootstrap-monitoring
