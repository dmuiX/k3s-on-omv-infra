# yaml-language-server: $schema=../../values-schemas/longhorn/values.schema.json
defaultSettings:
  defaultDataPath: /var/lib/longhorn
  createDefaultDiskLabeledNodes: "false"
  # New volumes use one replica per cluster node. Existing volumes must be
  # expanded to three replicas separately and verified before relying on HA.
  defaultReplicaCount:
    v1: "3"
    v2: "3"
  guaranteedInstanceManagerCPU: 12
persistence:
  # The last Argo source overrides the chart's longhorn-storageclass ConfigMap
  # with storageclass-configmap.yaml to add encryption. Keep both in sync.
  # Keep K3s local-path as the only default; PVCs opt into Longhorn explicitly.
  defaultClass: false
  defaultClassReplicaCount: 3
  reclaimPolicy: Retain
service:
  ui:
    type: ClusterIP # Exposed only through the shared Traefik Gateway.
metrics:
  serviceMonitor:
    enabled: true
longhornManager:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
preUpgradeChecker:
     jobEnabled: false # necessary as its kind of a egg chicken problem: longhorn-pre-upgrade is a PreSync hook, but its pod needs longhorn-service-account, which will be created while its deploying