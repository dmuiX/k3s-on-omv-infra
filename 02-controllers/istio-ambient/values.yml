# Values for the official istiod chart only.
profile: ambient
base:
  validationFailurePolicy: Fail
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}
global:
  platform: k3s
  proxy: {resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}}
