apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Istio 1.30 Gateway API automated deployment: native strategic-merge overlays.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-gateway-options
  namespace: istio-ingress
data:
  deployment: |
    spec:
      replicas: 3
      strategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      template:
        spec:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      gateway.networking.k8s.io/gateway-name: ingress-gateway
                  topologyKey: kubernetes.io/hostname
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: ingress-gateway
          containers:
            - name: istio-proxy
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 300m, memory: 256Mi}
  podDisruptionBudget: |
    spec:
      minAvailable: 2
      selector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: ingress-gateway
