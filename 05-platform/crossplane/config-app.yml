apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provider-vault-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    name: in-cluster
    namespace: crossplane-system
  project: default
  source:
    repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: main
    path: 03-core/crossplane/provider-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
