    serverFlag: false
    clientFlag: true
    codeSigningFlag: false
    emailProtectionFlag: false
    keyType: rsa
    keyBits: 2048
    keyUsage:
      - DigitalSignature
      - KeyEncipherment
    extKeyUsage: []
    extKeyUsageOids: []
    policyIdentifiers: []
    ou: []
    organization: []
    country: []
    locality: []
    province: []
    streetAddress: []
    postalCode: []
    basicConstraintsValidForNonCa: false
    ttl: "7776000"
