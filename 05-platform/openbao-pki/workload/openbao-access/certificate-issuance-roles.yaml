    enforceHostnames: true
    allowIpSans: false
    allowedUriSans: []
    allowedUriSansTemplate: false
    allowedOtherSans: []
    allowedSerialNumbers: []
    allowedUserIds: []
    allowLocalhost: false
    cnValidations:
