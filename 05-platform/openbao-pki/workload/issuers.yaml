apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-pki-services
  labels:
    app.kubernetes.io/name: openbao-pki
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vault:
    server: http://openbao-active.openbao.svc.cluster.local:8200
    path: pki-services/sign/services
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-pki-services
        serviceAccountRef:
          name: openbao-pki-services
          audiences:
            - vault://openbao-pki-services
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-pki-clients
  labels:
    app.kubernetes.io/name: openbao-pki
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vault:
    server: http://openbao-active.openbao.svc.cluster.local:8200
    path: pki-clients/sign/clients
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-pki-clients
        serviceAccountRef:
          name: openbao-pki-clients
          audiences:
            - vault://openbao-pki-clients
