apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-pki-reconciler
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-pki-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-pki-reconciler
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: openbao
              app.kubernetes.io/name: openbao
              component: server
              openbao-active: "true"
      ports:
        - protocol: TCP
          port: 8200
