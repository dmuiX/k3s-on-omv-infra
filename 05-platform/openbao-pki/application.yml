# Ansible completes the OpenBao PKI ceremony and API configuration before Argo
# applies these steady-state Kubernetes resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-pki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    name: in-cluster
    namespace: openbao
  project: default
  source:
    repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
    targetRevision: c1e894afae1b84710dec8b2bfff698bff35c06e0
    path: 05-platform/openbao-pki/workload
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
