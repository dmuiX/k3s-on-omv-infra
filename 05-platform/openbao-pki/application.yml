# MANDATORY PLATFORM PHASE: infra.yml discovers this Application but excludes it
# until the external-root ceremony and guarded Ansible installation have passed.
# Its immutable targetRevision is advanced only after reviewing a workload commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-pki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    gitops.openbao.org/registration: "explicit-only-pinned-revision"
spec:
  destination:
    name: in-cluster
    namespace: openbao
  project: default
  sources:
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      # Reviewed workload commit; update explicitly when promoting PKI changes.
      targetRevision: b7bda8a3a36b489a835255176803643111cadb67
      path: 05-platform/openbao-pki/workload
    - repoURL: https://github.com/dmuiX/k3s-on-omv-infra.git
      targetRevision: b7bda8a3a36b489a835255176803643111cadb67
      path: charts/cluster-config
      helm:
        releaseName: openbao-pki-network
        valueFiles:
          - $values/clusters/omv/values.yml
        parameters:
          - name: component
            value: openbao-pki-network
    - repoURL: https://github.com/dmuiX/k3s-on-omv-live.git
      targetRevision: 2f41ae33586f87e818a304f57b3bd895c896d294
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
