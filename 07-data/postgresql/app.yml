apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: cloudnative-pg
  sources:
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: 07-data/postgresql/resources
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: adapters/postgresql-size-retention
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git'
      targetRevision: main
      path: infra/postgresql
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
