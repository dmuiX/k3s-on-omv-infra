apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    infra.k3s-on-omv.dev/deployment-blocker: POSTGRESQL_LIVE_OWNERSHIP_MIGRATION_REQUIRED
spec:
  project: default
  destination: {name: in-cluster, namespace: cloudnative-pg}
  source: {repoURL: "https://github.com/dmuiX/k3s-on-omv-infra.git", targetRevision: main, path: 07-data/postgresql, kustomize: {}}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
