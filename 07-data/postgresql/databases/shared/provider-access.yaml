apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-read-openbao-manager-credential
  namespace: cloudnative-pg
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-manager-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-read-openbao-manager-credential
  namespace: cloudnative-pg
subjects:
  - kind: ServiceAccount
    name: provider-vault
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-read-openbao-manager-credential
