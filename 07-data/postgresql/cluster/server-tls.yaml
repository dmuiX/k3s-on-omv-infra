apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-postgres-server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    cnpg.io/reload: ""
spec:
  secretName: k3s-postgres-server-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - k3s-postgres-rw.cloudnative-pg.svc
    - k3s-postgres-rw.cloudnative-pg.svc.cluster.local
    - k3s-postgres-r.cloudnative-pg.svc
    - k3s-postgres-r.cloudnative-pg.svc.cluster.local
    - k3s-postgres-ro.cloudnative-pg.svc
    - k3s-postgres-ro.cloudnative-pg.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: openbao-pki-services
