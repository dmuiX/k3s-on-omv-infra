apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudnative-pg
resources:
  - credentials/secret-delivery.yaml
  - cluster/postgres-storageClass.yaml
  - cluster/server-tls.yaml
  - cluster/postgres-cluster.yaml
  - cluster/daily-backup.yaml
  - cluster/network-policies/client-to-postgres.yaml
  - databases/shared/manager-role.yaml
  - databases/shared/provider-access.yaml
  - databases/shared/backend.yaml
  - monitoring/alerts.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: postgresql-platform
