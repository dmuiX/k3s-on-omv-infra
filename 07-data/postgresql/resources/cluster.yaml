apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: k3s-postgres
  namespace: cloudnative-pg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:b4bec141fa5ca2bab490b197c814fb1342147c8405be1fb0673951fa6db7f699
  enableSuperuserAccess: false
  enablePDB: true
  primaryUpdateStrategy: supervised
  primaryUpdateMethod: switchover
  storage:
    storageClass: longhorn-local
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule
  topologySpreadConstraints:
    - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {cnpg.io/cluster: k3s-postgres}}}
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      password_encryption: scram-sha-256
      archive_timeout: 5min
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
      maxStandbyNamesFromCluster: 2
      failoverQuorum: true
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: k3s-postgres-backups
  backup:
    target: prefer-standby
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: k3s-postgres-daily
  namespace: cloudnative-pg
spec:
  schedule: "0 7 2 * * *"
  backupOwnerReference: self
  cluster:
    name: k3s-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
