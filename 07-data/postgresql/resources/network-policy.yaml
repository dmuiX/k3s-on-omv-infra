apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: postgresql-strict
  namespace: cloudnative-pg
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cloudnative-pg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: k3s-postgres
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql
  namespace: cloudnative-pg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: k3s-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [openbao, kube-prometheus-stack, radar, backup-validation]}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: k3s-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K3s may enforce API Service traffic after DNAT to server port 6443.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
