apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openbao
  namespace: openbao
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: openbao
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openbao-raft-and-clients
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8201
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8200
    # Ambient preserves the source workload IP but tunnels over HBONE.
    # https://istio.io/latest/docs/ambient/usage/networkpolicy/
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cert-manager
                  - crossplane-system
                  - vault-secrets-operator
                  - cloudnative-pg
                  - kube-prometheus-stack
                  - radar
                  - longhorn
                  - backup-validation
                  - kube-system
                  - istio-gateway
      ports:
        - protocol: TCP
          port: 15008
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cert-manager
                  - crossplane-system
                  - vault-secrets-operator
                  - cloudnative-pg
                  - kube-prometheus-stack
                  - radar
                  - longhorn
                  - backup-validation
                  - kube-system
                  - istio-gateway
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              cnpg.io/cluster: k3s-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
        - protocol: TCP
          port: 15008
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openbao-snapshot-egress
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-snapshot
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 15008
    - ports:
        - protocol: TCP
          port: 443
