apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: openbao, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "4"}}
spec:
  project: default
  destination: {name: in-cluster, namespace: openbao}
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.4
      helm: {valueFiles: [$infra/04-core/openbao/values.yml, $live/infra/openbao-values.yml]}
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git', targetRevision: main, ref: infra}
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git', targetRevision: main, ref: live}
    - {repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git', targetRevision: main, path: 04-core/openbao/resources}
  syncPolicy: {automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}, syncOptions: [CreateNamespace=true, ServerSideApply=true]}
