# yaml-language-server: $schema=../../values-schemas/openbao/values.schema.json
global:
  serverTelemetry:
    prometheusOperator: true
# The Bank-Vaults webhook is used for injection; avoid two mutating webhooks.
injector:
  enabled: false
serverTelemetry:
  serviceMonitor:
    enabled: true
server:
  # OpenBao 0.30 renders the external route to the active HA service natively.
  # The protected Live values provide only the hostname.
  gateway:
    httpRoute:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      activeService: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: kube-system
          sectionName: websecure
  image:
    tag: "2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  # Audit output must share the Raft data volume or use a supported external
  # sink; SPEC v6.1 permits exactly one PVC per voter.
  auditStorage:
    enabled: false
  dataStorage:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
  volumes:
    - name: unseal-key-volume
      secret:
        secretName: openbao-unseal-key
        items:
          - key: unseal-key
            path: unseal-key
    - name: postgresql-ca
      secret:
        secretName: postgresql-ca
        optional: true
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: unseal-key-volume
      mountPath: /openbao/secrets
      readOnly: true
    - name: postgresql-ca
      mountPath: /openbao/postgresql-tls
      readOnly: true
  ha:
    enabled: true
    replicas: 3 # One Raft voter per cluster node; the chart's PDB protects quorum.
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          unauthenticated_metrics_access = "true"
        }

        service_registration "kubernetes" {}

        seal "static" {
          current_key_id = "20260323"
          current_key = "file:///openbao/secrets/unseal-key"
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

        storage "raft" {
          path = "/openbao/data"
          retry_join {
            auto_join = "provider=k8s namespace=openbao label_selector=\"app.kubernetes.io/name=openbao,component=server\""
            auto_join_scheme = "http"
          }
        }
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
# Snapshot scheduling and retention are owned by the separate openbao-backups
# Application. Do not invent unsupported values in the upstream runtime chart.
ui:
  enabled: true
