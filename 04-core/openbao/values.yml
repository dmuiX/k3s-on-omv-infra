server:
  # OrderedReady deadlocks before initialization because the first sealed pod is
  # not Ready. Schedule all Raft voters, then initialize and verify quorum.
  podManagementPolicy: Parallel
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  gateway:
    httpRoute:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      activeService: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: istio-gateway
          namespace: istio-gateway
          sectionName: https
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" { address = "[::]:8200"; tls_disable = 1 }
        storage "raft" {
          path = "/openbao/data"
          retry_join {
            auto_join = "provider=k8s namespace=openbao label_selector=\"app.kubernetes.io/name=openbao,component=server\""
            auto_join_scheme = "http"
          }
        }
        service_registration "kubernetes" {}
        seal "static" { current_key_id = "1"; current_key = "file:///openbao/seal/key" }
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
          topologyKey: kubernetes.io/hostname
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  extraSecretEnvironmentVars: []
  volumes:
    - name: seal
      secret:
        secretName: openbao-unseal-key
  volumeMounts:
    - name: seal
      mountPath: /openbao/seal
      readOnly: true
ui:
  enabled: true
