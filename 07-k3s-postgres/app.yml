apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    name: in-cluster
    namespace: cloudnative-pg
  sources:
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: 07-k3s-postgres/resources
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: adapters/credential-custody
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: adapters/postgresql-size-retention
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-live.git'
      targetRevision: main
      path: infra/k3s-postgres
      ref: live
    - repoURL: 'https://github.com/dmuiX/k3s-on-omv-infra.git'
      targetRevision: main
      path: charts/barman-objectstore
      helm:
        valueFiles:
          - $live/infra/r2/values.yml
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      # Adopt the existing ObjectStore in place with SSA, without client-side migration.
      - ClientSideApplyMigration=false
      - SkipDryRunOnMissingResource=true
