apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-size-retention
  namespace: cloudnative-pg
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-size-retention
  namespace: cloudnative-pg
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: postgresql-size-retention
          restartPolicy: Never
          containers:
            - name: retention
              image: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.1@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
              command:
                - /venv/bin/python3
              args:
                - /adapter/retention.py
                - run
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - configMapRef:
                    name: postgresql-retention-target
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: secret-access-key
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: region
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: S3_ENDPOINT
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              volumeMounts:
                - name: adapter
                  mountPath: /adapter
                  readOnly: true
          volumes:
            - name: adapter
              configMap:
                name: postgresql-size-retention-adapter
                defaultMode: 0444
