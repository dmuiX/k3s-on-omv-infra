apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-size-retention
  namespace: cloudnative-pg
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-r2-backup-budget-preview
  namespace: cloudnative-pg
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: postgresql-size-retention
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: retention
              image: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
              command:
                - /venv/bin/python3
              args:
                - /adapter/retention.py
                - run
                - --dry-run
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - configMapRef:
                    name: postgresql-retention-target
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: secret-access-key
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: region
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-r2-credentials
                      key: S3_ENDPOINT
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              volumeMounts:
                - name: adapter
                  mountPath: /adapter
                  readOnly: true
          volumes:
            - name: adapter
              configMap:
                name: postgresql-size-retention-adapter
                defaultMode: 0444
