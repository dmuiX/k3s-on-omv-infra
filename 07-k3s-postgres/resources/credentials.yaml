apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-vso
  namespace: cloudnative-pg
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao-postgresql
  namespace: cloudnative-pg
spec:
  address: "http://openbao-active.openbao.svc.cluster.local:8200"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openbao-postgresql
  namespace: cloudnative-pg
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: postgresql-vso
    serviceAccount: postgresql-vso
    tokenExpirationSeconds: 600
  vaultConnectionRef: openbao-postgresql
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openbao-manager-credentials
  namespace: cloudnative-pg
spec:
  vaultAuthRef: openbao-postgresql
  mount: kv
  type: kv-v2
  path: postgresql/openbao-manager
  refreshAfter: 1m
  destination:
    create: true
    name: openbao-manager-credentials
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      templates:
        username:
          text: |-
            {{- $value := get .Secrets "username" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: username" -}}
            {{- end -}}
            {{- $value -}}
        password:
          text: |-
            {{- $value := get .Secrets "password" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: password" -}}
            {{- end -}}
            {{- $value -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-r2-credentials
  namespace: cloudnative-pg
spec:
  vaultAuthRef: openbao-postgresql
  mount: kv
  type: kv-v2
  path: platform/r2
  refreshAfter: 1m
  destination:
    create: true
    name: postgresql-r2-credentials
    type: Opaque
    transformation:
      excludeRaw: true
      templates:
        access-key-id:
          text: |-
            {{- $value := get .Secrets "access-key-id" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: access-key-id" -}}
            {{- end -}}
            {{- $value -}}
        secret-access-key:
          text: |-
            {{- $value := get .Secrets "secret-access-key" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: secret-access-key" -}}
            {{- end -}}
            {{- $value -}}
        region:
          text: |-
            {{- $value := get .Secrets "region" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: region" -}}
            {{- end -}}
            {{- $value -}}
        AWS_ACCESS_KEY_ID:
          text: |-
            {{- $value := get .Secrets "access-key-id" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: access-key-id" -}}
            {{- end -}}
            {{- $value -}}
        AWS_SECRET_ACCESS_KEY:
          text: |-
            {{- $value := get .Secrets "secret-access-key" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: secret-access-key" -}}
            {{- end -}}
            {{- $value -}}
        AWS_REGION:
          text: |-
            {{- $value := get .Secrets "region" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: region" -}}
            {{- end -}}
            {{- $value -}}
        S3_ENDPOINT:
          text: |-
            {{- $value := get .Secrets "endpoint" -}}
            {{- if empty $value -}}
            {{- fail "missing required OpenBao key: endpoint" -}}
            {{- end -}}
            {{- $value -}}
