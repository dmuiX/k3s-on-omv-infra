apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-vso
  namespace: cloudnative-pg
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openbao-postgresql
  namespace: cloudnative-pg
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: postgresql-vso
    serviceAccount: postgresql-vso
    tokenExpirationSeconds: 600
  vaultConnectionRef: vault-secrets-operator/default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openbao-manager-credentials
  namespace: cloudnative-pg
spec:
  vaultAuthRef: openbao-postgresql
  mount: kv
  type: kv-v2
  path: postgresql/openbao-manager
  refreshAfter: 1m
  destination:
    create: true
    name: openbao-manager-credentials
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        username:
          text: |-
            {{- template "requiredValue" (dict "key" "username" "value" (get .Secrets "username")) -}}
        password:
          text: |-
            {{- template "requiredValue" (dict "key" "password" "value" (get .Secrets "password")) -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-r2-credentials
  namespace: cloudnative-pg
spec:
  vaultAuthRef: openbao-postgresql
  mount: kv
  type: kv-v2
  path: platform/r2
  refreshAfter: 1m
  destination:
    create: true
    name: postgresql-r2-credentials
    type: Opaque
    transformation:
      excludeRaw: true
      transformationRefs:
        - name: required-openbao-value
          namespace: vault-secrets-operator
      templates:
        access-key-id:
          text: |-
            {{- template "requiredValue" (dict "key" "access-key-id" "value" (get .Secrets "access-key-id")) -}}
        secret-access-key:
          text: |-
            {{- template "requiredValue" (dict "key" "secret-access-key" "value" (get .Secrets "secret-access-key")) -}}
        region:
          text: |-
            {{- template "requiredValue" (dict "key" "region" "value" (get .Secrets "region")) -}}
        AWS_ACCESS_KEY_ID:
          text: |-
            {{- template "requiredValue" (dict "key" "access-key-id" "value" (get .Secrets "access-key-id")) -}}
        AWS_SECRET_ACCESS_KEY:
          text: |-
            {{- template "requiredValue" (dict "key" "secret-access-key" "value" (get .Secrets "secret-access-key")) -}}
        AWS_REGION:
          text: |-
            {{- template "requiredValue" (dict "key" "region" "value" (get .Secrets "region")) -}}
        S3_ENDPOINT:
          text: |-
            {{- template "requiredValue" (dict "key" "endpoint" "value" (get .Secrets "endpoint")) -}}
---
apiVersion: database.vault.upbound.io/v1alpha1
kind: SecretBackendConnection
metadata:
  name: postgresql
spec:
  deletionPolicy: Orphan
  forProvider:
    backend: database
    name: k3s-postgres
    allowedRoles:
      - grafana
      - radar
    postgresql:
      - connectionUrl: "postgresql://{{username}}:{{password}}@k3s-postgres-rw.cloudnative-pg.svc:5432/postgres?sslmode=disable"
        username: openbao_manager
        passwordSecretRef:
          name: openbao-manager-credentials
          namespace: cloudnative-pg
          key: password
  providerConfigRef:
    name: openbao
