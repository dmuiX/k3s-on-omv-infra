apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: k3s-postgres
  namespace: cloudnative-pg
spec:
  instances: 3
  # Stop waiting for existing sessions early, then use CNPG's clean fast shutdown.
  # Keep the overall WAL/replication shutdown and switchover limits unchanged.
  smartShutdownTimeout: 15
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-bookworm@sha256:17b1b2d8b41398e4a5aa5466b49c866cb500dcaf08e9a4923ca443f2cd13c25a
  enableSuperuserAccess: false
  managed:
    roles:
      - name: openbao_manager
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: true
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: 10
        passwordSecret:
          name: openbao-manager-credentials
  enablePDB: true
  primaryUpdateStrategy: supervised
  primaryUpdateMethod: switchover
  storage:
    storageClass: longhorn-single-node-retain
    size: 40Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: k3s-postgres
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      password_encryption: scram-sha-256
      archive_timeout: 5min
      max_slot_wal_keep_size: 10GB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
      maxStandbyNamesFromCluster: 2
      failoverQuorum: true
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: k3s-postgres-backups
  backup:
    target: prefer-standby
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: k3s-postgres-daily
  namespace: cloudnative-pg
spec:
  schedule: "0 7 2 * * *"
  backupOwnerReference: self
  cluster:
    name: k3s-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
