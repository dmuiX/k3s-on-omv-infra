apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: postgresql-strict
  namespace: cloudnative-pg
spec:
  mtls:
    mode: STRICT
---
# The Kubernetes API server cannot originate HBONE. Its admission request
# already uses CNPG's authenticated HTTPS webhook on workload port 9443.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: cnpg-webhook
  namespace: cloudnative-pg
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  mtls:
    mode: STRICT
  portLevelMtls:
    9443:
      mode: PERMISSIVE
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cloudnative-pg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: k3s-postgres
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql
  namespace: cloudnative-pg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: k3s-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 15008
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openbao
                  - kube-prometheus-stack
                  - radar
                  - backup-validation
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 15008
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: k3s-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 15008
    # CNPG instance-manager calls the Barman plugin in this namespace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: plugin-barman-cloud
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 15008
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # API egress is granted separately by Live's allow-postgresql-api policy,
    # using the cluster's exact API Service and control-plane endpoint IPs.
